[project]
name = "pantherclaw"
version = "0.0.0"
description = "PantherClaw Authority Protocol (PAP/1) client for agent workloads and verifier for target services"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantherclaw"]
