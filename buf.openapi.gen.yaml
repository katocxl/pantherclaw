# Build-only local plugin, isolated from the product dependency graph.
version: v2
plugins:
  - local: ["go", "tool", "-modfile=tools/pins/connect-openapi/go.mod", "protoc-gen-connect-openapi"]
    out: docs/api
    strategy: all
    opt:
      - format=json
      - path=pantherclaw.openapi.json
      - content-types=json
      - base=tools/api/openapi.base.yaml
      - override=tools/api/openapi.override.yaml
