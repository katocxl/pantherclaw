- name: a_refused_delegation_suspends_its_run
  kind: NORMAL
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000301}
    subjects: [{type: run, id: 0192f942-0000-7000-8000-000000000302}]
  stubs:
    contain: [{state: WAITING}, {state: DONE, effect: CHANGED, refs: [response_action]}]
  expect:
    state: SUCCEEDED
    steps: {contain: DONE}
- name: the_containment_is_refused
  kind: DENIED
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000304}
    subjects: [{type: run, id: 0192f942-0000-7000-8000-000000000302}]
  stubs:
    contain: [{state: FAILED, reason: CONTAINMENT_UNSUPPORTED}]
  expect:
    state: FAILED
    reason: CONTAINMENT_UNSUPPORTED
    steps: {contain: FAILED}
- name: the_containment_does_not_hold_in_time
  kind: TIMEOUT
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000305}
    subjects: [{type: run, id: 0192f942-0000-7000-8000-000000000302}]
  stubs:
    contain: [{state: WAITING}]
  expect:
    state: FAILED
    reason: TIMEOUT
    steps: {contain: FAILED}
- name: the_same_alert_twice_starts_one_execution
  kind: DUPLICATE
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000306}
    subjects: [{type: run, id: 0192f942-0000-7000-8000-000000000302}]
  stubs:
    contain: [{state: DONE, effect: CHANGED, refs: [response_action]}]
  expect:
    state: SUCCEEDED
