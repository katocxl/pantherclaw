- name: the_agent_is_claimed
  kind: NORMAL
  trigger:
    params: {agent: 0192f000-0000-7000-8000-0000000000f1}
  stubs:
    propose: [{state: DONE, refs: [automation_proposal]}]
    baseline: [{state: DONE, refs: [automation_proposal]}]
    safe_tests: [{state: DONE, refs: [automation_proposal]}]
    claim: [{state: WAITING}, {state: DONE, refs: [agent]}]
  expect:
    state: SUCCEEDED
    steps: {propose: DONE, routes: DONE, baseline: DONE, safe_tests: DONE, tell: DONE, claim: DONE}
- name: the_route_inspection_is_refused
  kind: DENIED
  trigger:
    params: {agent: 0192f000-0000-7000-8000-0000000000f2}
  stubs:
    routes: [{state: FAILED, reason: AUTHORITY_CHANGED}]
  expect:
    state: FAILED
    reason: AUTHORITY_CHANGED
    steps: {propose: DONE, routes: FAILED}
- name: nobody_claims_the_agent_in_time
  kind: TIMEOUT
  trigger:
    params: {agent: 0192f000-0000-7000-8000-0000000000f3}
  stubs:
    baseline: [{state: DONE, refs: [automation_proposal]}]
    claim: [{state: WAITING}, {state: FAILED, reason: TIMEOUT}]
  expect:
    state: FAILED
    reason: TIMEOUT
    steps: {baseline: DONE, claim: FAILED}
- name: the_same_discovery_twice_starts_one_execution
  kind: DUPLICATE
  trigger:
    params: {agent: 0192f000-0000-7000-8000-0000000000f4}
  stubs:
    baseline: [{state: DONE, refs: [automation_proposal]}]
    claim: [{state: DONE, refs: [agent]}]
  expect:
    state: SUCCEEDED
