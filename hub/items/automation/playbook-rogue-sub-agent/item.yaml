name: pc.playbook.rogue-sub-agent
version: 1.0.0
kind: automation
title: "Playbook: rogue sub-agent"
summary: >-
  When a confirmed alert says an agent issued or approved its own authority,
  suspend the run behind it and open a case. A deep delegation chain is an
  inference, so on that alert only the case opens. The contain step needs
  Business.
body:
  automation_name: hub-playbook-rogue-sub-agent
  purpose: Suspend the run of an agent that gave itself authority and open a case so a person reviews its delegation.
  work_kind: SECURITY_WORK
  definition: |
    apiVersion: automations.pantherclaw.dev/v1
    kind: Automation
    purpose: "Suspend the run of an agent that gave itself authority and open a case so a person reviews its delegation."
    work_kind: SECURITY_WORK
    when:
      event:
        on: alert.raised
        where: event.attrs["rule"] in ["pc.authority.self_issue", "pc.authority.self_approve", "pc.delegation.depth_anomaly"]
        params:
          signal: {from: attrs.id, type: uuid}
          basis: {from: attrs.basis, type: enum, values: [OBSERVED, RULE_MATCH, INFERRED, HYPOTHESIS], required: false}
      dedupe:
        key: "{{params.signal}}"
        window: 1d
    authority:
      principal: self
      platform:
        - step: contain
          scopes: [TRIGGER_RUN]
        - step: open_case
          scopes: [TRIGGER_SUBJECTS]
    do:
      - id: contain
        step: contain
        when: '"basis" in trigger.params && trigger.params.basis in ["OBSERVED", "RULE_MATCH"]'
        with:
          action: SUSPEND_RUN
          subject: TRIGGER_RUN
          reason: "Rogue sub-agent playbook: confirmed signal {{params.signal}}."
        timeout: 15m
        on_failure: ESCALATE
      - id: case
        step: open_case
        with:
          title: "Review the delegation behind signal {{params.signal}}"
          questions:
            - Which parent run started this agent, and what did it delegate?
            - Did the agent use the authority it gave itself?
            - Should a person revoke the grants of the chain?
    finish_when:
      - step: case
        condition: CASE_OPENED
    limits:
      deadline: 1h
