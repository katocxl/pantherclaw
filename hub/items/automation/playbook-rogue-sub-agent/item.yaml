name: pc.playbook.rogue-sub-agent
version: 1.0.0
kind: automation
title: "Playbook: rogue sub-agent"
summary: >-
  When an alert says an agent tried to widen or approve its own authority, open
  a case first, then, on a confirmed alert that names a grant, revoke that
  grant. Only a refused delegation names one, the grant it tried to exceed. A
  refused issue or approval, and an inferred deep chain, only open the case.
  Before the draft validates, a person sets whose grants it may revoke
  (authority.revocable) and a review date. This playbook needs Business; on
  Team it does not run.
body:
  automation_name: hub-playbook-rogue-sub-agent
  purpose: Open a case on an agent that tried to give itself authority, and revoke the grant a confirmed refused delegation names.
  work_kind: SECURITY_WORK
  definition: |
    apiVersion: automations.pantherclaw.dev/v1
    kind: Automation
    purpose: "Open a case on an agent that tried to give itself authority, and revoke the grant a confirmed refused delegation names."
    work_kind: SECURITY_WORK
    when:
      event:
        on: alert.raised
        where: event.attrs["rule"] in ["pc.authority.self_issue", "pc.authority.self_approve", "pc.delegation.depth_anomaly"]
        params:
          signal: {from: attrs.id, type: uuid}
          basis: {from: attrs.basis, type: enum, values: [OBSERVED, RULE_MATCH, INFERRED, HYPOTHESIS], required: false}
          grant: {from: subjects.grant, type: uuid, required: false}
      dedupe:
        key: "{{params.signal}}"
        window: 1d
    authority:
      principal: self
      platform:
        - step: open_case
          scopes: [TRIGGER_SUBJECTS]
        - step: contain
          scopes: [TRIGGER_GRANT]
    do:
      - id: case
        step: open_case
        with:
          title: "Review the delegation behind signal {{params.signal}}"
          questions:
            - Which parent run started this agent, and what did it try to delegate or approve?
            - Did the agent use any authority it gave itself?
            - Should a person revoke more grants of the chain?
      - id: contain
        step: contain
        when: '"basis" in trigger.params && trigger.params.basis in ["OBSERVED", "RULE_MATCH"] && "grant" in trigger.params'
        with:
          action: REVOKE_GRANT
          subject: TRIGGER_GRANT
          reason: "Rogue sub-agent playbook: confirmed signal {{params.signal}}."
        timeout: 15m
        on_failure: ESCALATE
    finish_when:
      - step: case
        condition: CASE_OPENED
    limits:
      deadline: 1h
