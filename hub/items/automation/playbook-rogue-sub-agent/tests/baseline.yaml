- name: an_alert_opens_a_case
  kind: NORMAL
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000201}
    subjects: [{type: grant, id: 0192f942-0000-7000-8000-000000000202}]
  stubs:
    case: [{state: DONE, effect: CHANGED, refs: [case]}]
  expect:
    state: SUCCEEDED
    steps: {case: DONE}
- name: the_case_is_refused
  kind: DENIED
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000204}
  stubs:
    case: [{state: FAILED, reason: AUTHORITY_CHANGED}]
  expect:
    state: FAILED
    reason: AUTHORITY_CHANGED
    steps: {case: FAILED}
- name: the_case_does_not_open_in_time
  kind: TIMEOUT
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000205}
  stubs:
    case: [{state: FAILED, reason: TIMEOUT}]
  expect:
    state: FAILED
    reason: TIMEOUT
    steps: {case: FAILED}
- name: the_same_alert_twice_starts_one_execution
  kind: DUPLICATE
  trigger:
    params: {signal: 0192f942-0000-7000-8000-000000000206}
  stubs:
    case: [{state: DONE, effect: CHANGED, refs: [case]}]
  expect:
    state: SUCCEEDED
