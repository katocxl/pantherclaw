name: pc.playbook.poisoned-mcp-server
version: 1.0.0
kind: automation
title: "Playbook: poisoned MCP server"
summary: >-
  When a confirmed alert says an MCP tool changed under an agent, suspend the
  run that used it and open a case to review the server. Instruction-like text
  in a tool description is an inference, so on that alert only the case opens.
  Revoking the server stays a person's step. The contain step needs Business.
body:
  automation_name: hub-playbook-poisoned-mcp-server
  purpose: Suspend the run behind a confirmed tool-drift alert and open a case so a person reviews the MCP server.
  work_kind: SECURITY_WORK
  definition: |
    apiVersion: automations.pantherclaw.dev/v1
    kind: Automation
    purpose: "Suspend the run behind a confirmed tool-drift alert and open a case so a person reviews the MCP server."
    work_kind: SECURITY_WORK
    when:
      event:
        on: alert.raised
        where: event.attrs["rule"] in ["pc.tools.drift", "pc.tools.description_injection"]
        params:
          signal: {from: attrs.id, type: uuid}
          basis: {from: attrs.basis, type: enum, values: [OBSERVED, RULE_MATCH, INFERRED, HYPOTHESIS], required: false}
      dedupe:
        key: "{{params.signal}}"
        window: 1d
    authority:
      principal: self
      platform:
        - step: contain
          scopes: [TRIGGER_RUN]
        - step: open_case
          scopes: [TRIGGER_SUBJECTS]
    do:
      - id: contain
        step: contain
        when: '"basis" in trigger.params && trigger.params.basis in ["OBSERVED", "RULE_MATCH"]'
        with:
          action: SUSPEND_RUN
          subject: TRIGGER_RUN
          reason: "Poisoned MCP server playbook: confirmed signal {{params.signal}}."
        timeout: 15m
        on_failure: ESCALATE
      - id: case
        step: open_case
        with:
          title: "Review the MCP server behind signal {{params.signal}}"
          questions:
            - Which tool changed, and does its new description or schema ask the agent to do anything?
            - Which other agents use this server?
            - Should a person revoke the server in the MCP catalog?
    finish_when:
      - step: case
        condition: CASE_OPENED
    limits:
      deadline: 1h
