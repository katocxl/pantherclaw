name: pc.coding.no-secrets-outbound
version: 1.0.0
kind: policy_template
title: No secrets in outbound text
summary: >-
  A pull request body or a Slack message that holds something shaped like a
  GitHub token, an AWS access key id or a private key is refused. It is a
  heuristic over the text: a secret in another shape passes.
body:
  rules:
    - id: ns-pull-body
      per: org
      kind: FORBID
      summary: a pull request body holds no token or private key
      operations: [github.pull.create]
      when: |-
        has(action.params.body) && action.params.body.matches(r'(gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)')
      reason: SECRET_OUTBOUND
    - id: ns-slack-text
      per: org
      kind: FORBID
      summary: a Slack message holds no token or private key
      operations: [slack.message.post]
      when: |-
        action.params.text.matches(r'(gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)')
      reason: SECRET_OUTBOUND
  tests:
    - {"id": "ns-pull-key", "per": "org", "summary": "a pull request body with a private key header is refused",
      "action": {"operation": "github.pull.create", "target": {"type": "github.repository", "id": "acme/api"},
        "params": {"title": "Notes", "body": "see -----BEGIN RSA PRIVATE KEY\x2d---- below", "head": "notes", "base": "main"}},
      "expect": {"decision": "DENY", "reason": "SECRET_OUTBOUND"}}
    - {"id": "ns-pull-clean", "per": "org", "summary": "a pull request body with no secret goes through",
      "action": {"operation": "github.pull.create", "target": {"type": "github.repository", "id": "acme/api"},
        "params": {"title": "Notes", "body": "Summary of the change.", "head": "notes", "base": "main"}},
      "expect": {"decision": "ALLOW", "reason": "GRANT_COVERS"}}
    - {"id": "ns-pull-no-body", "per": "org", "summary": "a pull request with no body goes through",
      "action": {"operation": "github.pull.create", "target": {"type": "github.repository", "id": "acme/api"},
        "params": {"title": "Notes", "head": "notes", "base": "main"}},
      "expect": {"decision": "ALLOW", "reason": "GRANT_COVERS"}}
    - {"id": "ns-slack-key", "per": "org", "summary": "a Slack message with a private key header is refused",
      "action": {"operation": "slack.message.post", "target": {"type": "slack_channel", "id": "C0EXAMPLE01"},
        "params": {"text": "-----BEGIN OPENSSH PRIVATE KEY\x2d----"}},
      "given": {"grant": {"constraints": [{"kind": "destination_set", "values": ["C0EXAMPLE01"]}]}, "facts": {"slack.channel.external": {"value": {"object": {"external": false, "ext_shared": false, "shared": false}}, "age_seconds": 10}}},
      "expect": {"decision": "DENY", "reason": "SECRET_OUTBOUND"}}
    - {"id": "ns-slack-clean", "per": "org", "summary": "a Slack message with no secret goes through",
      "action": {"operation": "slack.message.post", "target": {"type": "slack_channel", "id": "C0EXAMPLE01"},
        "params": {"text": "The build is green"}},
      "given": {"grant": {"constraints": [{"kind": "destination_set", "values": ["C0EXAMPLE01"]}]}, "facts": {"slack.channel.external": {"value": {"object": {"external": false, "ext_shared": false, "shared": false}}, "age_seconds": 10}}},
      "expect": {"decision": "ALLOW", "reason": "GRANT_COVERS"}}
