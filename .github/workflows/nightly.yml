#
# Nightly assurance (SG09): deeper checks on main and re-assessment of
# released versions when new vulnerability data appears. M13 adds schema
# assurance on a disposable server and bounded fuzzing of security parsers.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

env:
  GOFLAGS: -mod=readonly
  TASK: go tool -modfile=tools/pins/task/go.mod task

jobs:
  api-and-fuzz:
    name: API conformance and security parser fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pc-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.13.0
          enable-cache: false
      - name: Regenerate the protobuf API schema
        run: |
          $TASK api:schema
          git diff --exit-code -- docs/api/pantherclaw.openapi.json
      - name: Install the locked build-only API tools
        run: uv sync --locked --project tools/api
      - name: Authenticated API property checks on a disposable database
        env:
          PC_TEST_API_SCHEMA: "1"
          PC_TEST_REQUIRE_DB: "1"
          PC_TEST_PG_ADMIN_URL: postgres://postgres:pc-nightly-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/postgres?sslmode=disable
        run: go test -tags integration -count=1 -timeout 20m -run '^TestM13_APIConformance$' ./internal/server
      - name: Bounded security parser fuzzing
        env:
          GOMAXPROCS: "2"
          PC_FUZZ_TIME: 30s
        run: bash tools/scripts/fuzz-nightly.sh
      - name: Static documentation build
        run: $TASK docs:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: security-parser-fuzz-regressions
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 7

  race-and-vuln:
    name: race tests + govulncheck (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: Race tests (repeated, shuffled)
        run: |
          for m in . sdk/go tools; do go -C "$m" test -race -shuffle=on -count=3 ./...; done
      - name: govulncheck (product modules)
        run: $TASK vuln
      - name: OSV scan of pinned dev tools (not shipped; findings are warnings)
        run: |
          go tool -modfile=tools/pins/osv-scanner/go.mod osv-scanner scan source --recursive tools/pins \
            || echo "::warning::vulnerabilities reported in pinned dev tools (not shipped) — review and bump pins"

  released-versions:
    name: re-scan latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: govulncheck at the latest release tag
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then echo "::notice::no release tags yet"; exit 0; fi
          git checkout --quiet "$tag"
          git checkout --quiet "$GITHUB_SHA" -- tools/pins
          go tool -modfile=tools/pins/govulncheck/go.mod govulncheck ./...
