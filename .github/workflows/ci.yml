# SPDX-License-Identifier: BUSL-1.1
# Copyright (c) 2026 Joshua Kato. See LICENSE and NOTICE.
#
# Pull-request and main-branch gate. The ONLY required status check is `ci-ok`,
# which fails if any job failed or was cancelled (skipped jobs are fine).
# Hardening: SHA-pinned actions, no token persistence, least-privilege
# per-job permissions, no pull_request_target (HR-130).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly
  TASK: go tool -modfile=tools/pins/task/go.mod task

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go == 'true' || github.event_name != 'pull_request' }}
      range: ${{ steps.filter.outputs.range == 'true' || github.event_name != 'pull_request' }}
      sandbox: ${{ steps.filter.outputs.sandbox == 'true' || github.event_name != 'pull_request' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || github.event_name != 'pull_request' }}
      python: ${{ steps.filter.outputs.python == 'true' || github.event_name != 'pull_request' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '.golangci.yml'
              - 'Taskfile.yml'
              - 'tools/**'
              - 'proto/**'
              - 'migrations/**'
              - 'queries/**'
            range:
              - 'internal/authority/**'
              - 'internal/gateway/**'
              - 'internal/sandbox/**'
              - 'internal/redteam/**'
              - 'packages/**'
              - 'redteam/**'
              - 'test/e2e/**'
            sandbox:
              - 'internal/sandbox/**'
              - 'internal/gateway/**'
              - 'internal/authority/**'
              - 'internal/coverage/**'
              - 'internal/evidence/**'
              - 'packages/**'
              - 'internal/sim/**'
              - 'internal/pclaw/**'
              - 'cmd/pantherclaw-edge/**'
              - 'cmd/pantherclaw-probe/**'
              - 'deploy/sandbox/**'
              - 'redteam/**'
              - 'test/e2e/**'
            workflows:
              - '.github/**'
            python:
              - 'sdk/python/**'
              - 'sdk/conformance/**'
              - 'integrations/claude-agent-sdk/python/**'
              - 'integrations/langchain/python/**'
              - 'integrations/openai-agents/python/**'
              - 'integrations/crewai/python/**'
            typescript:
              - 'sdk/typescript/**'
              - 'sdk/conformance/**'
              - 'integrations/claude-code/**'
              - 'integrations/claude-agent-sdk/typescript/**'
              - 'integrations/vercel-ai/typescript/**'
              - 'integrations/mcp/typescript/**'

  go-static:
    name: go / format, headers, lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # buf breaking compares against origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: Verify modules
        run: |
          for m in . sdk/go sdk/go/internal/sqltest tools; do (cd "$m" && go mod verify && go mod tidy -diff); done
      - name: Traceability (every HR/T due by the last completed milestone has a test)
        run: $TASK trace
      - name: Generated code is up to date (buf, sqlc)
        run: $TASK gen:check
      - name: Format
        run: $TASK fmt:check
      - name: Licence headers
        run: $TASK license:check
      - name: Lint
        run: $TASK lint
      - name: Migrations (squawk, pinned binary checked against its SHA-256)
        run: $TASK lint:migrations
      - name: Protobuf breaking changes against main (buf breaking)
        run: $TASK proto:breaking

  go-test:
    name: go / test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: Unit tests (race detector on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then $TASK test:race; else $TASK test; fi
      - name: Build all binaries
        shell: bash
        run: $TASK build

  go-integration:
    name: go / integration (postgres)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    # The packages alone take 17-40 minutes locally; the race detector adds more.
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Third-party OpenID provider for the M2 interoperability e2e test.
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
        ports:
          - 8181:8080
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: Integration tests as pc_app (race detector; test/e2e runs in its own job)
        env:
          PC_TEST_REQUIRE_DB: "1"
          PC_TEST_PG_ADMIN_URL: postgres://postgres:pc-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/postgres?sslmode=disable
          PC_TEST_MOCK_OIDC_URL: http://127.0.0.1:8181
        # The package list is built first, so a failing `go list` fails the step.
        run: |
          pkgs="$(go list -tags integration ./...)"
          pkgs="$(printf '%s\n' "$pkgs" | grep -v '/test/e2e$')"
          [ -n "$pkgs" ] || { echo "::error::no integration packages listed"; exit 1; }
          # shellcheck disable=SC2086 # one argument per package
          go test -race -tags integration -shuffle=on -count=1 -timeout 75m $pkgs
      - name: The Go SDK's SQL replay store on PostgreSQL (T-081)
        env:
          PC_TEST_REQUIRE_DB: "1"
          PC_TEST_PG_ADMIN_URL: postgres://postgres:pc-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/postgres?sslmode=disable
        run: go -C sdk/go/internal/sqltest test -count=1 ./...

  e2e:
    name: go / end-to-end (postgres)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Third-party OpenID provider for the M2 interoperability e2e test.
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
        ports:
          - 8181:8080
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: End-to-end tests as pc_app (race detector; the range has its own jobs)
        env:
          PC_TEST_REQUIRE_DB: "1"
          PC_TEST_PG_ADMIN_URL: postgres://postgres:pc-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/postgres?sslmode=disable
          PC_TEST_MOCK_OIDC_URL: http://127.0.0.1:8181
        run: go test -race -tags integration -shuffle=on -count=1 -timeout 60m -skip TestRange_Scenarios ./test/e2e/

  sandbox:
    name: sandbox (docker, M9 exit, sandbox range scenarios)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Third-party OpenID provider for the M2 interoperability e2e test.
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
        ports:
          - 8181:8080
    steps:
      # Fail fast on an engine the sandbox refuses (HR-218); nothing else runs first.
      - name: Docker engine 28 or later (HR-218)
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          echo "Docker server $v"
          [ "${v%%.*}" -ge 28 ] || { echo "::error::Docker server $v; the sandbox needs 28 or later (HR-218)"; exit 1; }
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      # The runner's Docker engine (>= 28, HR-218) runs the sandboxes; every
      # network, container and image the tests create has a fresh name.
      - name: Docker sandbox, connector and M9 exit tests (task test:sandbox)
        env:
          PC_PG_TEST_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: $TASK test:sandbox
      - name: Every attack scenario, sandbox ones included (SANDBOX=1 task range)
        env:
          PC_PG_TEST_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
          SANDBOX: "1"
        run: $TASK range
      - name: The v0.1.0 preview tests (task test:preview, once that task exists)
        env:
          PC_PG_TEST_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: if $TASK --list | grep -q 'test:preview'; then $TASK test:preview; fi

  range:
    name: range (adversarial scenarios)
    needs: changes
    if: needs.changes.outputs.range == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pc-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
        ports:
          - 8181:8080
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: Every attack scenario against the simulators (HR-226)
        env:
          PC_TEST_REQUIRE_DB: "1"
          PC_TEST_PG_ADMIN_URL: postgres://postgres:pc-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/postgres?sslmode=disable
          PC_TEST_MOCK_OIDC_URL: http://127.0.0.1:8181
        run: go test -tags integration -count=1 -timeout 30m -run TestRange_Scenarios ./test/e2e/

  go-vuln:
    name: go / govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: govulncheck (reachability)
        run: $TASK vuln

  secrets:
    name: security / secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: gitleaks (working tree)
        run: $TASK secrets

  semgrep:
    name: security / semgrep
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Semgrep CE (project rules)
        run: uvx --from 'semgrep==1.178.0' semgrep scan --config tools/semgrep --error --metrics=off --disable-version-check

  osv:
    name: security / osv-scanner
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
      - name: OSV-Scanner (product lockfiles; dev-tool pins are covered by govulncheck in nightly)
        run: go tool -modfile=tools/pins/osv-scanner/go.mod osv-scanner scan source --recursive --experimental-exclude=tools/pins .

  dependency-review:
    name: security / dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # LicenseRef-scancode-google-patent-license-golang is the PATENTS grant
          # shipped with every golang.org/x module (BSD-3-Clause code plus a
          # permissive patent licence); see DEPENDENCY_POLICY section 1.
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, Unicode-DFS-2016,
            Unicode-3.0, CC0-1.0, 0BSD, BlueOak-1.0.0, Python-2.0, PSF-2.0, Zlib,
            LicenseRef-scancode-google-patent-license-golang
          # json-schema (AFL-2.1/AFL-3.0/BSD-3-Clause, via ai) and json-schema-typed
          # (BSD-2-Clause AND JSON, via @modelcontextprotocol/sdk) come only with the
          # TypeScript framework wrappers' pinned dev and test installs, never with a
          # published package (DEPENDENCY_POLICY, SDK dependencies; M14 D126).
          # rivershared is MPL-2.0 with an MIT-licensed levenshtein subpackage; the
          # scanner reports the pair as LicenseRef-bad-mit-mpl-2.0. Both licences
          # are allowed (DEPENDENCY_POLICY section 1).
          # The others are dependencies of the buf and sqlc dev-tool pins only,
          # never linked into shipped artifacts; their extra licences cover
          # documentation (CC-BY), the DCO, MIT-0 and the PostgreSQL licence
          # (DEPENDENCY_POLICY, dev tools).
          allow-dependencies-licenses: >-
            pkg:npm/json-schema,
            pkg:npm/json-schema-typed,
            pkg:golang/github.com/riverqueue/river/rivershared,
            pkg:golang/github.com/opencontainers/go-digest,
            pkg:golang/github.com/opencontainers/image-spec,
            pkg:golang/github.com/segmentio/asm,
            pkg:golang/github.com/fatih/structtag,
            pkg:golang/github.com/pganalyze/pg_query_go/v6

  workflows:
    name: security / workflows (zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            tools/pins/actionlint/go.sum
      - name: actionlint
        run: $TASK lint:workflows
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: regular
          min-severity: low

  # The SDK jobs run what `task sdk:check` runs: each package declares only
  # its tests (node:test, unittest), and the integrations' tests run inside
  # the real Agent SDKs pinned in their lockfiles.
  python-sdk:
    name: sdk / python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: SDK, Agent SDK integration and framework wrapper tests (Python 3.13 and 3.14)
        # No committed lock contains CrewAI (M14 D60): its wrapper's tests run on a stand-in for CrewAI's tool interface; task sdk:crewai-real runs them in the real CrewAI, locally.
        run: |
          for py in 3.13 3.14; do
            (cd sdk/python && PYTHONPATH=src uv run --locked --python "$py" python -m unittest discover -s tests)
            for d in claude-agent-sdk langchain openai-agents crewai; do
              (cd "integrations/$d/python" && uv run --locked --python "$py" python -m unittest discover -s tests)
            done
          done

  typescript-sdk:
    name: sdk / typescript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: SDK tests (no dependencies)
        working-directory: sdk/typescript
        run: node --test "test/**/*.test.ts"
      - name: Agent SDK integration tests (pnpm through packageManager and Corepack)
        working-directory: integrations/claude-agent-sdk/typescript
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack pnpm install --frozen-lockfile
          node --test "test/**/*.test.ts"
      - name: Framework wrapper tests, wrappers.json included (Vercel AI SDK, MCP TypeScript SDK)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          for d in vercel-ai mcp; do
            (cd "integrations/$d/typescript" && corepack pnpm install --frozen-lockfile && node --test "test/**/*.test.ts")
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - go-static
      - go-test
      - go-integration
      - e2e
      - sandbox
      - range
      - go-vuln
      - secrets
      - semgrep
      - osv
      - dependency-review
      - workflows
      - python-sdk
      - typescript-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' > /dev/null
