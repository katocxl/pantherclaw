#
# Tag-driven release (runbook: docs/runbooks/release.md).
#   1. Founder pushes a signed annotated tag vX.Y.Z (`git tag -s`; tag ruleset
#      restricts who can). While Day-0 item 2 (SSH signing) is open, an annotated
#      tag pushed by the founder is acceptable.
#   2. `verify` fails unless the tagged commit is on `main` and its `ci-ok`
#      check run succeeded, then re-runs the core gate on the tagged commit.
#   3. `release` waits for approval of the protected `release` environment
#      (gates G2/G3), builds the server and gateway images from deploy/docker
#      (linux/amd64 + arm64), pushes them to GHCR by digest and attests them,
#      then builds the 7 binaries with GoReleaser into a DRAFT release (pclaw
#      embeds the two image digests for `pclaw up`, G0 M13 D39) and attests
#      every artifact (SLSA provenance via GitHub OIDC).
#   4. `images` builds the edge and probe sandbox images (linux/amd64 + arm64),
#      pushes them to GHCR, attests each image digest, tags all four images by
#      version, appends the digests to the release notes, then publishes the
#      draft (immutable once published).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly
  TASK: go tool -modfile=tools/pins/task/go.mod task

jobs:
  verify:
    name: verify tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read # the ci-ok check run of the tagged commit
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Tagged commit is on main and passed ci-ok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The tagged commit is on main when main is identical to it or ahead of it.
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "ahead" ]; then
            echo "::error::tagged commit ${SHA} is not on main (compare status: ${status})"
            exit 1
          fi
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[]] | sort_by(.started_at) | last | .conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci-ok on ${SHA} is '${conclusion}', not 'success'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: $TASK license:check
      - run: $TASK test:race
      - run: $TASK vuln

  release:
    name: build, attest, publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the draft release and upload assets
      packages: write # push the server and gateway images by digest (pclaw embeds them; G0 M13 D39)
      id-token: write # Sigstore OIDC for artifact attestations
      attestations: write
    env:
      SERVER_IMAGE: ghcr.io/katocxl/pantherclaw-server
      GATEWAY_IMAGE: ghcr.io/katocxl/pantherclaw-gateway
    outputs:
      server-digest: ${{ steps.server.outputs.digest }}
      gateway-digest: ${{ steps.gateway.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            dl.google.com:443
            go.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            gcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            *.r2.cloudflarestorage.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The server and gateway images (G0 M13 D7, D36, D39): built from
      # deploy/docker (distroless, nonroot, linux/amd64 + arm64), pushed by
      # digest only (the images job tags them once the release is complete)
      # and attested, before GoReleaser, so that pclaw names them by digest.
      - name: Image build arguments
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "version=${TAG#v}"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the server image (by digest)
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Build and push the gateway image (by digest)
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/gateway.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.GATEWAY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Check the image digests
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "$SERVER_DIGEST" "$GATEWAY_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest ($d)"; exit 1; }
          done
      - name: Attest server image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true
      - name: Attest gateway image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GATEWAY_IMAGE }}
          subject-digest: ${{ steps.gateway.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: GoReleaser (draft release)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pclaw up runs these images (.goreleaser.yaml ldflags).
          PC_SERVER_IMAGE: ${{ env.SERVER_IMAGE }}@${{ steps.server.outputs.digest }}
          PC_GATEWAY_IMAGE: ${{ env.GATEWAY_IMAGE }}@${{ steps.gateway.outputs.digest }}
      - name: Attest build provenance for every released file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Stage the sandbox binaries for the image build
        run: |
          set -euo pipefail
          mkdir -p sandbox-binaries
          for name in pantherclaw-edge pantherclaw-probe; do
            for arch in amd64 arm64; do
              bin=$(find dist -type f -path "dist/${name}_linux_${arch}*/${name}")
              if [ -z "$bin" ] || [ "$(printf '%s\n' "$bin" | wc -l)" -ne 1 ]; then
                echo "::error::expected exactly one ${name} linux/${arch} binary in dist"
                exit 1
              fi
              mkdir -p "sandbox-binaries/${name}-${arch}"
              cp "$bin" "sandbox-binaries/${name}-${arch}/${name}"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-binaries
          path: sandbox-binaries
          if-no-files-found: error
          retention-days: 1

  images:
    name: sandbox images, tags, publish
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # append the digests to the draft release and publish it
      packages: write # push the images to GHCR (this job only)
      id-token: write # Sigstore OIDC for image attestations
      attestations: write
    env:
      EDGE_IMAGE: ghcr.io/katocxl/pantherclaw-edge
      PROBE_IMAGE: ghcr.io/katocxl/pantherclaw-probe
      SERVER_IMAGE: ghcr.io/katocxl/pantherclaw-server
      GATEWAY_IMAGE: ghcr.io/katocxl/pantherclaw-gateway
      SERVER_DIGEST: ${{ needs.release.outputs.server-digest }}
      GATEWAY_DIGEST: ${{ needs.release.outputs.gateway-digest }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            gcr.io:443
            storage.googleapis.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            *.r2.cloudflarestorage.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandbox-binaries
          path: sandbox-binaries
      - name: Prepare the build contexts
        run: |
          set -euo pipefail
          # Artifact transfer drops the Unix mode bits; the entrypoints must be executable.
          chmod 0755 sandbox-binaries/*/pantherclaw-edge sandbox-binaries/*/pantherclaw-probe
          # The probe image copies an empty /workspace from its build context.
          for arch in amd64 arm64; do mkdir -p "sandbox-binaries/pantherclaw-probe-${arch}/workspace"; done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One single-platform build per image and architecture, each pushed by
      # digest; the digests are joined into a multi-arch index below.
      - name: Build edge (amd64)
        id: edge-amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox-binaries/pantherclaw-edge-amd64
          file: deploy/sandbox/edge.Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.EDGE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Build edge (arm64)
        id: edge-arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox-binaries/pantherclaw-edge-arm64
          file: deploy/sandbox/edge.Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.EDGE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Build probe (amd64)
        id: probe-amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox-binaries/pantherclaw-probe-amd64
          file: deploy/sandbox/probe.Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.PROBE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Build probe (arm64)
        id: probe-arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sandbox-binaries/pantherclaw-probe-arm64
          file: deploy/sandbox/probe.Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.PROBE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Tag the multi-arch images by version
        id: index
        env:
          TAG: ${{ github.ref_name }}
          EDGE_AMD64: ${{ steps.edge-amd64.outputs.digest }}
          EDGE_ARM64: ${{ steps.edge-arm64.outputs.digest }}
          PROBE_AMD64: ${{ steps.probe-amd64.outputs.digest }}
          PROBE_ARM64: ${{ steps.probe-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}" # the same <version> GoReleaser uses; no `latest` tag
          docker buildx imagetools create --tag "${EDGE_IMAGE}:${version}" \
            "${EDGE_IMAGE}@${EDGE_AMD64}" "${EDGE_IMAGE}@${EDGE_ARM64}"
          docker buildx imagetools create --tag "${PROBE_IMAGE}:${version}" \
            "${PROBE_IMAGE}@${PROBE_AMD64}" "${PROBE_IMAGE}@${PROBE_ARM64}"
          # The server and gateway were pushed and attested by digest in the
          # release job; the version tag points at that same index.
          docker buildx imagetools create --tag "${SERVER_IMAGE}:${version}" "${SERVER_IMAGE}@${SERVER_DIGEST}"
          docker buildx imagetools create --tag "${GATEWAY_IMAGE}:${version}" "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}"
          for img in "${SERVER_IMAGE}" "${GATEWAY_IMAGE}"; do
            got=$(docker buildx imagetools inspect "${img}:${version}" --format '{{.Manifest.Digest}}')
            want=$SERVER_DIGEST; [ "$img" = "$GATEWAY_IMAGE" ] && want=$GATEWAY_DIGEST
            [ "$got" = "$want" ] || { echo "::error::${img}:${version} is ${got}, not ${want}"; exit 1; }
          done
          edge=$(docker buildx imagetools inspect "${EDGE_IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          probe=$(docker buildx imagetools inspect "${PROBE_IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          case "$edge$probe" in sha256:*sha256:*) ;; *) echo "::error::no image digest"; exit 1 ;; esac
          echo "edge=${edge}" >> "$GITHUB_OUTPUT"
          echo "probe=${probe}" >> "$GITHUB_OUTPUT"
      - name: Attest edge image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.EDGE_IMAGE }}
          subject-digest: ${{ steps.index.outputs.edge }}
          push-to-registry: true
      - name: Attest probe image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.PROBE_IMAGE }}
          subject-digest: ${{ steps.index.outputs.probe }}
          push-to-registry: true
      - name: Append the image digests to the release notes, then publish (becomes immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          EDGE_DIGEST: ${{ steps.index.outputs.edge }}
          PROBE_DIGEST: ${{ steps.index.outputs.probe }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "**Sandbox images** (linux/amd64, linux/arm64; pin the digest in \`sandbox.images\`, see docs/runbooks/sandbox.md):"
            echo
            echo "- \`${EDGE_IMAGE}@${EDGE_DIGEST}\`"
            echo "- \`${PROBE_IMAGE}@${PROBE_DIGEST}\`"
            echo
            echo "Verify: \`gh attestation verify oci://${EDGE_IMAGE}@${EDGE_DIGEST} --repo ${GITHUB_REPOSITORY}\`"
            echo
            echo "**Server and gateway images** (linux/amd64, linux/arm64; distroless, non-root; \`pclaw up\` of this release runs exactly these, and the Helm chart takes them by digest):"
            echo
            echo "- \`${SERVER_IMAGE}@${SERVER_DIGEST}\`"
            echo "- \`${GATEWAY_IMAGE}@${GATEWAY_DIGEST}\`"
            echo
            echo "Verify: \`gh attestation verify oci://${SERVER_IMAGE}@${SERVER_DIGEST} --repo ${GITHUB_REPOSITORY}\`"
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false
