#
# gitleaks configuration: the default rules plus one path allowlist.
[extend]
useDefault = true

[[allowlists]]
description = "Local, git-ignored compose secrets. Never committed: `task secrets` fails if any .env file other than .env.example is tracked."
paths = ['''^deploy/compose/\.env$''']

[[allowlists]]
description = "SDK conformance vectors: test tokens and proofs signed with keys derived from public names (sdk/conformance/README.md, Fixed keys). They verify only against the vectors' own JWKS and grant nothing anywhere."
paths = [
  '''^sdk/conformance/key_files\.json$''',
  '''^sdk/conformance/workload_tokens\.json$''',
  '''^sdk/conformance/proofs\.json$''',
  '''^sdk/conformance/action_tokens\.json$''',
  '''^sdk/conformance/sdk_face\.json$''',
  '''^sdk/conformance/wrappers\.json$''',
]

[[allowlists]]
description = "Development-only Keycloak realm (bound to 127.0.0.1): its client secret and user passwords are published placeholders, never used outside local development."
paths = ['''^deploy/keycloak/realm-pantherclaw\.json$''']

[[allowlists]]
description = "uv's git-ignored virtual environments (uv run in task sdk:check creates them): installed third-party packages, never committed."
paths = ['''(^|/)\.venv/''']

[[allowlists]]
description = "A decision recording made by the test scenario world (internal/authority/recording, TestHR234_RecordingFromBeforeRolloutsReplaysIdentically, TestM16_V5RecordingReplaysIdentically and TestHR431_AV5RecordingReplaysTheDataFlowHold): SHA-256 digests, a test key thumbprint and random test ids, no secret."
paths = ['''^internal/authority/recording/testdata/recording_v1_hold\.json$''', '''^internal/authority/recording/testdata/recording_v5_risk\.json$''', '''^internal/authority/recording/testdata/recording_v5_dataflow\.json$''']

[[allowlists]]
description = "Local, git-ignored development secrets: the demo's state (`task demo:up`, docs/quickstart.md) and the keys `dev seed` writes. Generated per checkout for loopback-only use; .gitignore keeps them out of commits."
paths = ['''^\.demo/''', '''^deploy/dev/secrets/''']

[[allowlists]]
description = "The built-in detection pack manifest (G0 M10 D12): the SHA-256 of each rule file, keyed by file name (one is identity_key_new_network.yaml). Digests of committed files, no secret. The file is generated and digest-checked at startup, and the HR-241 stale test (TestPackDigestIsCurrent) fails on any hand edit."
paths = ['''^internal/detection/pack/builtin/manifest\.json$''']
