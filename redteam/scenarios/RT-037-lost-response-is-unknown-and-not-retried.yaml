apiVersion: pantherclaw.range/v1
id: RT-037
title: A lost response is UNKNOWN and a retry waits for reconciliation
category: recovery
suite: platform
tier: business
attacker: A11
threats: [T-012, T-013]
rules: [HR-005, HR-078]
requires: [payments]
harness_only: false
steps:
  - id: lose-responses
    do: sim.mutate
    with:
      sim: payments
      change: fault
      args:
        lose_response_rate: 1
  - id: refund-lost
    do: agent.call
    with:
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_1
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: UNKNOWN
      decisive_control: HR-078
  - id: stays-unknown
    do: wait
    with:
      for: effect_unknown
      of: refund-lost
      max_seconds: 5
    expect:
      outcome: UNKNOWN
  - id: retry
    do: agent.call
    with:
      action_of: refund-lost
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_1
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: CANNOT_AUTHORIZE
      reason: RECONCILIATION_REQUIRED
      decisive_control: HR-078
