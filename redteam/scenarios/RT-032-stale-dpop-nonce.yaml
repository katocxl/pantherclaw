apiVersion: pantherclaw.range/v1
id: RT-032
title: A proof carrying a stale nonce is refused
category: boundary
suite: platform
tier: business
attacker: A4
threats: [T-032]
rules: [HR-091]
asi: [ASI03]
asi_why:
  ASI03: "Identity and privilege abuse (ASI03): a proof of the agent's identity is replayed with a stale nonce."
atlas: [AML.T0091.000]
attack: [T1550.001]
technique_why:
  AML.T0091.000: "Application access token (AML.T0091.000): a proof of the agent's identity is replayed with a stale nonce."
  T1550.001: "Application access token (T1550.001): the replayed proof stands in for the agent's own sign-in."
requires: [payments]
harness_only: false
steps:
