apiVersion: pantherclaw.range/v1
id: RT-047
title: An enforcement point cannot ask for decisions as an agent it cannot prove to be
category: boundary
suite: coding-agent
tier: community
attacker: A9
threats: [T-147]
rules: [HR-317, HR-318]
requires: [payments, authzen.evaluate]
harness_only: false
steps:
  - id: token-with-another-key
    do: agent.steal
    with:
      mode: token_without_key
      call:
        face: authzen
        connection: payments
        method: POST
        path: /v1/refunds
        body:
          charge: ch_${fixture.nonce}rt047a
          amount: "20.00"
          currency: USD
          reason: duplicate
    expect:
      outcome: CANNOT_AUTHORIZE
      reason: IDENTITY_UNVERIFIED
      decisive_control: HR-318
  - id: nonce-never-issued
    do: agent.steal
    with:
      mode: stale_nonce
      call:
        face: authzen
        connection: payments
        method: POST
        path: /v1/refunds
        body:
          charge: ch_${fixture.nonce}rt047b
          amount: "20.00"
          currency: USD
          reason: duplicate
    expect:
      outcome: CANNOT_AUTHORIZE
      reason: IDENTITY_UNVERIFIED
      decisive_control: HR-318
  - id: the-agent-itself
    do: agent.call
    with:
      face: authzen
      connection: payments
      method: POST
      path: /v1/refunds
      body:
        charge: ch_${fixture.nonce}rt047c
        amount: "20.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: ALLOW
