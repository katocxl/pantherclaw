apiVersion: pantherclaw.range/v1
id: RT-120
title: A Jira comment that reaches customers is an external disclosure the grant must allow
category: boundary
suite: platform
tier: business
attacker: A1
threats: [T-226]
rules: [HR-522]
requires: [jira.comment]
harness_only: false
steps:
  # A comment on an internal issue the grant names goes through.
  - id: internal-comment
    do: agent.call
    with:
      face: http
      connection: jira
      method: POST
      path: "/rest/api/2/issue/${fixture.jira_internal_issue}/comment"
      body:
        body: "Retries fixed (rt-120-${fixture.nonce})"
    expect:
      outcome: ALLOW
  # The same comment on a help desk ticket reaches the organization's
  # customers: the gateway reads the project as a service desk, the comment
  # predicts jira.issue.disclose, and the grant does not allow it.
  - id: customer-comment
    do: agent.call
    with:
      face: http
      connection: jira
      method: POST
      path: "/rest/api/2/issue/${fixture.jira_customer_issue}/comment"
      body:
        body: "Your refund was sent (rt-120-${fixture.nonce})"
    expect:
      outcome: DENY
      reason: OPERATION_NOT_GRANTED
  # Through the MCP tool it is the same action and the same decision.
  - id: customer-comment-mcp
    do: agent.call
    with:
      face: mcp
      connection: jira
      tool: jira_add_comment
      args:
        issue_key: "${fixture.jira_customer_issue}"
        body: "Your refund was sent (rt-120-${fixture.nonce})"
    expect:
      outcome: DENY
      reason: OPERATION_NOT_GRANTED
