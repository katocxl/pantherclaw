apiVersion: pantherclaw.range/v1
id: RT-031
title: The gateway never dials an unlisted address and never follows a redirect
category: boundary
suite: platform
tier: business
attacker: A11
threats: [T-021, T-015]
rules: [HR-070, HR-077, HR-221]
requires: [payments]
harness_only: false
steps:
  - id: unlisted-address
    do: agent.call
    with:
      face: mcp
      connection: unlisted
      tool: create_refund
      args:
        charge: ch_${fixture.nonce}rt031
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: REFUSED
      code: simulator_unverified
      decisive_control: HR-221
  - id: target-redirects
    do: sim.mutate
    with:
      sim: payments
      change: fault
      args:
        redirect_to: metadata
  - id: refund-redirected
    do: agent.call
    with:
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_${fixture.nonce}rt031
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: UNKNOWN
      decisive_control: HR-077
