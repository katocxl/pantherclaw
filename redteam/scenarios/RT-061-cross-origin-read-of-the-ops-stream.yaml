apiVersion: pantherclaw.range/v1
id: RT-061
title: Another site's page cannot read the live operations stream with a person's session cookie
category: boundary
suite: platform
tier: business
attacker: A9
threats: [T-160]
rules: [HR-344]
requires: [browser]
harness_only: false
steps:
  - id: console-stream
    do: browser.call
    with: {target: ops_stream, origin: same_origin, csrf: true, method: GET, body: json}
    expect:
      outcome: ALLOW
  - id: console-stream-origin-only
    do: browser.call
    with: {target: ops_stream, origin: origin_only, csrf: true, method: GET, body: json}
    expect:
      outcome: ALLOW
  - id: cross-site-event-source
    do: browser.call
    with: {target: ops_stream, origin: cross_site, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: BROWSER_REQUEST_REFUSED
      decisive_control: HR-344
  - id: cross-site-fetch
    do: browser.call
    with: {target: ops_stream, origin: cross_site, csrf: true, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: BROWSER_REQUEST_REFUSED
      decisive_control: HR-344
  - id: sibling-subdomain
    do: browser.call
    with: {target: ops_stream, origin: same_site, csrf: true, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: BROWSER_REQUEST_REFUSED
      decisive_control: HR-344
  - id: old-browser-other-origin
    do: browser.call
    with: {target: ops_stream, origin: other_origin, csrf: true, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: BROWSER_REQUEST_REFUSED
      decisive_control: HR-344
  - id: typed-url
    do: browser.call
    with: {target: ops_stream, origin: typed_url, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: BROWSER_REQUEST_REFUSED
      decisive_control: HR-344
  - id: no-csrf-header
    do: browser.call
    with: {target: ops_stream, origin: same_origin, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: BROWSER_REQUEST_REFUSED
      decisive_control: HR-344
  - id: simple-post
    do: browser.call
    with: {target: ops_stream, origin: cross_site, method: POST, body: text}
    expect:
      outcome: REFUSED
      decisive_control: HR-344
  - id: bearer-and-cookie
    do: browser.call
    with: {target: ops_stream, origin: same_origin, csrf: true, bearer: true, method: GET, body: json}
    expect:
      outcome: REFUSED
      code: AMBIGUOUS_CREDENTIAL
      decisive_control: HR-344
