apiVersion: pantherclaw.range/v1
id: RT-041
title: A Stripe transfer to a payee outside the destination set is denied
category: boundary
suite: platform
tier: business
attacker: A1
threats: [T-142]
rules: [HR-306]
requires: [stripe.transfer]
harness_only: false
steps:
  - id: transfer-to-granted-payee
    do: agent.call
    with:
      face: http
      connection: stripe
      method: POST
      path: /v1/transfers
      body: destination=${fixture.stripe_payee}&amount=1000&currency=usd
    expect:
      outcome: ALLOW
  - id: transfer-elsewhere
    do: agent.call
    with:
      face: http
      connection: stripe
      method: POST
      path: /v1/transfers
      body: destination=${fixture.stripe_other_payee}&amount=1000&currency=usd
    expect:
      outcome: DENY
