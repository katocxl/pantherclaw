apiVersion: pantherclaw.range/v1
id: RT-026
title: Refunds never spend more than the grant's budget
category: boundary
suite: platform
tier: business
attacker: A1
threats: [T-011]
rules: [HR-048, HR-049]
requires: [payments]
harness_only: false
steps:
  - id: refund-1
    do: agent.call
    with:
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_1
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: ALLOW
  - id: refund-2
    do: agent.call
    with:
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_2
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: ALLOW
  - id: refund-3
    do: agent.call
    with:
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_3
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: ALLOW
  - id: refund-4
    do: agent.call
    with:
      face: mcp
      connection: payments
      tool: create_refund
      args:
        charge: ch_4
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      outcome: DENY
