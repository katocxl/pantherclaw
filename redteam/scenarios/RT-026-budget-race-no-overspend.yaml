apiVersion: pantherclaw.range/v1
id: RT-026
title: Concurrent refunds never spend more than the grant's budget
category: boundary
suite: platform
tier: business
attacker: A1
threats: [T-011]
rules: [HR-048, HR-049]
requires: [payments]
harness_only: false
steps:
  - id: refunds-at-once
    do: agent.call
    with:
      face: mcp
      connection: payments
      concurrent: 8
      tool: create_refund
      args:
        charge: "ch_${fixture.nonce}rt026n${n}"
        amount: "30.00"
        currency: USD
        reason: duplicate
    expect:
      max_allow: 3
      decisive_control: HR-048
