apiVersion: pantherclaw.range/v1
id: RT-013
title: A proof used once cannot be replayed with a stolen token
category: boundary
suite: coding-agent
tier: community
attacker: A4
threats: [T-032]
rules: [HR-090, HR-091]
requires: [github]
harness_only: false
steps:
  - id: make-branch
    do: agent.call
    with:
      face: mcp
      connection: github
      tool: create_branch
      args:
        owner: "${fixture.owner}"
        repo: "${fixture.repo}"
        branch: "rt-013-${fixture.nonce}"
        sha: "${fixture.main}"
    expect:
      outcome: ALLOW
  - id: make-file
    do: agent.call
    with:
      face: mcp
      connection: github
      tool: create_or_update_file
      args:
        owner: "${fixture.owner}"
        repo: "${fixture.repo}"
        path: "src/rt-013.go"
        content: "${fixture.file_b64}"
        message: "RT-013: a change to merge"
        branch: "rt-013-${fixture.nonce}"
    expect:
      outcome: ALLOW
  - id: make-pr
    do: agent.call
    with:
      face: mcp
      connection: github
      tool: create_pull_request
      args:
        owner: "${fixture.owner}"
        repo: "${fixture.repo}"
        title: "RT-013 ${fixture.nonce}"
        head: "rt-013-${fixture.nonce}"
        base: main
    save:
      pr: /number
      head: /head/sha
    expect:
      outcome: ALLOW
  - id: replayed-proof
    do: agent.steal
    with:
      mode: proof_replay
      call:
        face: mcp
        connection: github
        tool: pull_request_read
        args:
          method: get
          owner: "${fixture.owner}"
          repo: "${fixture.repo}"
          pullNumber: "${pr}"
    expect:
      outcome: REFUSED
      code: proof_replay
      decisive_control: HR-090
