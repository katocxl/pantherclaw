id: pc.integrity.effect_without_receipt
version: "1"
title: "Integrity: effect without receipt"
description: >-
  The evidence system recorded security.effect_without_receipt, so evidence or enforcement
  integrity is in doubt and someone looks now.
severity: CRITICAL
attention: PAGE
basis: OBSERVED
owasp: [ASI08]
edition: community
on: [audit.security.effect_without_receipt]
tests:
  - name: recorded
    fires: true
    events:
      - {kind: audit.security.effect_without_receipt}
  - name: something else
    fires: false
    events:
      - {kind: audit.security.evidence_integrity_reset}
