id: pc.tools.drift
version: "1"
title: Tool definition drifted from its review
description: >-
  An upstream tool no longer matches the definition its package was reviewed
  against. The package version is quarantined automatically and a person
  reviews it again in the TOOL_REVIEW waitlist; no detection lifts the
  quarantine (PN-006.2, F401, HR-244).
severity: HIGH
attention: ALERT
basis: OBSERVED
atlas: [AML.T0010]
owasp: [ASI04]
edition: community
on: [audit.connection.drift_reported, audit.package.transitioned]
match: >-
  event.kind == "audit.connection.drift_reported"
  || (event.attrs.?to.orValue("") == "QUARANTINED" && event.attrs.?reason.orValue("") == "upstream_drift")
group: connection
tests:
  - name: drift reported
    fires: true
    events:
      - {kind: audit.connection.drift_reported, actor_type: gateway, subjects: {connection: c1}, attrs: {upstream_tool: t}}
  - name: package quarantined for drift
    fires: true
    events:
      - {kind: audit.package.transitioned, subjects: {connection: c1}, attrs: {to: QUARANTINED, reason: upstream_drift}}
  - name: package activated
    fires: false
    events:
      - {kind: audit.package.transitioned, attrs: {to: ACTIVE, reason: reviewed}}
