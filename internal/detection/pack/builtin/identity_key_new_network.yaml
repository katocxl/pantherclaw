id: pc.identity.key_new_network
version: "2"
title: Workload key used from a new network
description: >-
  The same agent instance key presented a token from a network it had not
  used before (HR-092). A copied key is the usual cause (PN-006.3).
severity: HIGH
attention: ALERT
basis: OBSERVED
owasp: [ASI03]
edition: community
on: [audit.security.instance_network_changed]
group: agent
tests:
  - name: network changed
    fires: true
    events:
      - kind: audit.security.instance_network_changed
        actor_type: system
        actor_id: system
        outcome: success
        subjects: {instance: 01930000-0000-7000-8000-0000000000i1, agent: 01930000-0000-7000-8000-0000000000a1}
        attrs: {object_type: instance, agent_id: 01930000-0000-7000-8000-0000000000a1, from_network: 10.0.0.0/24, to_network: 192.0.2.0/24}
  - name: an ordinary token
    fires: false
    events:
      - kind: audit.authn.token_issued
        actor_type: instance
        actor_id: 01930000-0000-7000-8000-0000000000i1
        outcome: success
        subjects: {instance: 01930000-0000-7000-8000-0000000000i1}
