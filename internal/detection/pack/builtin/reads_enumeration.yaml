id: pc.reads.enumeration
version: "1"
title: One run read many different targets
description: >-
  Within 10 minutes, one run was authorized to read 60 or more different
  targets. An agent walking a whole repository, bucket or customer list
  looks like this (G0 M30 D931a, D931b). The rule counts distinct targets
  by a digest of connection and target id; it does not see the ids or the
  data. A read budget (D930) limits the volume itself.
severity: MEDIUM
attention: ALERT
basis: INFERRED
atlas: [AML.T0075]
attack: [T1119, T1530]
edition: business
on: [receipt.decision]
match: >-
  event.decision in ["ALLOW", "ALLOW_WITH_OBLIGATIONS"]
  && (event.attrs.?access.orValue("") == "read"
  || event.operation.matches("\.(read|get|list|search|download|export|fetch|clone)(\.|$)"))
window:
  duration: 10m
  group_by: [subjects.run]
  distinct: attrs.target_digest
  count: 60
group: run
tests:
  - name: sixty targets
    fires: true
    events:
      - {kind: receipt.decision, decision: ALLOW, operation: crm.customer.read, subjects: {run: r1}, attrs: {target_digest: t01}, at: 5s}
      - {kind: receipt.decision, decision: ALLOW, operation: crm.customer.read, subjects: {run: r1}, attrs: {target_digest: t02}, at: 10s}
      - {kind: receipt.decision, decision: ALLOW, operation: crm.customer.read, subjects: {run: r1}, attrs: {target_digest: t03}, at: 15s}
