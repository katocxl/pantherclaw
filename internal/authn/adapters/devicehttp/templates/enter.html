<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>PantherClaw sign-in</title>
<style>
body{font-family:system-ui,sans-serif;max-width:34rem;margin:3rem auto;padding:0 1rem;line-height:1.5;color:#1a1a1a;background:#fff}
h1{font-size:1.4rem}.code{font-family:ui-monospace,monospace;font-size:1.6rem;letter-spacing:.15em}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.25rem 1rem}dt{color:#555}
.warn{border-left:4px solid #b45309;padding:.5rem 1rem;background:#fffbeb}
button,input[type=submit]{font-size:1rem;padding:.5rem 1rem;cursor:pointer}
input[type=text]{font-size:1.2rem;padding:.4rem;font-family:ui-monospace,monospace;text-transform:uppercase}
@media (prefers-color-scheme:dark){body{background:#111;color:#eee}dt{color:#aaa}.warn{background:#2a2108}}
</style>
</head>
<body>
<h1>Sign in to PantherClaw from your terminal</h1>
<p>Enter the code shown by <code>pclaw login</code>.</p>
<form method="get" action="/device">
<input type="hidden" name="org" value="{{.Org}}">
<p><label for="user_code">Code</label><br>
<input type="text" id="user_code" name="user_code" autocomplete="off" required maxlength="16" placeholder="XXXX-XXXX"></p>
<p><input type="submit" value="Next"></p>
</form>
</body>
</html>
