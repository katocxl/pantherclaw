#
# coverage_recovery (D32): when enforcement coverage of a route is lost, a
# person is made responsible, the automations whose launches depend on it
# pause, and they resume - exactly what was paused - once coverage is back.
# If coverage does not come back in time the launches stay paused.
id: coverage_recovery
title: Coverage recovery
summary: >-
  When enforcement coverage is lost, assign an owner, pause the launches that
  depend on it, and resume them once coverage is restored.
edition: TEAM
params:
  - name: purpose
    description: What the automation is for, shown to reviewers and approvers.
    type: string
    pattern: '[^{}$]{1,1000}'
    max_len: 1000
    default: Pause launches that depend on lost coverage until a person restores it.
  - name: review_by
    description: The date (YYYY-MM-DD) by which the owner reviews the automation again; at most 90 days ahead.
    type: string
    format: date
    pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}'
    max_len: 10
    example: "2026-12-31"
  - name: assign_to
    description: Who is made responsible for restoring coverage - the agent's owner, the connection's owner or this automation's owner.
    type: enum
    values: [AGENT_OWNER, CONNECTION_OWNER, OWNER]
    default: AGENT_OWNER
  - name: min_state
    description: The coverage that counts as restored.
    type: enum
    values: [ENFORCED, PARTIAL]
    default: ENFORCED
  - name: coverage_timeout
    description: How long the execution waits for coverage to be restored.
    type: enum
    values: [1h, 4h, 24h, 3d, 6d]
    default: 24h

definition:
  apiVersion: automations.pantherclaw.dev/v1
  kind: Automation
  purpose: "${purpose}"
  work_kind: SECURITY_WORK
  review_by: "${review_by}"
  when:
    event:
      on: coverage.lost
      params:
        agent: {from: subjects.agent, type: uuid}
        connection: {from: subjects.connection, type: uuid, required: false}
        operation: {from: operation, type: string, pattern: '[a-z][a-z0-9_]*(\.[a-z0-9_]+){1,6}', max_len: 128}
    dedupe:
      key: "{{params.agent}}/{{params.connection}}"
      window: 1d
  authority:
    principal: self
    platform:
      - step: assign_owner
        scopes: ["${assign_to}"]
      - step: pause_launches
        scopes: [AFFECTED]
      - step: wait_coverage
        scopes: [TRIGGER_SCOPE]
      - step: resume_launches
        scopes: [AFFECTED]
  do:
    - id: assign
      step: assign_owner
      with:
        to: "${assign_to}"
        summary: "Enforcement coverage was lost for agent {{params.agent}}."
        next_step: Restore the route's enforcement; paused launches resume when coverage is back.
        deadline: 1d
    - id: pause
      step: pause_launches
      with:
        selector: AFFECTED
    - id: restored
      step: wait_coverage
      with:
        min_state: "${min_state}"
        timeout: "${coverage_timeout}"
    - id: resume
      step: resume_launches
      with:
        step: pause
  finish_when:
    - step: restored
      condition: COVERAGE_RESTORED
  limits:
    deadline: 7d

tests:
  - name: coverage comes back and launches resume
    kind: NORMAL
    trigger:
      params: {agent: 0192f000-0000-7000-8000-000000000101, connection: 0192f000-0000-7000-8000-000000000102, operation: tickets.update}
    stubs:
      assign: [{state: DONE, effect: CHANGED, refs: [owned_failure]}]
      pause: [{state: DONE, effect: CHANGED, refs: [automation]}]
      restored: [{state: WAITING}, {state: DONE, refs: [coverage]}]
      resume: [{state: DONE, effect: CHANGED, refs: [automation]}]
    expect:
      state: SUCCEEDED
      steps: {assign: DONE, pause: DONE, restored: DONE, resume: DONE}
  - name: the pause is refused
    kind: DENIED
    trigger:
      params: {agent: 0192f000-0000-7000-8000-000000000103, operation: tickets.update}
    stubs:
      pause: [{state: FAILED, reason: AUTHORITY_CHANGED}]
    expect:
      state: FAILED
      reason: AUTHORITY_CHANGED
      steps: {pause: FAILED}
  - name: coverage does not come back in time and launches stay paused
    kind: TIMEOUT
    trigger:
      params: {agent: 0192f000-0000-7000-8000-000000000104, operation: tickets.update}
    stubs:
      pause: [{state: DONE, effect: CHANGED, refs: [automation]}]
      restored: [{state: WAITING}, {state: FAILED, reason: TIMEOUT}]
    expect:
      state: PARTIALLY_COMPLETED
      reason: TIMEOUT
      steps: {pause: DONE, restored: FAILED}
  - name: the same loss twice starts one execution
    kind: DUPLICATE
    trigger:
      params: {agent: 0192f000-0000-7000-8000-000000000105, connection: 0192f000-0000-7000-8000-000000000106, operation: tickets.update}
    stubs:
      restored: [{state: DONE, refs: [coverage]}]
    expect:
      state: SUCCEEDED
