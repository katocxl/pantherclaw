#
# approved_business_workflow (D32): a signed inbound request, optionally
# approved at a gate, launches a run whose declared tool calls the runner
# agent makes through the gateway (D33, HR-285); the execution finishes only
# on the operation's confirmed effect.
id: approved_business_workflow
title: Approved business workflow
summary: >-
  Turn a signed business request into one approved, bounded run that makes
  only the declared tool call, and finish only when its effect is confirmed.
edition: TEAM
params:
  - name: purpose
    description: What the automation is for, shown to reviewers and approvers.
    type: string
    pattern: '[^{}$]{1,1000}'
    max_len: 1000
    default: Carry out each approved business request with one bounded run and confirm its effect.
  - name: review_by
    description: The date (YYYY-MM-DD) by which the owner reviews the automation again; at most 90 days ahead.
    type: string
    format: date
    pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}'
    max_len: 10
    example: "2026-12-31"
  - name: source
    description: The inbound event source of the requests.
    type: uuid
    example: 0192f000-0000-7000-8000-0000000000a2
  - name: event_type
    description: The inbound event type that starts an execution.
    type: string
    pattern: '[A-Za-z0-9][A-Za-z0-9._:-]{0,99}'
    max_len: 100
    default: request.created
  - name: agent
    description: The runner agent each execution launches; the ceiling holds only this agent.
    type: uuid
    example: 0192f000-0000-7000-8000-0000000000b2
  - name: connection
    description: The connection the runner calls through the gateway.
    type: uuid
    example: 0192f000-0000-7000-8000-0000000000c2
  - name: tool
    description: The MCP tool the runner calls.
    type: string
    pattern: '[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}'
    max_len: 64
    example: create_refund
  - name: operation
    description: The one operation the call performs; the ceiling covers only it and the execution waits for its confirmed effect.
    type: string
    pattern: '[a-z][a-z0-9_]*(\.[a-z0-9_]+){1,6}'
    max_len: 128
    example: payments.refund
  - name: gate
    description: Whether a person approves each request before the launch.
    type: bool
    default: "true"
  - name: approver_role
    description: The role whose members may approve at the gate (the owner never approves).
    type: string
    pattern: '[a-z][a-z0-9_-]{0,63}'
    default: approver
  - name: gate_deadline
    description: How long the gate waits for a decision.
    type: enum
    values: [1h, 4h, 24h, 72h]
    default: 24h
  - name: grant_ttl
    description: How long each issued grant lasts.
    type: enum
    values: [15m, 30m, 1h, 4h, 8h, 24h]
    default: 1h
  - name: run_timeout
    description: How long the execution waits for the run to end.
    type: enum
    values: [30m, 1h, 2h, 4h, 8h, 12h, 24h]
    default: 2h
  - name: effect_timeout
    description: How long the execution waits for the effect to be confirmed.
    type: enum
    values: [15m, 1h, 4h, 24h]
    default: 1h
  - name: runs_per_day
    description: The most grants and runs the automation issues per UTC day.
    type: int
    min: "1"
    max: "1000"
    default: "20"
  - name: budget_currency
    description: The currency of the budgets.
    type: string
    pattern: '[A-Z]{3}'
    max_len: 3
    default: USD
  - name: budget_per_run
    description: The most one execution's grant may spend; required when the operation spends money.
    type: decimal
    required: false
    min: "0.01"
    max: "1000000"
    requires: [budget_per_day]
    example: "250.00"
  - name: budget_per_day
    description: The most the automation's grants may spend per UTC day.
    type: decimal
    required: false
    min: "0.01"
    max: "10000000"
    requires: [budget_per_run]
    example: "2500.00"

definition:
  apiVersion: automations.pantherclaw.dev/v1
  kind: Automation
  purpose: "${purpose}"
  work_kind: AGENT_WORK
  review_by: "${review_by}"
  when:
    inbound:
      source: "${source}"
      type: "${event_type}"
      params:
        ref:
          from: /ref
          type: string
          pattern: '[A-Za-z0-9._:-]{1,64}'
    dedupe:
      key: "{{params.ref}}"
      window: 7d
  authority:
    principal: self
    ceiling:
      agents: ["${agent}"]
      bounds:
        operations: ["${operation}"]
      per_grant:
        ttl: "${grant_ttl}"
        limits:
          $when: {param: budget_per_run, set: true}
          budgets:
            - id: per_run
              grouping: task
              operations: ["${operation}"]
              currency: "${budget_currency}"
              limit: "${budget_per_run}"
              period: none
      per_day:
        grants: "${runs_per_day}"
        runs: "${runs_per_day}"
        budget:
          $when: {param: budget_per_day, set: true}
          $value:
            - currency: "${budget_currency}"
              amount: "${budget_per_day}"
  do:
    - $when: {param: gate, in: ["true"]}
      id: approve
      step: gate
      with:
        approvers:
          roles: ["${approver_role}"]
        exclude: [OWNER]
        min_approvals: 1
        deadline: "${gate_deadline}"
        summary: "Approve request {{params.ref}}"
    - id: launch
      step: launch_run
      with:
        agent: "${agent}"
        task_ref: "{{params.ref}}"
        calls:
          - connection: "${connection}"
            face: MCP
            tool: "${tool}"
            input:
              ref: "{{params.ref}}"
    - id: wait
      step: wait_run
      with:
        step: launch
      timeout: "${run_timeout}"
    - id: confirm
      step: wait_effect
      with:
        step: launch
        operation: "${operation}"
        min: 1
      timeout: "${effect_timeout}"
  finish_when:
    - step: confirm
      condition: EFFECT_CONFIRMED
  limits:
    deadline: 7d

tests:
  - name: the_request_is_approved_and_its_effect_confirmed
    kind: NORMAL
    trigger:
      params: {ref: R-200}
    stubs:
      launch: [{state: DONE, effect: CHANGED, refs: [run], output: {run_bound: "true"}}]
      wait: [{state: WAITING}, {state: DONE, refs: [run]}]
      confirm: [{state: WAITING}, {state: DONE, refs: [receipt]}]
    expect:
      state: SUCCEEDED
      steps:
        approve: {$when: {param: gate, in: ["true"]}, $value: DONE}
        launch: DONE
        wait: DONE
        confirm: DONE
  - $when: {param: gate, in: ["true"]}
    name: the_approver_declines
    kind: DENIED
    trigger:
      params: {ref: R-201}
    stubs:
      approve: [{state: WAITING}, {state: FAILED, reason: GATE_DECLINED}]
    expect:
      state: FAILED
      reason: GATE_DECLINED
      steps: {approve: FAILED}
  - $when: {param: gate, in: ["false"]}
    name: the_ceiling_refuses_the_launch
    kind: DENIED
    trigger:
      params: {ref: R-201}
    stubs:
      launch: [{state: FAILED, reason: USAGE_EXCEEDED}]
    expect:
      state: FAILED
      reason: USAGE_EXCEEDED
      steps: {launch: FAILED}
  - name: the_effect_is_not_confirmed_in_time
    kind: TIMEOUT
    trigger:
      params: {ref: R-202}
    stubs:
      launch: [{state: DONE, effect: CHANGED, refs: [run], output: {run_bound: "true"}}]
      wait: [{state: DONE, refs: [run]}]
      confirm: [{state: WAITING}]
    expect:
      state: PARTIALLY_COMPLETED
      reason: TIMEOUT
      steps: {confirm: FAILED}
  - name: the_same_request_twice_starts_one_execution
    kind: DUPLICATE
    trigger:
      params: {ref: R-203}
    stubs:
      launch: [{state: DONE, effect: CHANGED, refs: [run], output: {run_bound: "true"}}]
      wait: [{state: DONE, refs: [run]}]
      confirm: [{state: DONE, refs: [receipt]}]
    expect:
      state: SUCCEEDED
  - name: the_run_fails_after_it_acted
    kind: PARTIAL
    trigger:
      params: {ref: R-204}
    stubs:
      launch: [{state: DONE, effect: CHANGED, refs: [run], output: {run_bound: "true"}}]
      wait: [{state: FAILED, reason: STEP_FAILED, refs: [run]}]
    expect:
      state: PARTIALLY_COMPLETED
      reason: STEP_FAILED
      steps: {wait: FAILED}
  - name: the_irreversible_effect_is_unknown
    kind: UNKNOWN
    trigger:
      params: {ref: R-205}
    stubs:
      launch: [{state: DONE, effect: CHANGED, refs: [run], output: {run_bound: "true"}}]
      wait: [{state: DONE, refs: [run]}]
      confirm: [{state: UNKNOWN, effect: UNKNOWN, output: {irreversible: "true"}}]
    expect:
      state: NEEDS_RECONCILIATION
      reason: EFFECT_UNKNOWN
      steps: {confirm: UNKNOWN}
