#
# least_privilege_review (D32): on a schedule, draft a policy restriction
# from grants that went unused, simulate it against recent traffic, and tell
# the owner. The restriction stays a draft: publishing it is a person's step
# (HR-286).
id: least_privilege_review
title: Least-privilege review
summary: >-
  On a schedule, draft a restriction of unused grants, simulate it, and hand
  the result to a person - nothing is published.
edition: TEAM
params:
  - name: purpose
    description: What the automation is for, shown to reviewers and approvers.
    type: string
    pattern: '[^{}$]{1,1000}'
    max_len: 1000
    default: Regularly propose and simulate restrictions of authority that goes unused.
  - name: review_by
    description: The date (YYYY-MM-DD) by which the owner reviews the automation again; at most 90 days ahead.
    type: string
    format: date
    pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}'
    max_len: 10
    example: "2026-12-31"
  - name: cron
    description: The five-field cron of the review schedule.
    type: string
    pattern: '[0-9*/,-]{1,20}( [0-9*/,-]{1,20}){4}'
    max_len: 104
    default: "0 8 * * 1"
  - name: timezone
    description: The IANA time zone of the schedule.
    type: string
    format: timezone
    pattern: '[A-Za-z][A-Za-z0-9_+-]{0,31}(/[A-Za-z0-9_+-]{1,32}){0,2}'
    max_len: 100
    default: UTC
  - name: unused_days
    description: How many days a grant's authority must have gone unused to be drafted away.
    type: int
    min: "7"
    max: "90"
    default: "30"
  - name: simulate_days
    description: How many days of recent decisions the draft is simulated against.
    type: int
    min: "1"
    max: "30"
    default: "14"

definition:
  apiVersion: automations.pantherclaw.dev/v1
  kind: Automation
  purpose: "${purpose}"
  work_kind: SECURITY_WORK
  review_by: "${review_by}"
  when:
    schedule:
      cron: "${cron}"
      timezone: "${timezone}"
  authority:
    principal: self
    platform:
      - step: draft_restriction
        scopes: [ORG]
      - step: simulate_restriction
        scopes: [ORG]
      - step: notify
        scopes: [OWNER]
  do:
    - id: draft
      step: draft_restriction
      with:
        from: UNUSED_GRANTS
        days: "${unused_days}"
    - id: simulate
      step: simulate_restriction
      with:
        step: draft
        days: "${simulate_days}"
      timeout: 4h
    - id: tell
      step: notify
      with:
        to: [OWNER]
        message:
          title: A least-privilege restriction is ready for review
          body: "A restriction of unused authority was drafted and simulated. Review the simulation; nothing changes until a person publishes it."
  finish_when:
    - step: simulate
      condition: SIMULATION_DONE
  limits:
    deadline: 1d

tests:
  - name: the draft is simulated
    kind: NORMAL
    stubs:
      draft: [{state: DONE, refs: [policy_version]}]
      simulate: [{state: WAITING}, {state: DONE, refs: [policy_simulation]}]
      tell: [{state: DONE, effect: CHANGED, refs: [ledger]}]
    expect:
      state: SUCCEEDED
      steps: {draft: DONE, simulate: DONE, tell: DONE}
  - name: the draft is refused
    kind: DENIED
    stubs:
      draft: [{state: FAILED, reason: AUTHORITY_CHANGED}]
    expect:
      state: FAILED
      reason: AUTHORITY_CHANGED
      steps: {draft: FAILED}
  - name: the simulation does not finish in time
    kind: TIMEOUT
    stubs:
      draft: [{state: DONE, refs: [policy_version]}]
      simulate: [{state: WAITING}]
    expect:
      state: FAILED
      reason: TIMEOUT
      steps: {simulate: FAILED}
  - name: the same occurrence twice starts one execution
    kind: DUPLICATE
    stubs:
      simulate: [{state: DONE, refs: [policy_simulation]}]
    expect:
      state: SUCCEEDED
