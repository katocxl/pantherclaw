apiVersion: automations.pantherclaw.dev/v2
kind: Automation
purpose: Route a change, production through approval, the rest by notice.
work_kind: AGENT_WORK
review_by: "2026-12-01"
when:
  manual:
    params:
      env:
        type: enum
        values: [prod, staging, dev]
authority:
  principal: self
  platform:
    - step: notify
      scopes: [OWNER]
    - step: open_case
nodes:
  - id: route
    switch:
      cases:
        - when: trigger.params.env == "prod"
          next: approve
        - when: trigger.params.env == "staging"
          next: tell
      default: record
  - id: approve
    step: gate
    with:
      approvers:
        roles: [security_lead]
      deadline: 24h
    next: log
  - id: log
    step: open_case
    with:
      title: Production change approved
    next: approved
  - id: tell
    step: notify
    with:
      to: [OWNER]
      message:
        title: Staging change
    next: merge
  - id: record
    step: notify
    with:
      to: [OWNER]
      message:
        title: Unrouted change
    next: merge
  - id: merge
    join:
      mode: ANY
      from: [tell, record]
    next: file
  - id: file
    step: open_case
    with:
      title: Change noted
    next: filed
  - id: approved
    outcome: SUCCEEDED
    finish_when:
      - step: log
        condition: CASE_OPENED
  - id: filed
    outcome: PARTIALLY_COMPLETED
    finish_when:
      - step: file
        condition: CASE_OPENED
