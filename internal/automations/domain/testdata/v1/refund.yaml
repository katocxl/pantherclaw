apiVersion: automations.pantherclaw.dev/v1
kind: Automation
purpose: Refund small tickets from Support.
work_kind: AGENT_WORK
review_by: "2026-12-01"
when:
  inbound:
    source: 0192f000-0000-7000-8000-000000000002
    type: ticket.created
    params:
      ticket:
        from: /ticket/id
        type: string
        pattern: "T-[0-9]{1,10}"
authority:
  principal: self
  ceiling:
    agents: [0192f000-0000-7000-8000-000000000003]
    bounds:
      operations: [payments.refund]
    per_grant:
      ttl: 1h
    per_day:
      grants: 5
      runs: 5
      budget:
        - currency: USD
          amount: "250.00"
do:
  - id: launch
    step: launch_run
    with:
      agent: 0192f000-0000-7000-8000-000000000003
      task_ref: "ticket {{params.ticket}}"
  - id: wait
    step: wait_run
    with:
      step: launch
    timeout: 2h
finish_when:
  - step: wait
    condition: RUN_ENDED
limits:
  deadline: 1d
