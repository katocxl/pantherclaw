#
# Cross-platform developer tasks (Windows, macOS, Linux). Every third-party
# tool is pinned in tools/pins/<tool>/go.mod and run with `go tool`, so the
# same versions run locally and in CI. If Task is not installed globally:
#   go tool -modfile=tools/pins/task/go.mod task <name>
version: "3"

vars:
  PINS: "{{.ROOT_DIR}}/tools/pins"
  GOLANGCI: go tool -modfile={{.PINS}}/golangci-lint/go.mod golangci-lint
  GITLEAKS: go tool -modfile={{.PINS}}/gitleaks/go.mod gitleaks
  GOVULNCHECK: go tool -modfile={{.PINS}}/govulncheck/go.mod govulncheck
  GO_MODULES: ". sdk/go sdk/go/internal/sqltest tools"
  GOLANG_IMAGE: golang:1.27.3-bookworm@sha256:21ade014faf952365b9ecbd8dbdb87176fbacb82fac9fb132d9f2a7b8cc3f132
  COMPOSE: docker compose -f deploy/compose/compose.yaml

tasks:
  api:schema:
    desc: Generate the Connect JSON OpenAPI 3.1 schema from protobuf
    cmds:
      - go tool -modfile={{.PINS}}/buf/go.mod buf generate --template buf.openapi.gen.yaml
      # Restores what the pinned generator drops (zero minimums, the bodiless 415).
      - go run ./internal/apischema docs/api/pantherclaw.openapi.json

  api:check:
    desc: Run authenticated schema property checks on a disposable database
    dotenv: ["deploy/compose/.env"]
    cmds:
      - uv sync --locked --project tools/api
      - >-
        PC_TEST_API_SCHEMA=1 PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        go test -tags integration -count=1 -timeout 20m -run '^TestM13_APIConformance$' ./internal/server

  perf:m13:
    desc: The M13 performance measurement with fixed conditions (docs/perf/M13.md) - static Linux builds in a private PostgreSQL container's network namespace, BenchmarkRefund and the stack under pantherclaw-sim load; needs Docker; RATES, DURATION, BENCHTIME, ROUNDS override
    cmds:
      - bash tools/scripts/perf-m13.sh

  perf:revocation:
    desc: The PN-011.3 revocation propagation measurement (docs/perf/M13.md) - TestPN0113_RevocationPropagation with 200 cycles, a static Linux test binary run in a private PostgreSQL container's network namespace as perf:m13 does; needs Docker; NAME names the container; JSON in bin/perf/out
    vars:
      NAME: '{{.NAME | default "pc-perf-revocation"}}'
      IMAGE:
        sh: sed -n 's/^ *image. \(postgres:17-bookworm@sha256:[0-9a-f]*\)$/\1/p' deploy/compose/compose.yaml | head -n1
      PW:
        sh: head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'
    cmds:
      - mkdir -p bin/perf/out
      - CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH:-amd64}" go test -c -tags integration -trimpath -o bin/perf/e2e.test ./test/e2e/
      - docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - defer: docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - >-
        docker run -d --name {{.NAME}} -e POSTGRES_PASSWORD={{.PW}} -e POSTGRES_DB=pantherclaw --shm-size 256m
        {{.IMAGE}} -c max_connections=200 -c shared_buffers=256MB >/dev/null
      - >-
        for i in $(seq 1 60); do docker exec {{.NAME}} pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
      - >-
        set -o pipefail; MSYS_NO_PATHCONV=1 docker run --rm --network container:{{.NAME}} -v "$(cd bin/perf && (pwd -W 2>/dev/null || pwd)):/perf" -w /perf
        -e PC_TEST_REQUIRE_DB=1 -e PC_TEST_PG_ADMIN_URL="postgres://postgres:{{.PW}}@127.0.0.1:5432/postgres?sslmode=disable"
        -e PC_PERF_REVOCATION=1 -e PC_PERF_OUT=/perf/out --entrypoint /perf/e2e.test {{.IMAGE}}
        -test.run '^TestPN0113_RevocationPropagation$' -test.count 1 -test.v -test.timeout 30m 2>&1 | tee bin/perf/out/revocation.log

  test:fuzz:
    desc: Run the bounded nightly security parser fuzz targets
    cmds:
      - bash tools/scripts/fuzz-nightly.sh

  docs:build:
    desc: Build the static searchable docs into a new dist/docs directory
    cmds:
      - go -C tools run ./docsite -root .. -out ../dist/docs

  default:
    cmds:
      - "{{.TASK_EXE}} --list"

  setup:
    desc: Configure git hooks and pre-build the pinned tools
    cmds:
      - git config core.hooksPath .githooks
      - git config core.autocrlf false
      - "{{.GOLANGCI}} version"
      - "{{.GITLEAKS}} version"
      - "{{.GOVULNCHECK}} -version"

  check:
    desc: Everything required before a push (format, headers, lint, tests, secrets)
    cmds:
      - task: fmt:check
      - task: license:check
      - task: lint
      - task: lint:workflows
      - task: lint:migrations
      - task: helm:check
      - task: proto:breaking
      - task: test
      - task: hub:check
      - task: secrets

  fmt:
    desc: Format Go code (gofumpt + goimports)
    cmds:
      - "{{.GOLANGCI}} fmt"

  fmt:check:
    desc: Fail if Go code is not formatted
    cmds:
      - "{{.GOLANGCI}} fmt --diff"

  lint:
    desc: Lint all Go modules
    cmds:
      # One lock per machine: wait for another worktree's lint instead of failing.
      - for: { var: GO_MODULES }
        cmd: cd "{{.ROOT_DIR}}/{{.ITEM}}" && {{.GOLANGCI}} run --allow-serial-runners ./...

  lint:workflows:
    desc: Lint GitHub Actions workflows (actionlint)
    cmds:
      - go tool -modfile={{.PINS}}/actionlint/go.mod actionlint -color=false

  helm:check:
    desc: Lint the Helm chart deploy/helm/pantherclaw and validate what it renders against the Kubernetes schemas (pinned helm and kubeconform; kubeconform fetches the schemas)
    cmds:
      - go tool -modfile={{.PINS}}/helm/go.mod helm lint --strict deploy/helm/pantherclaw
      - go tool -modfile={{.PINS}}/helm/go.mod helm template pc deploy/helm/pantherclaw --set maintenanceHold=true --set api.tls.existingSecret=pc-tls --set 'oidc.providers[0].name=sso' --set 'oidc.providers[0].issuer=https://idp.example.com' --set 'oidc.providers[0].clientID=pc' --set 'oidc.providers[0].existingSecret=pc-oidc' > /dev/null
      - go tool -modfile={{.PINS}}/helm/go.mod helm template pc deploy/helm/pantherclaw | go tool -modfile={{.PINS}}/kubeconform/go.mod kubeconform -strict -summary -kubernetes-version 1.31.0

  lint:migrations:
    desc: Lint the migrations added since the baseline with squawk (ADR-0003; pinned binary checked against its SHA-256 in tools/squawk, config .squawk.toml)
    cmds:
      - go -C tools run ./squawk -root ..

  proto:breaking:
    desc: Fail on a breaking protobuf change against main (buf breaking, rules in buf.yaml; AGAINST overrides the base, e.g. AGAINST=.git#ref=main)
    cmds:
      - go tool -modfile={{.PINS}}/buf/go.mod buf breaking --against '{{.AGAINST | default ".git#ref=origin/main"}}'

  test:
    desc: Unit tests for all Go modules (shuffled, uncached)
    cmds:
      - for: { var: GO_MODULES }
        cmd: go -C "{{.ITEM}}" test -shuffle=on -count=1 ./...

  test:fips:
    desc: The crypto, sealing, keys, authn, evidence, TLS and gateway tests in FIPS 140-only mode (GODEBUG=fips140=only; G0 M13 D35, HR-396)
    env:
      GODEBUG: fips140=only
    cmds:
      - >-
        go test -shuffle=on -count=1
        ./internal/platform/crypto/... ./internal/platform/keys/... ./internal/keystore/...
        ./internal/credentials/domain/... ./internal/authn/... ./internal/evidence/...
        ./internal/platform/httpx/... ./internal/gateway/... ./internal/sandbox/edge/...

  test:race:
    desc: Tests with the race detector (needs cgo; Linux/macOS — CI runs this)
    platforms: [linux, darwin]
    cmds:
      - for: { var: GO_MODULES }
        cmd: go -C "{{.ITEM}}" test -race -shuffle=on -count=1 ./...

  test:integration:
    desc: Database integration tests (start the throwaway cluster and the mock OpenID provider first with `task up PROFILE=test`; PKGS=./x/... narrows them)
    dotenv: ["deploy/compose/.env"]
    cmds:
      - >-
        PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        PC_TEST_MOCK_OIDC_URL="${PC_TEST_MOCK_OIDC_URL:-http://127.0.0.1:8181}"
        go test -tags integration -shuffle=on -count=1 -timeout 30m {{.PKGS | default "./..."}}
      # The Go SDK's SQL replay store on PostgreSQL (T-081: two replicas, one store), its own module.
      - >-
        PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        go -C sdk/go/internal/sqltest test -count=1 ./...

  failover:
    desc: The local failover tests (G0 M19 D202, D213), each on a fresh compose profile `failover` (a primary on 5434, its synchronous standby on 5435) that the tests start, kill and promote; needs Docker; not a CI gate
    dotenv: ["deploy/compose/.env"]
    cmds:
      - defer: "{{.COMPOSE}} -p pc-failover --profile failover down --timeout 1"
      - for: ['^TestFailover_SyncPromotion$', '^TestT215_AsyncPromotionHoldsUntilTheEpochBump$', '^TestFailover_SyncToAnUnverifiedPrimaryIsRefused$']
        cmd: >-
          PC_TEST_REQUIRE_DB=1
          PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5434/postgres?sslmode=disable"
          go test -tags "integration failover" -count=1 -v -timeout 20m -run '{{.ITEM}}' ./test/e2e/

  test:github-live:
    desc: "Manual and opt-in: the M8 GitHub run and the v0.1.0 three routes and coding to production against GitHub itself with your sandbox App (needs Docker; docs/runbooks/github-live.md); never part of check"
    dotenv: ["deploy/compose/.env"]
    preconditions:
      - sh: '[ "$PC_GITHUB_LIVE" = 1 ]'
        msg: "Set PC_GITHUB_LIVE=1 and the PC_GITHUB_LIVE_* variables first (docs/runbooks/github-live.md)"
      - sh: '[ -n "$PC_GITHUB_LIVE_APP" ] && [ -n "$PC_GITHUB_LIVE_INSTALLATION" ] && [ -n "$PC_GITHUB_LIVE_REPO" ] && [ -f "$PC_GITHUB_LIVE_KEY_FILE" ]'
        msg: "PC_GITHUB_LIVE_APP, PC_GITHUB_LIVE_INSTALLATION, PC_GITHUB_LIVE_REPO and PC_GITHUB_LIVE_KEY_FILE (an existing file) are required"
      - sh: docker version >/dev/null 2>&1
        msg: "Docker (>= 28) is required for the sandbox: start it, then run task sandbox:images (docs/runbooks/github-live.md)"
    cmds:
      - >-
        PC_TEST_SANDBOX=1 PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        PC_TEST_MOCK_OIDC_URL="${PC_TEST_MOCK_OIDC_URL:-http://127.0.0.1:8181}"
        go test -tags "integration github_live sandbox" -count=1 -v -timeout 60m -run '^TestLive_GitHub' ./test/e2e/

  test:stripe-live:
    desc: "Manual and opt-in: a payment intent, a refund and a transfer against Stripe itself in test mode through a local gateway (G0 M14 D14; needs the test cluster); never part of check"
    dotenv: ["deploy/compose/.env"]
    preconditions:
      - sh: '[ -n "$PC_TEST_STRIPE_KEY" ] && [ -n "$PC_TEST_STRIPE_CONNECTED_ACCOUNT" ]'
        msg: "Set PC_TEST_STRIPE_KEY (a restricted test key, rk_test_...) and PC_TEST_STRIPE_CONNECTED_ACCOUNT (a connected test account, acct_...) first"
    cmds:
      - >-
        PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        go test -tags "integration stripe_live" -count=1 -v -timeout 15m -run '^TestLive_Stripe' ./test/e2e/

  test:sandbox:
    desc: Docker sandbox, connector, M9 exit and M10 sandbox exit tests (G0 M9; needs Docker ≥ 28 and, for the exit tests, the test cluster of task up PROFILE=test; they create and remove their own uniquely named networks, containers and images; PKGS=./x/... narrows the Docker tests, E2E=0 skips the exit tests)
    dotenv: ["deploy/compose/.env"]
    cmds:
      - PC_TEST_SANDBOX=1 go test -tags sandbox -count=1 -timeout 30m {{.PKGS | default "./internal/sandbox/... ./internal/gateway/... ./internal/sim/... ./internal/pclaw/..."}}
      - >-
        {{if eq (.E2E | default "1") "0"}}true{{else}}PC_TEST_SANDBOX=1 PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        PC_TEST_MOCK_OIDC_URL="${PC_TEST_MOCK_OIDC_URL:-http://127.0.0.1:8181}"
        go test -tags "integration sandbox" -count=1 -timeout 60m -run '^TestE2E_M9_|^TestE2E_M10_ContainEnforcedAgent$' ./test/e2e/{{end}}

  test:preview:
    desc: The v0.1.0 preview demo, three routes and three stops, in one real sandbox (needs Docker ≥ 28 and the test cluster of task up PROFILE=test; build the images the test asks for with task sandbox:images)
    dotenv: ["deploy/compose/.env"]
    cmds:
      - >-
        PC_TEST_SANDBOX=1 PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        PC_TEST_MOCK_OIDC_URL="${PC_TEST_MOCK_OIDC_URL:-http://127.0.0.1:8181}"
        go test -tags "integration sandbox" -count=1 -timeout 30m -run '^TestE2E_Preview_' ./test/e2e/

  range:
    desc: The adversarial range (G0 M12, HR-226; EX-004 local gate) - every redteam/scenarios/*.yaml against the simulators on the test cluster (start it with `task up PROFILE=test`; SANDBOX=1 adds the sandbox scenarios and needs Docker; SCENARIO=RT-008 runs one)
    dotenv: ["deploy/compose/.env"]
    cmds:
      - >-
        PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable"
        PC_TEST_MOCK_OIDC_URL="${PC_TEST_MOCK_OIDC_URL:-http://127.0.0.1:8181}"
        {{if eq (.SANDBOX | default "0") "1"}}PC_TEST_SANDBOX=1{{end}}
        go test -tags "integration{{if eq (.SANDBOX | default "0") "1"}} sandbox{{end}}" -count=1 -timeout 60m
        -run 'TestRange_Scenarios{{if .SCENARIO}}/{{.SCENARIO}}{{end}}' ./test/e2e/

  sandbox:images:
    desc: Build the sandbox's edge, probe and demo-agent images locally (static Linux builds on the pinned distroless base) and print their ids, which pclaw's sandbox.images settings name (G0 M9)
    env:
      CGO_ENABLED: "0"
      GOOS: linux
    cmds:
      - go build -trimpath -o bin/sandbox/ ./cmd/pantherclaw-edge ./cmd/pantherclaw-probe ./cmd/pantherclaw-demo-agent
      - mkdir -p bin/sandbox/workspace
      - echo "edge  $(docker build --quiet --pull=false --network none --file deploy/sandbox/edge.Dockerfile bin/sandbox)"
      - echo "probe $(docker build --quiet --pull=false --network none --file deploy/sandbox/probe.Dockerfile bin/sandbox)"
      - echo "pantherclaw-demo-agent $(docker build --quiet --pull=false --network none --file deploy/sandbox/demo-agent.Dockerfile bin/sandbox)"

  images:
    desc: Build the server and gateway images for this machine from deploy/docker as pantherclaw-server:dev and pantherclaw-gateway:dev, which a development build of pclaw up uses (G0 M13 D36)
    cmds:
      - docker build --file deploy/docker/server.Dockerfile --build-arg VERSION=dev --tag pantherclaw-server:dev .
      - docker build --file deploy/docker/gateway.Dockerfile --build-arg VERSION=dev --tag pantherclaw-gateway:dev .

  test:linux:
    desc: Run race-enabled tests inside a pinned Linux container (use on Windows)
    cmds:
      - >-
        docker run --rm
        --mount type=bind,source="{{.ROOT_DIR}}",target=/src
        --mount type=volume,source=pantherclaw-gomod,target=/go/pkg/mod
        -w /src {{.GOLANG_IMAGE}}
        sh -c "go test -race -shuffle=on -count=1 ./... && go -C sdk/go test -race -count=1 ./... && go -C tools test -race -count=1 ./..."

  gen:
    desc: Regenerate committed code (buf protos, sqlc queries) and add licence headers
    env:
      CGO_ENABLED: "0"
    cmds:
      - go tool -modfile={{.PINS}}/buf/go.mod buf lint
      - go tool -modfile={{.PINS}}/buf/go.mod buf generate
      # The vendored OTLP messages, their own buf workspace (G0 M13 D30).
      - cd proto/third_party/otlp && go tool -modfile={{.PINS}}/buf/go.mod buf lint && go tool -modfile={{.PINS}}/buf/go.mod buf generate
      - go tool -modfile={{.PINS}}/sqlc/go.mod sqlc generate
      - go -C tools run ./licensecheck -root .. -fix

  gen:check:
    desc: Fail if generated code is out of date
    cmds:
      - task: gen
      - git diff --exit-code -- internal/gen

  trace:
    desc: Fail if a hardening rule or threat due by MILESTONE has no test (default M23)
    cmds:
      - go -C tools run ./traceability -root .. -through {{.MILESTONE | default "M23"}}

  hub:check:
    desc: Run the real validators over the Hub seed in hub/ (G0 M23 D112) - the policy gate with its mutation check, the detection compiler and rule tests, the range format and customer limits, automation validation and simulation
    cmds:
      - go test -count=1 ./internal/hub/seed
      - go test -count=1 -run 'TestHR564' ./internal/ranges/app

  range:library:
    desc: Regenerate the server's embedded scenario library (internal/redteam/library/library.json) from redteam/scenarios after changing a scenario (G0 M17 D125)
    cmds:
      - go test ./internal/redteam/library -run TestLibrary_MatchesTheShippedScenarios -count=1 -update

  sdk:vectors:
    desc: Regenerate the SDK conformance vectors in sdk/conformance from the Go implementation (review the diff)
    cmds:
      - go test ./internal/conformance/gen -run TestConformanceVectors -count=1 -update

  sdk:check:
    desc: The SDKs' tests, each running every conformance vector (not part of task check; PYTHON overrides the interpreter); the SQL replay store's PostgreSQL test (T-081) needs the test cluster (task up PROFILE=test) and fails without it
    dotenv: ["deploy/compose/.env"]
    vars:
      PYTHON: '{{.PYTHON | default "uv run --locked python"}}'
    cmds:
      - go -C sdk/go test -shuffle=on -count=1 ./...
      - >-
        PC_TEST_REQUIRE_DB=1
        PC_TEST_PG_ADMIN_URL="${PC_TEST_PG_ADMIN_URL:-${PC_PG_TEST_PASSWORD:+postgres://postgres:${PC_PG_TEST_PASSWORD}@127.0.0.1:5433/postgres?sslmode=disable}}"
        go -C sdk/go/internal/sqltest test -count=1 ./...
      - cd sdk/typescript && node --test "test/**/*.test.ts"
      - cd sdk/python && PYTHONPATH=src {{.PYTHON}} -m unittest discover -s tests
      # The integrations' tests run inside the real Agent SDKs (dev-only: pnpm-lock.yaml, uv.lock); on Windows the Python ones use the TypeScript one's CLI.
      - cd integrations/claude-agent-sdk/typescript && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && node --test "test/**/*.test.ts"
      # The TypeScript framework wrappers run every wrappers.json case and their own tests inside the real Vercel AI SDK and MCP TypeScript SDK (dev-only, pnpm-lock.yaml).
      - cd integrations/vercel-ai/typescript && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && node --test "test/**/*.test.ts"
      - cd integrations/mcp/typescript && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && node --test "test/**/*.test.ts"
      - cd integrations/claude-agent-sdk/python && {{.PYTHON}} -m unittest discover -s tests
      # The Python framework wrappers run every wrappers.json case inside the real frameworks (dev-only, uv.lock); CrewAI on a stand-in (task sdk:crewai-real runs the real one).
      - cd integrations/langchain/python && {{.PYTHON}} -m unittest discover -s tests
      - cd integrations/openai-agents/python && {{.PYTHON}} -m unittest discover -s tests
      - cd integrations/crewai/python && {{.PYTHON}} -m unittest discover -s tests

  sdk:crewai-real:
    desc: The CrewAI wrapper's tests inside the real CrewAI (Python 3.13), in a throwaway environment outside every committed lock (M14 D60; local only while CrewAI's chromadb has open advisories)
    vars:
      CREWAI: '{{.CREWAI | default "1.15.27"}}'
    dir: integrations/crewai/python
    cmds:
      - >-
        uv run --isolated --no-project --python 3.13 --exclude-newer "7 days"
        --with crewai=={{.CREWAI}} --with-editable ../../../sdk/python --with-editable .
        python -m unittest discover -s tests

  license:check:
    desc: Verify SPDX + copyright headers on every source file
    cmds:
      - go -C tools run ./licensecheck -root ..

  license:fix:
    desc: Add missing SPDX + copyright headers
    cmds:
      - go -C tools run ./licensecheck -root .. -fix

  secrets:
    desc: Scan the working tree for secrets (gitleaks) and refuse tracked .env files
    cmds:
      - "{{.GITLEAKS}} dir . --redact --no-banner"
      - cmd: >-
          test -z "$(git ls-files -- ':(glob)**/.env' ':(glob)**/.env.*' ':(exclude,glob)**/.env.example')"
          || (echo "tracked .env file found; local secrets must stay git-ignored (SB-7)" && exit 1)

  vuln:
    desc: Reachability-aware vulnerability scan of all Go modules
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd "{{.ROOT_DIR}}/{{.ITEM}}" && {{.GOVULNCHECK}} ./...

  build:
    desc: Build all binaries into bin/
    cmds:
      - go build -trimpath -o bin/ ./cmd/...

  up:
    desc: Start the local stack (PROFILE=core by default)
    cmds:
      - "{{.COMPOSE}} --profile {{.PROFILE | default \"core\"}} up -d"

  down:
    desc: Stop the local stack (volumes are kept)
    cmds:
      - "{{.COMPOSE}} --profile {{.PROFILE | default \"core\"}} down"

  demo:up:
    desc: Start the local demo (v0.1.0 preview quickstart, docs/quickstart.md - database, Keycloak, server, gateway, GitHub simulator, sandbox images; all simulated, idempotent)
    cmds:
      - bash tools/scripts/demo.sh up

  demo:down:
    desc: Stop the local demo's server, gateway and simulator (data and secrets stay)
    cmds:
      - bash tools/scripts/demo.sh down

  demo:status:
    desc: Show whether the local demo's processes and the server are up
    cmds:
      - bash tools/scripts/demo.sh status

  hooks:pre-commit:
    desc: Fast checks run by the git pre-commit hook (< 5 s once tools are built)
    cmds:
      - task: fmt:check
      - task: license:check
      - "{{.GITLEAKS}} git --pre-commit --staged --redact --no-banner"

  hooks:pre-push:
    desc: Checks run by the git pre-push hook
    cmds:
      - task: lint
      - task: test
