# Reviewed tool package for the simulated payments API (pantherclaw-sim
# payments). Every effect is SIMULATED. Mappings are reviewed as code: a wrong
# mapping is a total bypass (HR-124), so any change here needs the golden
# tests in internal/definitions to be updated deliberately. The dispatch
# templates say what the gateway sends to the API (HR-075), and the MCP
# descriptions and input schemas are what MCP clients see (HR-081).
format: 1
name: pc.mock-payments
version: 1.0.0
publisher: pantherclaw
summary: Simulated payments API (SIMULATED)

definitions:
  - operation: payments.refund.create
    summary: Refund part or all of a charge
    access: write
    target:
      type: payments.charge
      id_pattern: '^ch_[A-Za-z0-9]{1,64}$'
      account: none
    params:
      amount:
        type: money
        material: true
        required: true
        currencies: [USD, EUR]
        max: "1000000"
      reason:
        type: enum
        material: true
        required: true
        values: [duplicate, fraudulent, requested_by_customer]
    effects:
      - kind: funds.transfer
        description: Returns funds from the merchant to the customer
    reversibility: irreversible
    dedupe_key: [target.id, params.amount]
    constraints:
      - kind: amount_max
        param: amount
    prerequisites:
      - fact: payments.charge.refundable
        max_age_seconds: 300
    retry:
      safe: false
      on_unknown: reconcile
      target_idempotency: true
    verifier:
      operation: payments.refund.get
      establishes: refund.exists
      within_seconds: 600
      level: follow_up
      reference:
        from_response: /id
      lookup:
        operation: payments.refund.list
        list:
          items: /data
          id: /id
          correlate: /idempotency_key
          more: /has_more
          page_param: starting_after
      expect:
        - field: /charge
          equals: target.id
        - field: /amount
          equals: params.amount.value
        - field: /currency
          equals: params.amount.currency
      states:
        field: /status
        confirmed: [succeeded]
        pending: [pending]
        none: [failed, canceled]
      limits: >-
        Shows that the simulated refund object exists for this charge with
        this amount, currency and status. It does not show that the customer
        received the money.
    approval:
      title: Refund {params.amount} on charge {target.id}
      fields: [params.amount, params.reason, target.id]
    assurance:
      basis: declared
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-08
    mappings:
      - channel: http
        method: POST
        path: /v1/refunds
        route: payments-refund
        extract:
          target_id: input.charge
          params:
            amount: money(input.amount, input.currency)
            reason: input.reason
      - channel: mcp
        tool: create_refund
        route: payments-refund
        description: >-
          Refund part or all of a card charge on the simulated payments API.
          Every refund is SIMULATED. The amount is in the currency's units,
          with exactly its minor-unit digits (12.50 USD).
        input_schema:
          type: object
          additionalProperties: false
          required: [charge, amount, currency, reason]
          properties:
            charge:
              type: string
              description: The charge to refund
              pattern: '^ch_[A-Za-z0-9]{1,64}$'
            amount:
              type: string
              description: The amount to refund, for example 12.50
              pattern: '^[0-9]{1,16}(\.[0-9]{1,4})?$'
            currency:
              type: string
              enum: [USD, EUR]
            reason:
              type: string
              enum: [duplicate, fraudulent, requested_by_customer]
        extract:
          target_id: input.charge
          params:
            amount: money(input.amount, input.currency)
            reason: input.reason
    dispatch:
      http:
        method: POST
        path: /v1/refunds
        body:
          charge: target.id
          amount: params.amount.value
          currency: params.amount.currency
          reason: params.reason
        idempotency_header: Idempotency-Key

  - operation: payments.refund.get
    summary: Read one refund
    access: read
    target:
      type: payments.refund
      id_pattern: '^re_[A-Za-z0-9-]{1,64}$'
      account: none
    params: {}
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: declared
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-08
    mappings:
      - channel: http
        method: GET
        path: /v1/refunds/{refund}
        route: payments-refund-get
        extract:
          target_id: path.refund
          params: {}
      - channel: mcp
        tool: get_refund
        route: payments-refund-get
        description: Read one refund on the simulated payments API by its id.
        input_schema:
          type: object
          additionalProperties: false
          required: [refund]
          properties:
            refund:
              type: string
              description: The refund id
              pattern: '^re_[A-Za-z0-9-]{1,64}$'
        extract:
          target_id: input.refund
          params: {}
    dispatch:
      http:
        method: GET
        path: /v1/refunds/{target.id}

  # Internal reads (G0 M7 design decisions 5 and 6): no mappings, so no
  # agent can call them; only the refund verifier's lookup and the target
  # log use them, through the gateway serving the connection.
  - operation: payments.refund.list
    summary: List the refunds of one charge
    access: read
    target:
      type: payments.charge
      id_pattern: '^ch_[A-Za-z0-9]{1,64}$'
      account: none
    params:
      starting_after:
        type: identifier
        pattern: '^re_[A-Za-z0-9-]{1,64}$'
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: declared
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-08
    dispatch:
      http:
        method: GET
        path: /v1/refunds
        query:
          charge: target.id
          starting_after: params.starting_after

  - operation: payments.refund.recent
    summary: List the refunds created since a time (the target log)
    access: read
    target:
      type: pc.connection
      id_pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      account: none
    params:
      created_gte:
        type: integer
        unit: seconds
        required: true
        min: "0"
      starting_after:
        type: identifier
        pattern: '^re_[A-Za-z0-9-]{1,64}$'
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: declared
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-08
    dispatch:
      http:
        method: GET
        path: /v1/refunds
        query:
          created_gte: params.created_gte
          starting_after: params.starting_after

  # The connection test's read (G0 M8 track C, F354): harmless, with no
  # params and no mappings, so only a connection test leases it.
  - operation: payments.account.read
    summary: Read the simulated payments account (the connection test)
    access: read
    test: true
    target:
      type: pc.connection
      id_pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      account: none
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: declared
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-08
    dispatch:
      http:
        method: GET
        path: /v1/account

# What the simulated API created, matched against execution receipts by the
# idempotency key pc-<transaction id> (HR-112).
target_logs:
  - operation: payments.refund.recent
    effect_of: payments.refund.create
    since_param: created_gte
    list:
      items: /data
      id: /id
      correlate: /idempotency_key
      created: /created
      more: /has_more
      page_param: starting_after
