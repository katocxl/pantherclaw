#
# Reviewed tool package for GitHub repositories reached through a GitHub App
# connection (G0 M8, track G slice G1). Each operation is mapped from the
# GitHub MCP server's tool and from the REST route it calls, so an MCP call
# and a direct API call for one effect reach the same action and the same
# decision (F099). The gateway sends every operation to the REST API
# (version 2022-11-28) with an installation token it mints for exactly the
# target repository and the operation's credential_scope (GitHub App
# permissions, HR-203); the agent never holds a GitHub credential. No
# operation declares GitHub's workflows permission, and contents writes
# refuse paths under .github/, so an agent cannot rewrite the triggers its
# merges are judged by.
#
# Identities are lowercase owner/repo, owner/repo#number for a pull request
# and owner/repo@refs/heads/<branch> for a branch: GitHub compares owner and
# repository names without case, so the id patterns accept only the
# lowercase spelling rather than normalizing it (HR-102). A merge carries
# the pull request's head SHA, which the dispatch passes to GitHub so that
# any other head fails with 409 (HR-205). Where the GitHub MCP server has
# no tool for an operation (update_repository), takes a moving name where
# the API needs an exact commit (create_branch takes sha, not from_branch),
# or folds several reads into one tool (pull_request_read maps its get
# method only), the reviewed schema below is what MCP clients see
# (HR-081).
#
# The github.* facts named here (prerequisites and consequence rules) are
# read by the gateway from GitHub before it asks for a decision and
# reported as the connection's fact provider (G4, HR-160).
#
# Mappings are reviewed as code: a wrong mapping is a total bypass (HR-124),
# so any change here needs the golden tests in internal/definitions to be
# updated deliberately.
format: 1
name: pc.github
version: 1.0.0
publisher: pantherclaw
summary: GitHub repositories, branches and pull requests through a GitHub App

definitions:
  - operation: github.contents.read
    summary: Read a file or list a directory of a repository
    access: read
    target:
      type: github.repository
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})$'
      account: none
    params:
      path:
        type: identifier
        material: true
        required: true
        max_length: 1024
        pattern: '^\.?[A-Za-z0-9_-][A-Za-z0-9._-]*(/\.?[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'
      ref:
        type: identifier
        material: true
        pattern: '^[A-Za-z0-9_-][A-Za-z0-9._/-]{0,254}$'
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: GET
        path: /repos/{owner}/{repo}/contents/{path*}
        route: github-contents-read
        extract:
          target_id: path.owner + '/' + path.repo
          params:
            path: path.path
            ref: query.?ref
      - channel: mcp
        tool: get_file_contents
        route: github-contents-read
        description: >-
          Read a file, or list a directory, of a GitHub repository at a
          branch, tag or commit (the default branch when ref is left out).
          Owner and repository are written in lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [owner, repo, path]
          properties:
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            path:
              type: string
              description: The file or directory path, such as src/main.go
              maxLength: 1024
              pattern: '^\.?[A-Za-z0-9_-][A-Za-z0-9._-]*(/\.?[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'
            ref:
              type: string
              description: A branch, tag or commit SHA
              pattern: '^[A-Za-z0-9_-][A-Za-z0-9._/-]{0,254}$'
        extract:
          target_id: input.owner + '/' + input.repo
          params:
            path: input.path
            ref: input.?ref
    dispatch:
      http:
        method: GET
        path: /repos/{target.id.owner}/{target.id.repo}/contents/{params.path*}
        query:
          ref: params.ref
      credential_scope:
        contents: read

  - operation: github.pull.read
    summary: Read one pull request
    access: read
    target:
      type: github.pull_request
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})#(?P<number>[1-9][0-9]{0,9})$'
      account: none
    params:
      # pull_request_read folds several reads into one tool; this operation
      # is its get method only, and the REST route is the same read.
      method:
        type: enum
        values: [get]
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: GET
        path: /repos/{owner}/{repo}/pulls/{pull_number}
        route: github-pull-read
        extract:
          target_id: path.owner + '/' + path.repo + '#' + path.pull_number
          params:
            method: "'get'"
      - channel: mcp
        tool: pull_request_read
        route: github-pull-read
        description: >-
          Read a pull request of a GitHub repository: its state, head and
          base branches, head commit and whether it can be merged. Only the
          get method is served. Owner and repository are written in
          lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [method, owner, repo, pullNumber]
          properties:
            method:
              type: string
              enum: [get]
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            pullNumber:
              type: integer
              description: The pull request number
              minimum: 1
              maximum: 9999999999
        extract:
          target_id: input.owner + '/' + input.repo + '#' + string(input.pullNumber)
          params:
            method: input.method
    dispatch:
      http:
        method: GET
        path: /repos/{target.id.owner}/{target.id.repo}/pulls/{target.id.number}
      credential_scope:
        pull_requests: read

  - operation: github.branch.create
    summary: Create a branch at a commit
    access: write
    target:
      type: github.branch
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})@(?P<ref>refs/heads/(?P<branch>[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}))$'
      account: none
    params:
      sha:
        type: identifier
        material: true
        required: true
        pattern: '^[0-9a-f]{40}$'
    effects:
      - kind: repository.branch.create
        description: Creates a branch that points at an existing commit
    reversibility: reversible
    retry:
      safe: false
      on_unknown: reconcile
    approval:
      title: Create {target.id} at {params.sha}
      fields: [target.id, params.sha]
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: POST
        path: /repos/{owner}/{repo}/git/refs
        route: github-branch-create
        extract:
          target_id: path.owner + '/' + path.repo + '@' + input.ref
          params:
            sha: input.sha
      - channel: mcp
        tool: create_branch
        route: github-branch-create
        description: >-
          Create a branch in a GitHub repository at an exact commit. Read the
          commit SHA first, for example with pull_request_read or
          get_file_contents. Owner and repository are written in lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [owner, repo, branch, sha]
          properties:
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            branch:
              type: string
              description: The new branch's name, such as fix/cve-2026-1234
              pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
            sha:
              type: string
              description: The full commit SHA the branch starts at
              pattern: '^[0-9a-f]{40}$'
        extract:
          target_id: input.owner + '/' + input.repo + '@refs/heads/' + input.branch
          params:
            sha: input.sha
    dispatch:
      http:
        method: POST
        path: /repos/{target.id.owner}/{target.id.repo}/git/refs
        body:
          ref: target.id.ref
          sha: params.sha
      credential_scope:
        contents: write

  - operation: github.contents.write
    summary: Create or update a file on a branch
    access: write
    target:
      type: github.branch
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})@(?P<ref>refs/heads/(?P<branch>[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}))$'
      account: none
    params:
      # Never under .github/ (the mappings refuse it): workflows and actions
      # are what a merge's consequences are judged by.
      path:
        type: identifier
        material: true
        required: true
        max_length: 1024
        pattern: '^\.?[A-Za-z0-9_-][A-Za-z0-9._-]*(/\.?[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'
      # The file's new content, base64-encoded as the API takes it.
      content:
        type: identifier
        material: true
        required: true
        max_length: 8192
        pattern: '^[A-Za-z0-9+/]*={0,2}$'
      message:
        type: content
        material: true
        required: true
        max_length: 1024
      # The blob SHA of the file being replaced; GitHub refuses an update
      # without the current one.
      sha:
        type: identifier
        material: true
        pattern: '^[0-9a-f]{40}$'
    effects:
      - kind: repository.contents.write
        description: Commits a new version of one file to the branch
    reversibility: compensatable
    retry:
      safe: false
      on_unknown: reconcile
    approval:
      title: Write {params.path} on {target.id}
      fields: [target.id, params.path, params.message, params.sha]
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: PUT
        path: /repos/{owner}/{repo}/contents/{path*}
        route: github-contents-write
        extract:
          target_id: path.owner + '/' + path.repo + '@refs/heads/' + input.branch
          params:
            path: "path.path == '.github' || path.path.startsWith('.github/') ? '' : path.path"
            content: input.content
            message: input.message
            sha: input.?sha
      - channel: mcp
        tool: create_or_update_file
        route: github-contents-write
        description: >-
          Create or update one file on a branch of a GitHub repository, as
          one commit. The content is base64-encoded. Paths under .github/
          are refused. Owner and repository are written in lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [owner, repo, path, content, message, branch]
          properties:
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            path:
              type: string
              description: The file's path, such as src/main.go
              maxLength: 1024
              pattern: '^\.?[A-Za-z0-9_-][A-Za-z0-9._-]*(/\.?[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'
            content:
              type: string
              description: The file's new content, base64-encoded
              maxLength: 8192
              pattern: '^[A-Za-z0-9+/]*={0,2}$'
            message:
              type: string
              description: The commit message
              minLength: 1
              maxLength: 1024
            branch:
              type: string
              description: The branch to commit to
              pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
            sha:
              type: string
              description: When updating, the blob SHA of the file being replaced
              pattern: '^[0-9a-f]{40}$'
        extract:
          target_id: input.owner + '/' + input.repo + '@refs/heads/' + input.branch
          params:
            path: "input.path == '.github' || input.path.startsWith('.github/') ? '' : input.path"
            content: input.content
            message: input.message
            sha: input.?sha
    dispatch:
      http:
        method: PUT
        path: /repos/{target.id.owner}/{target.id.repo}/contents/{params.path*}
        body:
          message: params.message
          content: params.content
          branch: target.id.branch
          sha: params.sha
      credential_scope:
        contents: write

  - operation: github.pull.create
    summary: Open a pull request between two branches of a repository
    access: write
    target:
      type: github.repository
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})$'
      account: none
    params:
      title:
        type: content
        material: true
        required: true
        max_length: 256
      body:
        type: content
        material: true
        max_length: 8192
      head:
        type: identifier
        material: true
        required: true
        pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
      base:
        type: identifier
        material: true
        required: true
        pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
      draft:
        type: boolean
        material: true
    effects:
      - kind: repository.pull_request.open
        description: Opens a pull request that asks to merge head into base
    reversibility: compensatable
    retry:
      safe: false
      on_unknown: reconcile
    approval:
      title: Open a pull request from {params.head} into {params.base} in {target.id}
      fields: [target.id, params.head, params.base, params.title, params.draft]
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: POST
        path: /repos/{owner}/{repo}/pulls
        route: github-pull-create
        extract:
          target_id: path.owner + '/' + path.repo
          params:
            title: input.title
            body: input.?body
            head: input.head
            base: input.base
            draft: input.?draft
      - channel: mcp
        tool: create_pull_request
        route: github-pull-create
        description: >-
          Open a pull request in a GitHub repository that asks to merge the
          head branch into the base branch. Both branches are in the same
          repository. Owner and repository are written in lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [owner, repo, title, head, base]
          properties:
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            title:
              type: string
              description: The pull request's title
              minLength: 1
              maxLength: 256
            body:
              type: string
              description: The pull request's description
              maxLength: 8192
            head:
              type: string
              description: The branch with the changes
              pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
            base:
              type: string
              description: The branch to merge into
              pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
            draft:
              type: boolean
              description: Open the pull request as a draft
        extract:
          target_id: input.owner + '/' + input.repo
          params:
            title: input.title
            body: input.?body
            head: input.head
            base: input.base
            draft: input.?draft
    dispatch:
      http:
        method: POST
        path: /repos/{target.id.owner}/{target.id.repo}/pulls
        body:
          title: params.title
          body: params.body
          head: params.head
          base: params.base
          draft: params.draft
      credential_scope:
        pull_requests: write

  - operation: github.pull.merge
    summary: Merge a pull request at an exact head commit
    access: write
    target:
      type: github.pull_request
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})#(?P<number>[1-9][0-9]{0,9})$'
      account: none
    params:
      # The head commit the merge is bound to (HR-205): P3 checks it against
      # a fresh github.pull.head, and GitHub refuses the merge with 409 when
      # the head is any other commit.
      sha:
        type: identifier
        material: true
        required: true
        pattern: '^[0-9a-f]{40}$'
      merge_method:
        type: enum
        material: true
        values: [merge, squash, rebase]
    effects:
      - kind: repository.branch.merge
        description: Merges the pull request's head commit into its base branch
    reversibility: irreversible
    dedupe_key: [target.id, params.sha]
    # Read by the gateway before every decision (G4): the head and its
    # people (P2's independence), reviews and checks at the head, and the
    # base branch's rules (F158).
    prerequisites:
      - fact: github.pull.head
        max_age_seconds: 30
      - fact: github.pull.people
        max_age_seconds: 30
      - fact: github.pull.reviews
        max_age_seconds: 30
      - fact: github.pull.checks
        max_age_seconds: 30
      - fact: github.branch.rules
        max_age_seconds: 30
    retry:
      safe: false
      on_unknown: reconcile
    verifier:
      operation: github.pull.read
      establishes: pull_request.merged
      within_seconds: 600
      level: domain_effect
      expect:
        - field: /head/sha
          equals: params.sha
      states:
        field: /merged
        confirmed: ["true"]
        pending: ["false"]
      limits: >-
        Shows that GitHub reports this pull request merged with this head
        commit and names its merge commit. It does not show that a workflow
        or deployment the merge triggers ran or finished.
    approval:
      title: Merge pull request {target.id} at {params.sha}
      fields:
        - target.id
        - params.sha
        - params.merge_method
        - facts.github.pull.head
        - facts.github.pull.checks
        - facts.github.pull.reviews
        - facts.github.branch.rules
      invalidate_on: github.pull.head
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: PUT
        path: /repos/{owner}/{repo}/pulls/{pull_number}/merge
        route: github-pull-merge
        extract:
          target_id: path.owner + '/' + path.repo + '#' + path.pull_number
          params:
            sha: input.sha
            merge_method: input.?merge_method
      - channel: mcp
        tool: merge_pull_request
        route: github-pull-merge
        description: >-
          Merge a pull request in a GitHub repository. The merge is bound to
          the head commit you name: if the pull request's head has moved, it
          is refused and needs a new decision. Owner and repository are
          written in lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [owner, repo, pullNumber, expectedHeadSha]
          properties:
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            pullNumber:
              type: integer
              description: The pull request number
              minimum: 1
              maximum: 9999999999
            expectedHeadSha:
              type: string
              description: The full SHA of the pull request's head commit
              pattern: '^[0-9a-f]{40}$'
            merge_method:
              type: string
              enum: [merge, squash, rebase]
        extract:
          target_id: input.owner + '/' + input.repo + '#' + string(input.pullNumber)
          params:
            sha: input.expectedHeadSha
            merge_method: input.?merge_method
    dispatch:
      http:
        method: PUT
        path: /repos/{target.id.owner}/{target.id.repo}/pulls/{target.id.number}/merge
        body:
          sha: params.sha
          merge_method: params.merge_method
      credential_scope:
        contents: write

  - operation: github.repo.settings.update
    summary: Change a repository's default branch and merge settings
    access: write
    target:
      type: github.repository
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})$'
      account: none
    params:
      default_branch:
        type: identifier
        material: true
        pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
      allow_merge_commit:
        type: boolean
        material: true
      allow_squash_merge:
        type: boolean
        material: true
      allow_rebase_merge:
        type: boolean
        material: true
      allow_auto_merge:
        type: boolean
        material: true
      delete_branch_on_merge:
        type: boolean
        material: true
    effects:
      - kind: repository.settings.change
        description: Changes the repository's default branch or how pull requests merge
    reversibility: compensatable
    retry:
      safe: false
      on_unknown: reconcile
    approval:
      title: Change the settings of {target.id}
      fields:
        - target.id
        - params.default_branch
        - params.allow_merge_commit
        - params.allow_squash_merge
        - params.allow_rebase_merge
        - params.allow_auto_merge
        - params.delete_branch_on_merge
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11
    mappings:
      - channel: http
        method: PATCH
        path: /repos/{owner}/{repo}
        route: github-repo-settings-update
        extract:
          target_id: path.owner + '/' + path.repo
          params:
            default_branch: input.?default_branch
            allow_merge_commit: input.?allow_merge_commit
            allow_squash_merge: input.?allow_squash_merge
            allow_rebase_merge: input.?allow_rebase_merge
            allow_auto_merge: input.?allow_auto_merge
            delete_branch_on_merge: input.?delete_branch_on_merge
      - channel: mcp
        tool: update_repository
        route: github-repo-settings-update
        description: >-
          Change a GitHub repository's default branch or merge settings. Only
          the settings you pass change. Owner and repository are written in
          lowercase.
        input_schema:
          type: object
          additionalProperties: false
          required: [owner, repo]
          properties:
            owner:
              type: string
              description: The account that owns the repository, in lowercase
              pattern: '^[a-z0-9][a-z0-9-]{0,38}$'
            repo:
              type: string
              description: The repository name, in lowercase
              pattern: '^\.?[a-z0-9_-][a-z0-9._-]{0,98}$'
            default_branch:
              type: string
              description: The branch pull requests target by default
              pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}(/[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}){0,7}$'
            allow_merge_commit:
              type: boolean
            allow_squash_merge:
              type: boolean
            allow_rebase_merge:
              type: boolean
            allow_auto_merge:
              type: boolean
            delete_branch_on_merge:
              type: boolean
        extract:
          target_id: input.owner + '/' + input.repo
          params:
            default_branch: input.?default_branch
            allow_merge_commit: input.?allow_merge_commit
            allow_squash_merge: input.?allow_squash_merge
            allow_rebase_merge: input.?allow_rebase_merge
            allow_auto_merge: input.?allow_auto_merge
            delete_branch_on_merge: input.?delete_branch_on_merge
    dispatch:
      http:
        method: PATCH
        path: /repos/{target.id.owner}/{target.id.repo}
        body:
          default_branch: params.default_branch
          allow_merge_commit: params.allow_merge_commit
          allow_squash_merge: params.allow_squash_merge
          allow_rebase_merge: params.allow_rebase_merge
          allow_auto_merge: params.allow_auto_merge
          delete_branch_on_merge: params.delete_branch_on_merge
      credential_scope:
        administration: write

  # Virtual: never mapped or dispatched. It names the deployment a
  # ref-moving operation may start, so policies can require a release
  # approver for it (G0 M8, HR-206, HR-207).
  - operation: github.deployment.trigger
    summary: A deployment that a push to a branch starts
    access: write
    target:
      type: github.repository
      id_pattern: '^(?P<owner>[a-z0-9][a-z0-9-]{0,38})/(?P<repo>\.?[a-z0-9_-][a-z0-9._-]{0,98})$'
      account: none
    params: {}
    effects:
      - kind: deployment.trigger
        description: Starts a workflow that deploys to an environment
    reversibility: compensatable
    retry:
      safe: false
      on_unknown: reconcile
    approval:
      title: Release a deployment from {target.id}
      fields: [target.id]
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11


  # The connection test (C2): a harmless read that needs no input.
  - operation: github.installation.repositories
    summary: List the repositories the App installation may reach
    access: read
    test: true
    target:
      type: pc.connection
      id_pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      account: none
    params: {}
    effects:
      - kind: none
        description: Reads only
    reversibility: reversible
    retry:
      safe: true
      on_unknown: fail
    assurance:
      basis: documented
      reviewed_by: [pantherclaw-maintainers]
      valid_until: 2027-10-11

    dispatch:
      http:
        method: GET
        path: /installation/repositories
      credential_scope:
        metadata: read

# A ref-moving operation is a deployment when a workflow deploys the branch
# it moves on push (F405, §43.3). The gateway reads the workflow files as
# they will be after the operation and reports the deploy_triggers fact;
# when it cannot, or a construct cannot be evaluated, the fact is missing or
# carries "unknown" and the consequence is UNKNOWN: held, never a safe
# merge (HR-206).
consequences:
  - id: merge-triggers-deployment
    operation: github.pull.merge
    when: facts.github_repo_deploy_triggers.state != 'none'
    requires_facts: [github.repo.deploy_triggers]
    consequence:
      operation: github.deployment.trigger
      effect: deployment.trigger
      description: >-
        Merging pushes to the base branch, where a workflow deploys to an
        environment on push.
    valid_until: 2027-10-11
  - id: write-triggers-deployment
    operation: github.contents.write
    when: facts.github_branch_deploy_triggers.state != 'none'
    requires_facts: [github.branch.deploy_triggers]
    consequence:
      operation: github.deployment.trigger
      effect: deployment.trigger
      description: >-
        Committing to this branch pushes to it, and a workflow deploys the
        branch to an environment on push.
    valid_until: 2027-10-11
  - id: branch-triggers-deployment
    operation: github.branch.create
    when: facts.github_branch_deploy_triggers.state != 'none'
    requires_facts: [github.branch.deploy_triggers]
    consequence:
      operation: github.deployment.trigger
      effect: deployment.trigger
      description: >-
        Creating this branch pushes it, and a workflow at that commit deploys
        branches of that name to an environment on push.
    valid_until: 2027-10-11
