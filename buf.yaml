# buf: protobuf lint, breaking-change detection and generation (ADR-0005).
version: v2
modules:
  - path: proto
    # The vendored OTLP message files are their own buf workspace
    # (proto/third_party/otlp/buf.yaml), generated by `task gen` (G0 M13 D30).
    excludes:
      - proto/third_party
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
