#
# PantherClaw on Kubernetes (G0 M13 D36, D42). Secrets are never values:
# create the Secrets first and name them here. Install:
#
#   helm install pantherclaw deploy/helm/pantherclaw -f my-values.yaml
#
# Before the first install, create the database roles once with
# `pantherclaw-server db bootstrap` (docs/runbooks); every install and
# upgrade then runs `migrate up` as a hook Job.

image:
  server:
    repository: ghcr.io/katocxl/pantherclaw-server
    # Pin the digest from the release notes; it wins over the tag.
    digest: ""
    tag: ""  # default: the chart's appVersion
  pullPolicy: IfNotPresent

# development, staging or production.
deployment: production

# The operator's maintenance hold (G0 M13 D26, HR-379): while true, no
# decision is made from any path. It is set on every API and worker replica
# (each process holds on its own; platform-3 review L1).
maintenanceHold: false

# The server's external base URL (https). Replace the example.
publicURL: https://pantherclaw.example.com

logLevel: info

api:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  service:
    type: ClusterIP
    port: 8080
    # A fixed address in the cluster's Service range: the edges of agent
    # pods reach the API there through hostAliases, with no DNS. Required
    # when agentNamespaces is set (G0 M32 D965a).
    clusterIP: ""
    # The hostname the edges call; api.tls's certificate must name it.
    agentHostname: pantherclaw-api.pantherclaw.internal
  # TLS on the API listener from a kubernetes.io/tls Secret. Without it the
  # listener is plain HTTP for a TLS-terminating ingress or mesh
  # (http.plaintext_behind_proxy); name the proxies' addresses below.
  tls:
    existingSecret: ""
  trustedProxies: []

worker:
  # Two workers by default (G0 M19 D202, HR-498): every job is safe with
  # two or more, and the worker PodDisruptionBudget keeps one running.
  replicas: 2
  concurrency: 10
  # The worker's health listener (health.addr, HR-397): /livez and /readyz only.
  healthPort: 8081
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# The server's gateway listener (mutual TLS with its internal CA). The
# Service passes TCP through: gateways present their certificates to the
# server itself, never to a load balancer.
gatewayAPI:
  # DNS names gateways use; the first one forms the URL. Replace the example.
  hostnames: [pantherclaw-gateway.example.com]
  port: 8443
  service:
    type: LoadBalancer
    annotations: {}

# Workload identity on this cluster (G0 M32 D969). Each entry becomes one
# identity.kubernetes_clusters entry of the server: the server calls the
# cluster's TokenReview API and reads pods with its own projected service
# account token (bound to system:auth-delegator). The chart generates one
# webhook secret per cluster for the admission webhook path (D969a).
identity:
  kubernetesClusters: []
  # - name: home
  #   # The org ids that may bind issuer entries to this cluster.
  #   orgs: [00000000-0000-0000-0000-000000000000]
  #   # The private ranges the API server resolves to (the Service range
  #   # of kubernetes.default.svc and the control plane's addresses).
  #   allowedPrefixes: [10.96.0.0/12]
  #   # Default: the in-cluster API server.
  #   apiServer: https://kubernetes.default.svc
  # The lifetime of the server's own projected reviewer token.
  reviewerTokenExpirationSeconds: 3600

# An in-cluster gateway for agent pods (G0 M32 D968, D969): off by default.
# It enrolls from a projected service account token (audience
# pantherclaw-gateway:<org>) bound to the gateway in PantherClaw, keeps its
# identity in an emptyDir and enrolls again on every restart.
gateway:
  enabled: false
  # The org the gateway serves (its token audience).
  org: ""
  image:
    repository: ghcr.io/katocxl/pantherclaw-gateway
    # Pin the digest from the release notes; it wins over the tag.
    digest: ""
    tag: ""  # default: the chart's appVersion
  replicas: 1
  port: 8090
  # The hostname agent pods call; they resolve it through hostAliases to
  # service.clusterIP (agent pods get no DNS, FQ32-3).
  hostname: pantherclaw-gateway.pantherclaw.internal
  service:
    # A fixed address in the cluster's Service range; required when
    # agentNamespaces is set (D965).
    clusterIP: ""
  # kubernetes.io/tls Secret for the agent-facing listener (its certificate
  # names hostname). Required when the gateway is enabled.
  tls:
    existingSecret: ""
  # The server's API the gateway enrolls with; default publicURL.
  controlAPIURL: ""
  # The internal CA pin ("sha256:<hex>") from the gateway's enrollment page.
  caSHA256: ""
  # Private ranges the gateway's targets live in (egress.allowed_prefixes).
  egressAllowedPrefixes: []
  # The edge pins the CA of the agent-facing certificate ("sha256:<hex>");
  # empty: the edge image's system roots.
  tlsCAPin: ""
  tokenExpirationSeconds: 3600
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# The admission webhook (G0 M32 D967, D969): off by default. It fails
# closed (failurePolicy Fail, FQ32-1): while the API is down, no pod starts
# in a protected namespace.
admission:
  enabled: false
  port: 8444
  # The identity.kubernetesClusters entry that is this cluster.
  cluster: ""
  tls:
    # kubernetes.io/tls Secret for the webhook listener; its certificate
    # names <release>-pantherclaw-api.<namespace>.svc. Required when enabled.
    existingSecret: ""
    # "<namespace>/<certificate>": cert-manager injects the CA bundle.
    certManagerCertificate: ""
    # Otherwise the CA bundle (base64 PEM) the API server verifies with.
    caBundle: ""
  # The edge and probe images admitted ("sha256:<hex>").
  edgeImageDigests: []
  probeImageDigests: []
  # The webhook secret in the webhook path is generated into a Secret the
  # chart owns (kept on uninstall) and reused on upgrade. A GitOps re-render
  # (helm template) generates a new one: pods in protected namespaces may
  # then be denied for up to about 2 minutes until the Secret syncs to the
  # server (failing closed, FQ32-1).

# Agent namespaces (G0 M32 D965, D969). For each one the chart renders the
# agent NetworkPolicy (egress only to the gateway, no DNS), the reviewer's
# Role, one ValidatingWebhookConfiguration per org and a daily probe
# CronJob. Label each namespace pantherclaw.dev/protect=enforce and
# pantherclaw.dev/org=<org>. See examples/agent-pod.yaml for an agent pod.
agentNamespaces: []
# - name: agents
#   org: 00000000-0000-0000-0000-000000000000
#   # NetworkPolicy ingress peers; empty: no ingress.
#   ingressFrom: []
#   # For a server outside this cluster: the CIDRs its API is at. The API
#   # egress rule then names them instead of the api pods (D965a).
#   apiEgressCIDRs: []
#   # The edge's hosts map (agent host -> connection), rendered into the
#   # namespace's pantherclaw-edge ConfigMap (D966).
#   hosts: {api.github.com: github}

# The daily containment probe in each agent namespace (G0 M32 D970).
probe:
  schedule: "17 3 * * *"
  image:
    repository: ghcr.io/katocxl/pantherclaw-probe
    digest: ""
  edgeImage:
    repository: ghcr.io/katocxl/pantherclaw-edge
    digest: ""
  # The canary in the release namespace (G0 M32 D970a): the probe expects
  # it not to answer from an agent pod. It listens on TCP 8080.
  canary:
    # A fixed address in the Service range (the probe's PC_CANARY_IP).
    clusterIP: ""
    image:
      repository: ""
      digest: ""
    args: []

database:
  host: postgres.example.internal
  # A primary and its standbys instead of host (G0 M19 D202): each "host" or
  # "host:port", tried in order for the read-write primary, TLS verified per
  # host (verify-full). The network policy allows egress to database.port
  # only, so give every host that port. A stable endpoint (a managed service
  # or a proxy that always names the primary) in host is the alternative.
  hosts: []
  # async (default) or sync. sync declares one synchronous standby with
  # synchronous_commit=remote_apply; it counts only when the primary confirms
  # it at start-up. After a promotion without it, the server starts in the
  # maintenance hold until `keys bump-epochs --all --confirm` (HR-496).
  replication: async
  port: 5432
  name: pantherclaw
  sslmode: verify-full
  maxConns: 20
  # Secret with the keys app-password and retention-password.
  existingSecret: pantherclaw-database
  # Secret with the key migrator-password, mounted only into the migrate Job.
  migratorExistingSecret: pantherclaw-database-migrator
  # Secret with the key ca.crt: the CA of the database's certificate.
  caExistingSecret: pantherclaw-database-ca

# Secret with the key kek (pantherclaw-server keys gen-kek --out kek).
kek:
  existingSecret: pantherclaw-kek

# People sign in through your OpenID provider(s).
oidc:
  providers: []
  # - name: sso
  #   issuer: https://idp.example.com
  #   clientID: pantherclaw
  #   existingSecret: pantherclaw-oidc   # key client-secret

networkPolicy:
  enabled: true
  # Where API (8080) and gateway (8443) clients come from; empty: anywhere.
  apiFrom: []
  gatewayFrom: []
  # Outbound: DNS, the database, HTTPS (identity providers, notifications)
  # and SMTP submission.
  egressPorts: [443, 587]
  # With identity.kubernetesClusters: the API server's endpoint ports.
  kubernetesAPIPorts: [443, 6443]

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
