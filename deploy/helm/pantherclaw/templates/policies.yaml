{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- range $component := list "api" "worker" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pantherclaw.fullname" $ }}-{{ $component }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pantherclaw.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if eq $component "api" }}
    - ports:
        - port: 8080
      {{- with $np.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: {{ $.Values.gatewayAPI.port }}
      {{- with $np.gatewayFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    # The worker's health listener only.
    - ports:
        - port: {{ $.Values.worker.healthPort }}
    {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - port: {{ $.Values.database.port }}
    {{- range $np.egressPorts }}
    - ports:
        - port: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "api" "worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pantherclaw.fullname" $ }}-{{ $component }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "pantherclaw.selector" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
