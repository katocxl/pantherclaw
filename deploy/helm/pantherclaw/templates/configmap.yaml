{{- range $role := list "api" "worker" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pantherclaw.fullname" $ }}-{{ $role }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
data:
  server.json: |
    {{- include "pantherclaw.serverConfig" (dict "root" $ "role" $role) | nindent 4 }}
{{- end }}
