{{/*
SPDX-License-Identifier: BUSL-1.1
Copyright (c) 2026 Joshua Kato. See LICENSE and NOTICE.

Kubernetes enforcement (G0 M32 D964-D970): the server's reviewer access, the
webhook secret, and for each agent namespace the agent NetworkPolicy
(D965), the reviewer's Role, the edge configuration, the probe CronJob and,
per org, the ValidatingWebhookConfiguration (D967, D969).
*/}}
{{- $v := .Values }}
{{- $fullname := include "pantherclaw.fullname" . }}
{{- if $v.identity.kubernetesClusters }}
---
# The server reviews tokens with its own projected service account token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-{{ .Release.Namespace }}-auth-delegator
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
---
# One webhook secret per cluster (D969a): generated once, reused on
# upgrade, kept on uninstall. Its value is in the webhook path.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pantherclaw.webhookSecretName" . }}
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $v.identity.kubernetesClusters }}
  {{ .name }}: {{ include "pantherclaw.webhookSecret" (dict "root" $ "cluster" .name) | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if $v.agentNamespaces }}
{{- if not $v.admission.enabled }}
{{- fail "agentNamespaces needs admission.enabled (G0 M32 D969)" }}
{{- end }}
{{- if not $v.gateway.enabled }}
{{- fail "agentNamespaces needs gateway.enabled (G0 M32 D965)" }}
{{- end }}
{{- $clusterIP := required "gateway.service.clusterIP is required when agentNamespaces is set (G0 M32 D965)" $v.gateway.service.clusterIP }}
{{- $clusterName := required "admission.cluster is required when agentNamespaces is set" $v.admission.cluster }}
{{- $cluster := dict }}
{{- range $v.identity.kubernetesClusters }}
{{- if eq .name $clusterName }}{{- $cluster = . }}{{- end }}
{{- end }}
{{- if not $cluster }}
{{- fail (printf "admission.cluster %q is not in identity.kubernetesClusters" $clusterName) }}
{{- end }}
{{- $orgs := list }}
{{- range $ns := $v.agentNamespaces }}
{{- $org := required "agentNamespaces[].org is required" $ns.org }}
{{- if not (has $org $cluster.orgs) }}
{{- fail (printf "agentNamespaces %q: org %s is not in the orgs of cluster %q" $ns.name $org $clusterName) }}
{{- end }}
{{- $orgs = append $orgs $org | uniq }}
---
# The agent NetworkPolicy (D965): egress only to the gateway pods on the
# gateway port, no DNS (FQ32-3); no ingress unless ingressFrom is set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pantherclaw-agents
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  {{- if $ns.ingressFrom }}
  ingress:
    - from:
        {{- toYaml $ns.ingressFrom | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - port: {{ $v.gateway.port }}
          protocol: TCP
---
# The reviewer reads this namespace's pods and NetworkPolicies (D969).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-reviewer
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-reviewer
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-reviewer
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ $.Release.Namespace }}
---
# The edge's configuration (pantherclaw.edge/v1, kubernetes mode, D966),
# mounted into every agent pod's edge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pantherclaw-edge
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
data:
  edge.json: |
    {{- $edge := dict "format" "pantherclaw.edge/v1" "mode" "kubernetes" "listen" "127.0.0.1:3128"
          "gateway_url" (include "pantherclaw.agentGatewayURL" $) "hosts" (required "agentNamespaces[].hosts is required" $ns.hosts)
          "kube_token_file" "/var/run/pantherclaw/edge/token" "api_url" $v.publicURL "ca_dir" "/pc-edge" }}
    {{- with $v.gateway.tlsCAPin }}{{- $_ := set $edge "gateway_ca_pin" . }}{{- end }}
    {{- toPrettyJson $edge | nindent 4 }}
---
# The probe's service account: it holds no token of its own; the edge
# mounts a projected one (D970).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantherclaw-probe
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
# The daily containment probe (D969, D970): an agent pod whose app
# container is the probe.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pantherclaw-probe
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
spec:
  schedule: {{ $v.probe.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pantherclaw-probe
            app.kubernetes.io/instance: {{ $.Release.Name }}
        spec:
          {{- include "pantherclaw.agentPodSpec" (dict "root" $ "clusterIP" $clusterIP "serviceAccount" "pantherclaw-probe" "org" $org) | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: probe
              image: {{ include "pantherclaw.probeImage" $ }}
              imagePullPolicy: IfNotPresent
              args: ["--profile", "kubernetes"]
              env:
                {{- include "pantherclaw.agentEnv" $ | nindent 16 }}
                - name: PC_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              securityContext:
                {{- toYaml $v.securityContext | nindent 16 }}
              volumeMounts:
                - name: pc-edge
                  mountPath: /pc-edge
                  readOnly: true
{{- end }}
{{- range $org := $orgs }}
---
# Admission for the org's protected namespaces (D967, D969): fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-{{ $.Release.Namespace }}-{{ $org }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
  {{- with $v.admission.tls.certManagerCertificate }}
  annotations:
    cert-manager.io/inject-ca-from: {{ . }}
  {{- end }}
webhooks:
  - name: pods.{{ $org }}.admission.pantherclaw.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        {{ include "pantherclaw.protectLabel" $ }}: enforce
        {{ include "pantherclaw.orgLabel" $ }}: {{ $org | quote }}
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
        scope: Namespaced
    clientConfig:
      service:
        namespace: {{ $.Release.Namespace }}
        name: {{ $fullname }}-api
        port: {{ $v.admission.port }}
        path: /admission/v1/{{ $clusterName }}/{{ $org }}/{{ include "pantherclaw.webhookSecret" (dict "root" $ "cluster" $clusterName) }}
      {{- with $v.admission.tls.caBundle }}
      caBundle: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
