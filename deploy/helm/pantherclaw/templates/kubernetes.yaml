{{/*
SPDX-License-Identifier: BUSL-1.1
Copyright (c) 2026 Joshua Kato. See LICENSE and NOTICE.

Kubernetes enforcement (G0 M32 D964-D970): the server's reviewer access, the
webhook secret, and for each agent namespace the agent NetworkPolicy
(D965), the reviewer's Role, the edge configuration, the probe CronJob and,
per org, the ValidatingWebhookConfiguration (D967, D969).
*/}}
{{- $v := .Values }}
{{- $fullname := include "pantherclaw.fullname" . }}
{{- if $v.identity.kubernetesClusters }}
---
# The server reviews tokens with its own projected service account token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-{{ .Release.Namespace }}-auth-delegator
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
---
# One webhook secret per cluster (D969a): generated once, reused on
# upgrade, kept on uninstall. Its value is in the webhook path.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pantherclaw.webhookSecretName" . }}
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $v.identity.kubernetesClusters }}
  {{ .name }}: {{ include "pantherclaw.webhookSecret" (dict "root" $ "cluster" .name) | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if $v.agentNamespaces }}
{{- if not $v.admission.enabled }}
{{- fail "agentNamespaces needs admission.enabled (G0 M32 D969)" }}
{{- end }}
{{- if not $v.gateway.enabled }}
{{- fail "agentNamespaces needs gateway.enabled (G0 M32 D965)" }}
{{- end }}
{{- $clusterIP := required "gateway.service.clusterIP is required when agentNamespaces is set (G0 M32 D965)" $v.gateway.service.clusterIP }}
{{- $_ := required "api.service.clusterIP is required when agentNamespaces is set (G0 M32 D965a)" $v.api.service.clusterIP }}
{{- $_ := required "probe.canary.clusterIP is required when agentNamespaces is set (G0 M32 D970a)" $v.probe.canary.clusterIP }}
{{- if not $v.api.tls.existingSecret }}
{{- fail "agentNamespaces needs api.tls.existingSecret: the edges call the API over TLS at api.service.agentHostname (G0 M32 D965a)" }}
{{- end }}
{{- $clusterName := required "admission.cluster is required when agentNamespaces is set" $v.admission.cluster }}
{{- $cluster := dict }}
{{- range $v.identity.kubernetesClusters }}
{{- if eq .name $clusterName }}{{- $cluster = . }}{{- end }}
{{- end }}
{{- if not $cluster }}
{{- fail (printf "admission.cluster %q is not in identity.kubernetesClusters" $clusterName) }}
{{- end }}
{{- $orgs := list }}
{{- range $ns := $v.agentNamespaces }}
{{- $org := required "agentNamespaces[].org is required" $ns.org }}
{{- if not (has $org $cluster.orgs) }}
{{- fail (printf "agentNamespaces %q: org %s is not in the orgs of cluster %q" $ns.name $org $clusterName) }}
{{- end }}
{{- $orgs = append $orgs $org | uniq }}
---
# The agent NetworkPolicy (D965): egress only to the gateway pods on the
# gateway port, no DNS (FQ32-3); no ingress unless ingressFrom is set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pantherclaw-agents
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  {{- if $ns.ingressFrom }}
  ingress:
    - from:
        {{- toYaml $ns.ingressFrom | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - port: {{ $v.gateway.port }}
          protocol: TCP
    # The edge enrolls, renews and starts runs at the API (D965a): the api
    # pods, or a server outside the cluster by its CIDRs.
    {{- if $ns.apiEgressCIDRs }}
    - to:
        {{- range $ns.apiEgressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ $v.api.service.port }}
          protocol: TCP
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
---
# The reviewer reads this namespace's pods and NetworkPolicies (D969).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-reviewer
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-reviewer
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-reviewer
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ $.Release.Namespace }}
---
# The edge's configuration (pantherclaw.edge/v1, kubernetes mode, D966),
# mounted into every agent pod's edge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pantherclaw-edge
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
data:
  edge.json: |
    {{- include "pantherclaw.edgeConfig" (dict "root" $ "hosts" (required "agentNamespaces[].hosts is required" $ns.hosts)) | nindent 4 }}
---
# The probe's service account: it holds no token of its own; the edge
# mounts a projected one (D970).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantherclaw-probe
  namespace: {{ $ns.name }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
# The daily containment probe (D969, D970): an agent pod whose app
# container is the probe.
{{- include "pantherclaw.probeCronJob" (dict "root" $ "name" "pantherclaw-probe" "namespace" $ns.name "clusterIP" $clusterIP
      "serviceAccount" "pantherclaw-probe" "org" $org "args" (list "--profile" "kubernetes")) }}
{{- end }}
{{- $first := first $v.agentNamespaces }}
---
# The control twin (D970, D970a) runs in the release namespace, which is
# not protected: the same pod shape, with its own service account and
# issuer entry. Its edge configuration is the first agent namespace's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pantherclaw-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
data:
  edge.json: |
    {{- include "pantherclaw.edgeConfig" (dict "root" $ "hosts" $first.hosts) | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantherclaw-probe-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- include "pantherclaw.probeCronJob" (dict "root" $ "name" "pantherclaw-probe-control" "namespace" .Release.Namespace "clusterIP" $clusterIP
      "serviceAccount" "pantherclaw-probe-control" "org" $first.org "args" (list "--profile" "kubernetes" "--kind" "control")) }}
---
# The canary (D970a): what the probe must not reach from an agent pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pantherclaw-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pantherclaw.selector" (dict "root" . "component" "canary") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantherclaw.labels" . | nindent 8 }}
        app.kubernetes.io/component: canary
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: canary
          image: {{ printf "%s@%s" (required "probe.canary.image.repository is required when agentNamespaces is set" $v.probe.canary.image.repository) (required "probe.canary.image.digest is required when agentNamespaces is set" $v.probe.canary.image.digest) }}
          imagePullPolicy: IfNotPresent
          {{- with $v.probe.canary.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: canary
              containerPort: 8080
              protocol: TCP
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pantherclaw-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
spec:
  type: ClusterIP
  clusterIP: {{ $v.probe.canary.clusterIP }}
  selector:
    {{- include "pantherclaw.selector" (dict "root" . "component" "canary") | nindent 4 }}
  ports:
    - name: canary
      port: 8080
      targetPort: canary
      protocol: TCP
{{- range $org := $orgs }}
---
# Admission for the org's protected namespaces (D967, D969): fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-{{ $.Release.Namespace }}-{{ $org }}
  labels:
    {{- include "pantherclaw.labels" $ | nindent 4 }}
  {{- with $v.admission.tls.certManagerCertificate }}
  annotations:
    cert-manager.io/inject-ca-from: {{ . }}
  {{- end }}
webhooks:
  - name: pods.{{ $org }}.admission.pantherclaw.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        {{ include "pantherclaw.protectLabel" $ }}: enforce
        {{ include "pantherclaw.orgLabel" $ }}: {{ $org | quote }}
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
        scope: Namespaced
    clientConfig:
      service:
        namespace: {{ $.Release.Namespace }}
        name: {{ $fullname }}-api
        port: {{ $v.admission.port }}
        path: /admission/v1/{{ $clusterName }}/{{ $org }}/{{ include "pantherclaw.webhookSecret" (dict "root" $ "cluster" $clusterName) }}
      {{- with $v.admission.tls.caBundle }}
      caBundle: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
