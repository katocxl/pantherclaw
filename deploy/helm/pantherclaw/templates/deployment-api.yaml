{{- $keys := list (dict "volume" "database" "key" "app-password" "as" "app-password") (dict "volume" "database" "key" "retention-password" "as" "retention-password") (dict "volume" "database-ca" "key" "ca.crt" "as" "ca.crt") (dict "volume" "kek" "key" "kek" "as" "kek") -}}
{{- if .Values.api.tls.existingSecret }}
{{- $keys = append $keys (dict "volume" "tls" "key" "tls.crt" "as" "tls.crt") }}
{{- $keys = append $keys (dict "volume" "tls" "key" "tls.key" "as" "tls.key") }}
{{- end }}
{{- range .Values.oidc.providers }}
{{- $keys = append $keys (dict "volume" (printf "oidc-%s" .name) "key" "client-secret" "as" (printf "oidc-%s" .name)) }}
{{- end }}
{{- $scheme := ternary "HTTPS" "HTTP" (ne .Values.api.tls.existingSecret "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pantherclaw.fullname" . }}-api
  labels:
    {{- include "pantherclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "pantherclaw.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantherclaw.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include "pantherclaw.serverConfig" (dict "root" . "role" "api") | sha256sum }}
    spec:
      serviceAccountName: {{ include "pantherclaw.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "pantherclaw.stageSecrets" (dict "root" . "keys" $keys) | nindent 8 }}
      containers:
        - name: server
          image: {{ include "pantherclaw.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/pantherclaw/server.json"]
          env:
            {{- include "pantherclaw.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: gateway-api
              containerPort: {{ .Values.gatewayAPI.port }}
          livenessProbe:
            httpGet: {path: /livez, port: http, scheme: {{ $scheme }}}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /livez, port: http, scheme: {{ $scheme }}}
            periodSeconds: 2
            failureThreshold: 60
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pantherclaw/server.json
              subPath: server.json
              readOnly: true
            - name: secrets
              mountPath: /etc/pantherclaw/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "pantherclaw.fullname" . }}-api
        # The staged secrets: in memory, 0400, read-only in the server (D42).
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: database
          secret:
            secretName: {{ .Values.database.existingSecret }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.caExistingSecret }}
        - name: kek
          secret:
            secretName: {{ .Values.kek.existingSecret }}
        {{- if .Values.api.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.api.tls.existingSecret }}
        {{- end }}
        {{- range .Values.oidc.providers }}
        - name: oidc-{{ .name }}
          secret:
            secretName: {{ .existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
