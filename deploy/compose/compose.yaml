#
# Local stack for development and demos. Profiles today (`task up PROFILE=…`):
#   core          PostgreSQL (the default profile)
#   test          throwaway PostgreSQL on 5433 and a mock OpenID provider,
#                 for `task test:integration`
#   identity      Keycloak dev realm (M2)
#   full-demo     PostgreSQL and Keycloak
# The server, gateway and simulators are not services here: they run with
# `go run` (BUILD_GUIDE §4). Planned: an observability profile once the
# OpenTelemetry exporter is decided (M13), and egress-locked agent
# sandboxes (M9).
# Ports bind to 127.0.0.1 only. Never use these settings in production.
name: pantherclaw

services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    profiles: ["core", "full-demo"]
    environment:
      POSTGRES_DB: pantherclaw
      POSTGRES_USER: pc_owner
      POSTGRES_PASSWORD: ${PC_PG_PASSWORD:?set PC_PG_PASSWORD in deploy/compose/.env (copy .env.example)}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc_owner -d pantherclaw"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Throwaway cluster for integration tests (`task test:integration`). Data
  # lives in tmpfs and durability is off; never point anything else at it.
  postgres-test:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PC_PG_TEST_PASSWORD:?set PC_PG_TEST_PASSWORD in deploy/compose/.env (copy .env.example)}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=300
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30


  # Mock OpenID provider for integration tests (navikt/mock-oauth2-server):
  # issuer http://127.0.0.1:8181/default, any client secret, a login form
  # that accepts any subject and claims. Test use only.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
    profiles: ["test"]
    ports:
      - "127.0.0.1:8181:8080"
    security_opt:
      - no-new-privileges:true

  # Keycloak development realm (M2): issuer
  # http://127.0.0.1:8180/realms/pantherclaw, client "pantherclaw", users
  # alice and bob. Credentials in the realm file are development-only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    profiles: ["identity", "full-demo"]
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://127.0.0.1:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in deploy/compose/.env (copy .env.example)}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ../keycloak/realm-pantherclaw.json:/opt/keycloak/data/import/realm-pantherclaw.json:ro
    security_opt:
      - no-new-privileges:true
volumes:
  pgdata:
