syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// BundleService pins publisher keys and installs, lists and revokes
// publisher bundles (G0 M37 D1081–D1083; FQ37-1..3; HR-795..801; every
// edition, each item kind keeps its own edition gate). A bundle is data
// only: tool packages, OpenAPI specs, detection rules, playbooks, fact
// declarations and channel templates, never code. A publisher key is
// trusted only once a person activates its pin on its page (confirm_url)
// with a security key. Installing verifies the bundle against the org's
// ACTIVE pins and creates drafts only: nothing is activated, published or
// enabled. A revoked publisher key or bundle stops being used at once.
service BundleService {
  // PinPublisherKey records a PENDING pin of a publisher's key (a person
  // only). It trusts nothing until activated on its page.
  // permission: publisher.manage
  rpc PinPublisherKey(PinPublisherKeyRequest) returns (PinPublisherKeyResponse);
  // ListPublisherPins lists the org's publisher pins.
  // permission: bundle.read
  rpc ListPublisherPins(ListPublisherPinsRequest) returns (ListPublisherPinsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetPublisherPin returns one pin.
  // permission: bundle.read
  rpc GetPublisherPin(GetPublisherPinRequest) returns (GetPublisherPinResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ActivatePublisherPin is refused over the API (STEP_UP_REQUIRED): a
  // person activates a pin on its page with a security key.
  // permission: publisher.manage
  rpc ActivatePublisherPin(ActivatePublisherPinRequest) returns (ActivatePublisherPinResponse);
  // RevokePublisherPin revokes a pin (a person only). COMPROMISED also
  // revokes every install the key signed, at once.
  // permission: publisher.manage
  rpc RevokePublisherPin(RevokePublisherPinRequest) returns (RevokePublisherPinResponse);
  // InstallBundle verifies a .pcbundle file and drafts its items (a person
  // signed in as themselves). Nothing is activated.
  // permission: bundle.install
  rpc InstallBundle(InstallBundleRequest) returns (InstallBundleResponse);
  // ListBundleInstalls lists the org's bundle installs by id.
  // permission: bundle.read
  rpc ListBundleInstalls(ListBundleInstallsRequest) returns (ListBundleInstallsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetBundleInstall returns one install and its items.
  // permission: bundle.read
  rpc GetBundleInstall(GetBundleInstallRequest) returns (GetBundleInstallResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeBundleInstall revokes an install and every version of its bundle
  // up to it (a person only).
  // permission: bundle.install
  rpc RevokeBundleInstall(RevokeBundleInstallRequest) returns (RevokeBundleInstallResponse);
  // SubmitRevocation applies a publisher-signed revocation statement,
  // accepted only from a key the org has pinned for that publisher.
  // permission: bundle.install
  rpc SubmitRevocation(SubmitRevocationRequest) returns (SubmitRevocationResponse);
}

// PublisherPin is one pinned publisher key.
message PublisherPin {
  // Pin id.
  string id = 1;
  // The publisher id.
  string publisher = 2;
  // The key id, publisher-<publisher>-<thumb22>.
  string kid = 3;
  // The hex SHA-256 of the raw Ed25519 public key.
  string fingerprint = 4;
  // The item kinds the pin allows; empty allows every kind.
  repeated string allowed_kinds = 5;
  // Where the daily job fetches the publisher's revocation statements;
  // empty when none.
  string revocations_url = 6;
  // "PENDING", "ACTIVE" or "REVOKED".
  string state = 7;
  // "UNPINNED", "COMPROMISED" or "PUBLISHER_REVOKED" once revoked.
  string revoke_reason = 8;
  // Who pinned it.
  string created_by = 9;
  // When it was pinned.
  google.protobuf.Timestamp create_time = 10;
  // Who activated it with a security key.
  string activated_by = 11;
  // When it was activated.
  google.protobuf.Timestamp activate_time = 12;
  // When it was revoked.
  google.protobuf.Timestamp revoke_time = 13;
  // The page where a person activates it.
  string confirm_url = 14;
}

// PinPublisherKeyRequest names a publisher key.
message PinPublisherKeyRequest {
  // The publisher id.
  string publisher = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{2,31}$"];
  // The raw Ed25519 public key (32 bytes).
  bytes public_key = 2 [(buf.validate.field).bytes.len = 32];
  // The item kinds the pin allows; empty allows every kind.
  repeated string allowed_kinds = 3 [(buf.validate.field).repeated = {
    max_items: 6
    unique: true
    items: {
      string: {
        in: [
          "tool_package",
          "openapi_spec",
          "detection_rule",
          "playbook",
          "facts_declaration",
          "channel_template"
        ]
      }
    }
  }];
  // An https URL of the publisher's revocation statements; optional.
  string revocations_url = 4 [(buf.validate.field).string = {
    max_len: 2048
    pattern: "^(https://.+)?$"
  }];
  // Optional: the hex SHA-256 of public_key as the publisher gave it. The
  // server computes the fingerprint and kid itself and refuses a mismatch.
  string expected_fingerprint = 5 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
}

// PinPublisherKeyResponse returns the pin.
message PinPublisherKeyResponse {
  // The pin, PENDING.
  PublisherPin pin = 1;
}

// ListPublisherPinsRequest pages pins.
message ListPublisherPinsRequest {
  // Maximum results (default and at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListPublisherPinsResponse is one page.
message ListPublisherPinsResponse {
  // Pins, by id.
  repeated PublisherPin pins = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// GetPublisherPinRequest names a pin.
message GetPublisherPinRequest {
  // Pin id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetPublisherPinResponse returns it.
message GetPublisherPinResponse {
  // The pin.
  PublisherPin pin = 1;
}

// ActivatePublisherPinRequest names a pin.
message ActivatePublisherPinRequest {
  // Pin id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ActivatePublisherPinResponse returns it.
message ActivatePublisherPinResponse {
  // The pin.
  PublisherPin pin = 1;
}

// RevokePublisherPinRequest names a pin and why.
message RevokePublisherPinRequest {
  // Pin id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // "UNPINNED" (no longer trusted for new installs) or "COMPROMISED"
  // (someone else may hold the key: every install it signed is revoked).
  string reason = 2 [(buf.validate.field).string = {
    in: [
      "UNPINNED",
      "COMPROMISED"
    ]
  }];
}

// RevokePublisherPinResponse returns the pin and what was revoked.
message RevokePublisherPinResponse {
  // The pin, REVOKED.
  PublisherPin pin = 1;
  // The installs revoked with it.
  repeated string revoked_installs = 2;
}

// BundleItem is one item of an install.
message BundleItem {
  // "tool_package", "openapi_spec", "detection_rule", "playbook",
  // "facts_declaration" or "channel_template".
  string kind = 1;
  // ext.<publisher>.<name>.
  string name = 2;
  // The hex SHA-256 of the item file.
  string sha256 = 3;
  // What the item became: "package_draft", "custom_rule", "automation" or
  // "template".
  string target_type = 4;
  // Its id (a custom rule or automation id, or name@version of a package
  // draft).
  string target_id = 5;
  // "DRAFTED", "TEMPLATE" or "REVOKED".
  string state = 6;
}

// BundleInstall is one install.
message BundleInstall {
  // Install id.
  string id = 1;
  // The publisher id.
  string publisher = 2;
  // The bundle name, ext.<publisher>.<slug>.
  string name = 3;
  // The bundle version.
  string version = 4;
  // The hex SHA-256 of the .pcbundle file.
  string bundle_sha256 = 5;
  // The pin whose key verified it.
  string pin_id = 6;
  // "PENDING", "INSTALLED", "FAILED" or "REVOKED".
  string state = 7;
  // Who installed it.
  string installed_by = 8;
  // When the install started.
  google.protobuf.Timestamp create_time = 9;
  // When it finished.
  google.protobuf.Timestamp finish_time = 10;
  // The refusal's code when FAILED.
  string failure_code = 11;
  // The items (GetBundleInstall only).
  repeated BundleItem items = 12;
}

// InstallBundleRequest carries a .pcbundle file.
message InstallBundleRequest {
  // The .pcbundle file (a zip).
  bytes bundle = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 8388608
  }];
}

// InstallBundleResponse returns the install.
message InstallBundleResponse {
  // The install, INSTALLED, with its items.
  BundleInstall install = 1;
}

// ListBundleInstallsRequest pages installs.
message ListBundleInstallsRequest {
  // Maximum results (default and at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListBundleInstallsResponse is one page.
message ListBundleInstallsResponse {
  // Installs, by id.
  repeated BundleInstall installs = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// GetBundleInstallRequest names an install.
message GetBundleInstallRequest {
  // Install id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetBundleInstallResponse returns it.
message GetBundleInstallResponse {
  // The install and its items.
  BundleInstall install = 1;
}

// RevokeBundleInstallRequest names an install.
message RevokeBundleInstallRequest {
  // Install id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeBundleInstallResponse returns what was revoked.
message RevokeBundleInstallResponse {
  // The installs revoked.
  repeated string revoked_installs = 1;
}

// SubmitRevocationRequest carries a statement.
message SubmitRevocationRequest {
  // The compact JWS, typ pc-bundle-revocation+jwt.
  string statement = 1 [(buf.validate.field).string = {
    min_len: 16
    max_len: 65536
  }];
}

// SubmitRevocationResponse returns what was revoked.
message SubmitRevocationResponse {
  // The installs revoked.
  repeated string revoked_installs = 1;
  // The pins revoked (a KEY statement).
  repeated string revoked_pins = 2;
  // True when the same statement was applied before.
  bool already_applied = 3;
}
