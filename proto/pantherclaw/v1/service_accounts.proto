syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/access.proto";

// ServiceAccountService manages non-human principals (SB-2, ADR-0016):
// service accounts, the public keys they sign client assertions with
// (private_key_jwt, algorithm pinned per key, HR-095) and their scoped pck_
// API keys. Service accounts and API keys can never hold human-only
// permissions such as approving actions.
service ServiceAccountService {
  // CreateServiceAccount creates a service account.
  // permission: service_account.manage
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  // GetServiceAccount returns one service account.
  // permission: service_account.read
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListServiceAccounts lists service accounts.
  // permission: service_account.read
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateServiceAccount changes a service account's description.
  // permission: service_account.manage
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (UpdateServiceAccountResponse);
  // SetServiceAccountState disables or re-enables a service account; its
  // tokens and API keys stop working at the next request.
  // permission: service_account.manage
  rpc SetServiceAccountState(SetServiceAccountStateRequest) returns (SetServiceAccountStateResponse);

  // AddServiceAccountKey registers a public key for client assertions. The
  // private key never reaches PantherClaw.
  // permission: service_account.manage
  rpc AddServiceAccountKey(AddServiceAccountKeyRequest) returns (AddServiceAccountKeyResponse);
  // ListServiceAccountKeys lists a service account's keys.
  // permission: service_account.read
  rpc ListServiceAccountKeys(ListServiceAccountKeysRequest) returns (ListServiceAccountKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeServiceAccountKey revokes a key; tokens obtained with it stop
  // working at the next request.
  // permission: service_account.manage
  rpc RevokeServiceAccountKey(RevokeServiceAccountKeyRequest) returns (RevokeServiceAccountKeyResponse);

  // CreateApiKey creates a scoped pck_ API key. The secret is returned once.
  // permission: service_account.manage
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  // ListApiKeys lists API keys.
  // permission: service_account.read
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeApiKey revokes an API key immediately.
  // permission: service_account.manage
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
}

// KeyAlgorithm is the algorithm pinned on a service-account key.
enum KeyAlgorithm {
  KEY_ALGORITHM_UNSPECIFIED = 0;
  // Ed25519.
  KEY_ALGORITHM_EDDSA = 1;
  // ECDSA P-256 with SHA-256.
  KEY_ALGORITHM_ES256 = 2;
}

// CredentialState is the state of a key or API key.
enum CredentialState {
  CREDENTIAL_STATE_UNSPECIFIED = 0;
  CREDENTIAL_STATE_ACTIVE = 1;
  CREDENTIAL_STATE_REVOKED = 2;
  // Active but past its expiry time.
  CREDENTIAL_STATE_EXPIRED = 3;
}

// ServiceAccount is a non-human principal.
message ServiceAccount {
  // Service account id.
  string id = 1;
  // Unique name in the org.
  string name = 2;
  // Description.
  string description = 3;
  // State.
  AccountState state = 4;
  // OAuth client id for the client-credentials grant (pcsa_…).
  string client_id = 5;
  // Who created it.
  string created_by = 6;
  // Creation time.
  google.protobuf.Timestamp create_time = 7;
  // Last change.
  google.protobuf.Timestamp update_time = 8;
}

// ServiceAccountKey is a registered public key.
message ServiceAccountKey {
  // Key id.
  string id = 1;
  // Owning service account.
  string service_account_id = 2;
  // RFC 7638 thumbprint; the "kid" header of client assertions.
  string kid = 3;
  // Pinned algorithm.
  KeyAlgorithm algorithm = 4;
  // Public JWK (canonical form).
  string public_jwk = 5;
  // State.
  CredentialState state = 6;
  // Who registered it.
  string created_by = 7;
  // Registration time.
  google.protobuf.Timestamp create_time = 8;
  // Expiry time.
  google.protobuf.Timestamp expire_time = 9;
  // Revocation time.
  google.protobuf.Timestamp revoke_time = 10;
}

// ApiKey is a scoped bearer key of a service account.
message ApiKey {
  // API key id.
  string id = 1;
  // Owning service account.
  string service_account_id = 2;
  // Name, unique per service account.
  string name = 3;
  // Last four characters of the key, to recognize it.
  string hint = 4;
  // Permissions the key may use (intersected with the account's roles).
  repeated string scopes = 5;
  // State.
  CredentialState state = 6;
  // Who created it.
  string created_by = 7;
  // Creation time.
  google.protobuf.Timestamp create_time = 8;
  // Expiry time.
  google.protobuf.Timestamp expire_time = 9;
  // Revocation time.
  google.protobuf.Timestamp revoke_time = 10;
  // Last use (updated at most once a minute).
  google.protobuf.Timestamp last_use_time = 11;
  // Client address ranges the key is limited to (PN-012.8); empty means
  // any address. Fixed at creation: rotate the key to change them.
  repeated string allowed_cidrs = 12;
}

// CreateServiceAccountRequest creates a service account.
message CreateServiceAccountRequest {
  // Unique name: lowercase letters, digits and hyphens.
  string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"];
  // Optional description.
  string description = 2 [(buf.validate.field).string.max_len = 1000];
}

// CreateServiceAccountResponse returns the service account.
message CreateServiceAccountResponse {
  // The service account.
  ServiceAccount service_account = 1;
}

// GetServiceAccountRequest names a service account.
message GetServiceAccountRequest {
  // Service account id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetServiceAccountResponse returns it.
message GetServiceAccountResponse {
  // The service account.
  ServiceAccount service_account = 1;
}

// ListServiceAccountsRequest pages through service accounts.
message ListServiceAccountsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListServiceAccountsResponse is one page.
message ListServiceAccountsResponse {
  // Service accounts, oldest first.
  repeated ServiceAccount service_accounts = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// UpdateServiceAccountRequest changes the fields that are set.
message UpdateServiceAccountRequest {
  // Service account id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New description.
  optional string description = 2 [(buf.validate.field).string.max_len = 1000];
}

// UpdateServiceAccountResponse returns the result.
message UpdateServiceAccountResponse {
  // The service account.
  ServiceAccount service_account = 1;
}

// SetServiceAccountStateRequest disables or re-enables a service account.
message SetServiceAccountStateRequest {
  // Service account id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New state.
  AccountState state = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// SetServiceAccountStateResponse returns the service account.
message SetServiceAccountStateResponse {
  // The service account.
  ServiceAccount service_account = 1;
}

// AddServiceAccountKeyRequest registers a public key.
message AddServiceAccountKeyRequest {
  // Service account id.
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  // Algorithm to pin on the key.
  KeyAlgorithm algorithm = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Public JWK (Ed25519 for EdDSA, P-256 for ES256).
  string public_jwk = 3 [(buf.validate.field).string = {
    min_len: 2
    max_len: 4096
  }];
  // Validity in days (default 90, at most 365).
  int32 ttl_days = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 365
  }];
}

// AddServiceAccountKeyResponse returns the key.
message AddServiceAccountKeyResponse {
  // The key.
  ServiceAccountKey key = 1;
}

// ListServiceAccountKeysRequest lists a service account's keys.
message ListServiceAccountKeysRequest {
  // Service account id.
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  // Maximum results (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 3 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListServiceAccountKeysResponse is one page.
message ListServiceAccountKeysResponse {
  // Keys, oldest first.
  repeated ServiceAccountKey keys = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// RevokeServiceAccountKeyRequest revokes a key.
message RevokeServiceAccountKeyRequest {
  // Service account id.
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  // Key id.
  string key_id = 2 [(buf.validate.field).string.uuid = true];
}

// RevokeServiceAccountKeyResponse returns the key.
message RevokeServiceAccountKeyResponse {
  // The key.
  ServiceAccountKey key = 1;
}

// CreateApiKeyRequest creates an API key.
message CreateApiKeyRequest {
  // Owning service account.
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  // Name, unique per service account.
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"];
  // Permissions the key may use; human-only permissions are rejected.
  repeated string scopes = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    unique: true
    items: {
      string: {pattern: "^[a-z][a-z_.]{0,62}$"}
    }
  }];
  // Validity in days (default 90, at most 365).
  int32 ttl_days = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 365
  }];
  // Optional client address ranges, at most 32 CIDRs such as
  // "203.0.113.0/24" (PN-012.8, Team edition). A request from any other
  // address is refused like a bad key. Fixed for the key's lifetime.
  repeated string allowed_cidrs = 5 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {max_len: 43}
    }
  }];
}

// CreateApiKeyResponse returns the key and its secret.
message CreateApiKeyResponse {
  // The API key.
  ApiKey api_key = 1;
  // The key (pck_…). It is shown only once.
  string secret = 2;
}

// ListApiKeysRequest pages through API keys.
message ListApiKeysRequest {
  // Only keys of this service account.
  string service_account_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Maximum results (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 3 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListApiKeysResponse is one page.
message ListApiKeysResponse {
  // API keys, oldest first.
  repeated ApiKey api_keys = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// RevokeApiKeyRequest revokes an API key.
message RevokeApiKeyRequest {
  // API key id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeApiKeyResponse returns the API key.
message RevokeApiKeyResponse {
  // The API key.
  ApiKey api_key = 1;
}
