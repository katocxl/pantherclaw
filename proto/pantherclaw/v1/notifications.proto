syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// NotificationService manages notification channels (log, email, Slack,
// signed webhooks) and shows their delivery health (G0 M5 part 1,
// HR-157..159). A channel only tells people that something happened and
// links to PantherClaw: nothing sent or received through a channel ever
// approves anything. Secrets (a webhook signing secret, a Slack webhook URL)
// are stored encrypted and never returned, except a new signing secret once.
service NotificationService {
  // CreateChannel adds a channel. For a webhook channel the signing secret
  // is returned once. Community allows 3 channels.
  // permission: notification.manage
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  // GetChannel returns a channel with its health and its last 20 deliveries.
  // permission: notification.read
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListChannels lists the org's channels.
  // permission: notification.read
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateChannel renames a channel, changes its subscription, or pauses or
  // resumes it. Its destination cannot change: create a new channel.
  // permission: notification.manage
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  // DeleteChannel removes a channel; its pending deliveries are cancelled.
  // permission: notification.manage
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  // RotateChannelSecret replaces a webhook channel's signing secret. The new
  // secret is returned once; the old one keeps signing for 24 hours.
  // permission: notification.manage
  rpc RotateChannelSecret(RotateChannelSecretRequest) returns (RotateChannelSecretResponse);
  // SetChannelSignatureScheme opts a webhook channel in to Ed25519 signatures
  // ("hmac+ed25519": a `v1a,` signature by the org's webhooks key next to the
  // HMAC `v1,` ones) or back to HMAC only ("hmac", the default). HMAC is
  // always sent. Audited.
  // permission: notification.manage
  rpc SetChannelSignatureScheme(SetChannelSignatureSchemeRequest) returns (SetChannelSignatureSchemeResponse);
  // TestChannel sends a test notification to one channel.
  // permission: notification.manage
  rpc TestChannel(TestChannelRequest) returns (TestChannelResponse);
  // ListDeliveries lists deliveries, newest first.
  // permission: notification.read
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ProposeSlackLink looks the caller up in the workspace of the org's Slack
  // DM channel by their own email and proposes the link (G0 M20 D256,
  // D265): a full, confirmed member with that email, on one of the
  // channel's email domains. The caller confirms it with ConfirmChatLink.
  // permission: authenticated
  rpc ProposeSlackLink(ProposeSlackLinkRequest) returns (ProposeSlackLinkResponse);
  // ConfirmChatLink confirms the caller's own proposed link: approval DMs
  // for requests they may decide then reach them.
  // permission: authenticated
  rpc ConfirmChatLink(ConfirmChatLinkRequest) returns (ConfirmChatLinkResponse);
  // RevokeChatLink revokes the caller's own link.
  // permission: authenticated
  rpc RevokeChatLink(RevokeChatLinkRequest) returns (RevokeChatLinkResponse);
  // ListChatLinks lists the caller's own links, newest first.
  // permission: authenticated
  rpc ListChatLinks(ListChatLinksRequest) returns (ListChatLinksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetMyNotificationPreferences returns the caller's own preferences: how
  // approval notices reach them (at once or as a digest) and their quiet
  // hours (G0 M36 D1065).
  // permission: authenticated
  rpc GetMyNotificationPreferences(GetMyNotificationPreferencesRequest) returns (GetMyNotificationPreferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetMyNotificationPreferences sets them. A digest and quiet hours delay
  // only the caller's own emails, direct messages and pushes; routing and
  // escalation to other people are unchanged (HR-792). Audited.
  // permission: authenticated
  rpc SetMyNotificationPreferences(SetMyNotificationPreferencesRequest) returns (SetMyNotificationPreferencesResponse);
  // GetWebPushKey returns the deployment's VAPID public key, the
  // applicationServerKey a browser subscribes with (G0 M36 D1066).
  // permission: authenticated
  rpc GetWebPushKey(GetWebPushKeyRequest) returns (GetWebPushKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RegisterPushSubscription registers a browser push subscription of the
  // signed-in caller (Team edition). A push carries a title and a link
  // only (HR-793). Audited.
  // permission: authenticated
  rpc RegisterPushSubscription(RegisterPushSubscriptionRequest) returns (RegisterPushSubscriptionResponse);
  // RemovePushSubscription removes one of the caller's own subscriptions.
  // Audited.
  // permission: authenticated
  rpc RemovePushSubscription(RemovePushSubscriptionRequest) returns (RemovePushSubscriptionResponse);
  // ListMyPushSubscriptions lists the caller's own live subscriptions,
  // newest first.
  // permission: authenticated
  rpc ListMyPushSubscriptions(ListMyPushSubscriptionsRequest) returns (ListMyPushSubscriptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ChannelKind is where a channel delivers.
enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  // A structured server log event.
  CHANNEL_KIND_LOG = 1;
  // Email to every user holding a role at org scope.
  CHANNEL_KIND_EMAIL = 2;
  // A Slack incoming webhook: text and a link, never an action.
  CHANNEL_KIND_SLACK = 3;
  // An HTTPS endpoint, signed per Standard Webhooks.
  CHANNEL_KIND_WEBHOOK = 4;
  // A Slack bot posting approval cards to one channel and updating them in
  // place (G0 M14 D22, Team edition): minimal data and a link button only,
  // never a decision in Slack.
  CHANNEL_KIND_SLACK_APP = 5;
  // A Teams bot posting link-only Adaptive Cards to one standard channel (G0
  // M20 D256, Team edition), activated with a step-up; never a decision in
  // Teams.
  CHANNEL_KIND_TEAMS_APP = 6;
}

// SlackDataLevel is how much a Slack approval card shows (G0 M14 D23).
enum SlackDataLevel {
  SLACK_DATA_LEVEL_UNSPECIFIED = 0;
  // Request kind label, consequence level, expiry and a short request id.
  SLACK_DATA_LEVEL_MINIMAL = 1;
  // Adds the approval template's title, the agent's display name and the
  // environment.
  SLACK_DATA_LEVEL_SUMMARY = 2;
}

// SlackAppConfig is a slack_app channel's configuration (G0 M14 D22). The
// bot token is input only: it is stored encrypted and never returned.
message SlackAppConfig {
  // Slack channel id the cards are posted to.
  string channel_id = 1 [(buf.validate.field).string.pattern = "^[CG][A-Z0-9]{8,12}$"];
  // How much a card shows (default MINIMAL).
  SlackDataLevel data_level = 2 [(buf.validate.field).enum.defined_only = true];
  // The workspace id, from auth.test; read-only.
  string team_id = 3 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^(T[A-Z0-9]{4,30})?$"
  }];
  // The bot token (xoxb-...); input only, never returned.
  string bot_token = 4 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^(xoxb-[A-Za-z0-9-]{20,250})?$"
  }];
  // Whether the bot also sends approval direct messages to eligible
  // deciders who linked their Slack identity (G0 M20 D256). Set when the
  // channel is created and confirmed by its activation; it never changes,
  // and at most one channel of an organization has it.
  bool direct_messages = 5;
  // The email domains a person's Slack link may use: lowercase exact
  // domains, no wildcards, 1 to 20 for a DM channel and none otherwise (G0
  // M20 D265). Set when the channel is created; it never changes.
  repeated string allowed_email_domains = 6 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        max_len: 253
        pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?([.][a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$"
      }
    }
  }];
}

// NotificationSeverity orders notifications.
enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_WARNING = 2;
  NOTIFICATION_SEVERITY_CRITICAL = 3;
}

// ChannelState is whether a channel delivers.
enum ChannelState {
  CHANNEL_STATE_UNSPECIFIED = 0;
  CHANNEL_STATE_ACTIVE = 1;
  // Paused by a person, or automatically (its destination is gone, or it
  // failed for 72 hours); see pause_reason.
  CHANNEL_STATE_PAUSED = 2;
}

// ChannelHealth summarizes recent delivery results.
enum ChannelHealth {
  CHANNEL_HEALTH_UNSPECIFIED = 0;
  CHANNEL_HEALTH_HEALTHY = 1;
  // Some recent deliveries failed.
  CHANNEL_HEALTH_DEGRADED = 2;
  // 10 or more consecutive failures.
  CHANNEL_HEALTH_FAILING = 3;
}

// Channel is one notification channel.
message Channel {
  // Channel id.
  string id = 1;
  // Name.
  string name = 2;
  // Kind.
  ChannelKind kind = 3;
  // State.
  ChannelState state = 4;
  // Why it is paused (MANUAL, GONE, FAILING).
  string pause_reason = 5;
  // Subscribed event types (exact types or prefixes ending in ".*").
  repeated string event_types = 6;
  // Lowest severity delivered.
  NotificationSeverity min_severity = 7;
  // Email channels: the role whose holders receive it.
  string recipient_role = 8;
  // Webhook channels: the endpoint. Slack URLs are secrets and never shown.
  string url = 9;
  // Health.
  ChannelHealth health = 10;
  // Consecutive failed deliveries.
  int32 consecutive_failures = 11;
  // Last successful delivery.
  google.protobuf.Timestamp last_success_time = 12;
  // Last failed delivery and its code.
  google.protobuf.Timestamp last_failure_time = 13;
  // Last failure code (for example http_500, timeout, redirect_refused).
  string last_failure_code = 14;
  // Until when the previous signing secret still signs (after a rotation).
  google.protobuf.Timestamp previous_secret_expire_time = 15;
  // Creation time.
  google.protobuf.Timestamp create_time = 16;
  // Last change.
  google.protobuf.Timestamp update_time = 17;
  // slack_app channels: the configuration, without the bot token.
  SlackAppConfig slack_app = 18;
  // Webhook channels: "hmac" (the default) or "hmac+ed25519".
  string signature_scheme = 19;
}

// DeliveryState is the state of one delivery.
enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_PENDING = 1;
  DELIVERY_STATE_DELIVERED = 2;
  // All attempts failed, or the destination is gone.
  DELIVERY_STATE_FAILED = 3;
  // The notification expired first.
  DELIVERY_STATE_EXPIRED = 4;
  // Not sent: the channel was paused or email is not configured.
  DELIVERY_STATE_SKIPPED = 5;
  // Not sent: the channel's queue was full.
  DELIVERY_STATE_DROPPED = 6;
  // Not sent: the channel was deleted.
  DELIVERY_STATE_CANCELED = 7;
}

// Delivery is one delivery of a notification.
message Delivery {
  // Delivery id.
  string id = 1;
  // Notification id.
  string notification_id = 2;
  // Notification type (for example security.credential_registered).
  string notification_type = 3;
  // Channel id (empty for a personal email).
  string channel_id = 4;
  // Recipient user (email deliveries).
  string recipient_user_id = 5;
  // Kind.
  ChannelKind kind = 6;
  // State.
  DeliveryState state = 7;
  // Attempts made (at most 8).
  int32 attempts = 8;
  // Last HTTP status, if any.
  int32 last_status = 9;
  // Last error code.
  string last_error = 10;
  // Creation time.
  google.protobuf.Timestamp create_time = 11;
  // Next attempt (pending deliveries).
  google.protobuf.Timestamp next_attempt_time = 12;
  // End time.
  google.protobuf.Timestamp finish_time = 13;
}

// CreateChannelRequest describes a new channel.
message CreateChannelRequest {
  // Name: lowercase letters, digits and hyphens.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  // Kind.
  ChannelKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Event types to deliver: exact types or prefixes ending in ".*".
  repeated string event_types = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
    items: {
      string: {
        max_len: 64
        pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){0,3}(\\.\\*)?$"
      }
    }
  }];
  // Lowest severity delivered (default INFO).
  NotificationSeverity min_severity = 4 [(buf.validate.field).enum.defined_only = true];
  // Email channels: the role whose holders receive it.
  string recipient_role = 5 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[a-z_]*$"
  }];
  // Webhook channels: the https endpoint. Slack channels: the incoming
  // webhook URL (https://hooks.slack.com/services/...), stored encrypted.
  string url = 6 [(buf.validate.field).string.max_len = 2048];
  // slack_app channels: the configuration, with the bot token. Required
  // for, and only for, a slack_app channel.
  SlackAppConfig slack_app = 7;
  // teams_app channels: the configuration, with the bot's client secret
  // (G0 M20 D256). Required for, and only for, a teams_app channel.
  TeamsAppConfig teams_app = 8;
}

// CreateChannelResponse returns the channel and, for a webhook channel, the
// signing secret (shown once; "whsec_..." per Standard Webhooks).
message CreateChannelResponse {
  // The channel.
  Channel channel = 1;
  // Webhook signing secret, shown once.
  string signing_secret = 2;
}

// GetChannelRequest names a channel.
message GetChannelRequest {
  // Channel id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetChannelResponse returns the channel and its recent deliveries.
message GetChannelResponse {
  // The channel.
  Channel channel = 1;
  // Its last 20 deliveries, newest first.
  repeated Delivery recent_deliveries = 2;
}

// ListChannelsRequest pages through channels.
message ListChannelsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListChannelsResponse is one page of channels.
message ListChannelsResponse {
  // Channels.
  repeated Channel channels = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// UpdateChannelRequest changes the fields that are set.
message UpdateChannelRequest {
  // Channel id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New name.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  // New subscription (replaces the old one when not empty).
  repeated string event_types = 3 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        max_len: 64
        pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){0,3}(\\.\\*)?$"
      }
    }
  }];
  // New lowest severity.
  optional NotificationSeverity min_severity = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Pause (true) or resume (false). Resuming clears the failure count.
  optional bool paused = 5;
  // slack_app channels: a new bot token, input only; puts the channel back
  // to PENDING_ACTIVATION.
  optional string slack_bot_token = 6 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^xoxb-[A-Za-z0-9-]{20,250}$"
  }];
}

// UpdateChannelResponse returns the channel.
message UpdateChannelResponse {
  // The channel.
  Channel channel = 1;
}

// DeleteChannelRequest names a channel.
message DeleteChannelRequest {
  // Channel id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteChannelResponse is empty.
message DeleteChannelResponse {}

// RotateChannelSecretRequest names a webhook channel.
message RotateChannelSecretRequest {
  // Channel id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RotateChannelSecretResponse returns the new secret once.
message RotateChannelSecretResponse {
  // New signing secret, shown once.
  string signing_secret = 1;
  // Until when the previous secret also signs.
  google.protobuf.Timestamp previous_secret_expire_time = 2;
}

// TestChannelRequest names a channel.
message TestChannelRequest {
  // Channel id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// TestChannelResponse names the test notification.
message TestChannelResponse {
  // Notification id; watch its delivery with ListDeliveries.
  string notification_id = 1;
}

// ListDeliveriesRequest pages through deliveries.
message ListDeliveriesRequest {
  // Only this channel's deliveries.
  string channel_id = 1 [(buf.validate.field).string = {
    max_len: 36
    pattern: "^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$"
  }];
  // Only deliveries in this state.
  DeliveryState state = 2 [(buf.validate.field).enum.defined_only = true];
  // Maximum results (default 50, at most 200).
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 4 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListDeliveriesResponse is one page of deliveries.
message ListDeliveriesResponse {
  // Deliveries, newest first.
  repeated Delivery deliveries = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// SetChannelSignatureSchemeRequest names a webhook channel and its scheme.
message SetChannelSignatureSchemeRequest {
  // Channel id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // "hmac" or "hmac+ed25519".
  string signature_scheme = 2 [(buf.validate.field).string = {
    in: [
      "hmac",
      "hmac+ed25519"
    ]
  }];
}

// SetChannelSignatureSchemeResponse is the channel and where receivers fetch the
// org's webhook keys.
message SetChannelSignatureSchemeResponse {
  // The channel.
  Channel channel = 1;
  // The org's webhook JWKS: its ACTIVE and RETIRING webhooks keys.
  string jwks_url = 2;
}

// ChatLinkState is a chat identity link's state (G0 M20 D256, D265).
enum ChatLinkState {
  CHAT_LINK_STATE_UNSPECIFIED = 0;
  // Looked up in Slack, waiting for the person to confirm it.
  CHAT_LINK_STATE_PROPOSED = 1;
  // Confirmed by the person: approval DMs reach them.
  CHAT_LINK_STATE_CONFIRMED = 2;
  // Slack no longer answered the email with this member before a DM.
  CHAT_LINK_STATE_STALE = 3;
  CHAT_LINK_STATE_REVOKED = 4;
}

// ChatLink is a person's Slack identity link.
message ChatLink {
  string id = 1;
  // Always "slack".
  string provider = 2;
  // The Slack workspace and user ids.
  string team_id = 3;
  string external_user_id = 4;
  // The email Slack matched.
  string email = 5;
  ChatLinkState state = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp confirm_time = 8;
}

message ProposeSlackLinkRequest {}

message ProposeSlackLinkResponse {
  ChatLink link = 1;
}

message ConfirmChatLinkRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ConfirmChatLinkResponse {
  ChatLink link = 1;
}

message RevokeChatLinkRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RevokeChatLinkResponse {
  ChatLink link = 1;
}

message ListChatLinksRequest {}

message ListChatLinksResponse {
  repeated ChatLink links = 1;
}

// TeamsAppConfig is a teams_app channel's configuration (G0 M20 D256).
message TeamsAppConfig {
  // The Entra tenant the bot is installed in.
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  // The team's General channel id and the channel the cards go to.
  string team_id = 2 [(buf.validate.field).string.pattern = "^19:[A-Za-z0-9_-]{1,128}@thread[.](tacv2|skype)$"];
  string channel_id = 3 [(buf.validate.field).string.pattern = "^19:[A-Za-z0-9_-]{1,128}@thread[.](tacv2|skype)$"];
  // The bot's Microsoft App ID.
  string app_id = 4 [(buf.validate.field).string.uuid = true];
  // The bot's client secret; input only, never returned.
  string client_secret = 5 [(buf.validate.field).string = {
    min_len: 16
    max_len: 512
  }];
  // The Bot Framework service URL (https).
  string service_url = 6 [(buf.validate.field).string = {
    max_len: 512
    prefix: "https://"
  }];
}

// ApprovalDelivery is how approval notices reach a person.
enum ApprovalDelivery {
  APPROVAL_DELIVERY_UNSPECIFIED = 0;
  // Each notice when it is sent (the default).
  APPROVAL_DELIVERY_IMMEDIATE = 1;
  // One "N approvals are waiting for you" notice per digest window.
  APPROVAL_DELIVERY_DIGEST = 2;
}

// NotificationPreferences are one person's preferences (G0 M36 D1065).
message NotificationPreferences {
  ApprovalDelivery approval_delivery = 1;
  // The digest window in minutes: 15, 30 or 60.
  int32 digest_minutes = 2;
  // Quiet hours as HH:MM, both set or both empty; the end may be before
  // the start (overnight).
  string quiet_start = 3;
  string quiet_end = 4;
  // The IANA time zone of the quiet hours and of night-time measures; UTC
  // when empty.
  string time_zone = 5;
  google.protobuf.Timestamp update_time = 6;
}

message GetMyNotificationPreferencesRequest {}

message GetMyNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message SetMyNotificationPreferencesRequest {
  ApprovalDelivery approval_delivery = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int32 digest_minutes = 2 [(buf.validate.field).int32 = {
    in: [
      0,
      15,
      30,
      60
    ]
  }];
  string quiet_start = 3 [(buf.validate.field).string.pattern = "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"];
  string quiet_end = 4 [(buf.validate.field).string.pattern = "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"];
  string time_zone = 5 [(buf.validate.field).string.max_len = 64];
}

message SetMyNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message GetWebPushKeyRequest {}

message GetWebPushKeyResponse {
  // The uncompressed P-256 public key, base64url without padding.
  string application_server_key = 1;
}

// PushSubscription is a person's browser push subscription; its keys are
// never returned.
message PushSubscription {
  string id = 1;
  // The push service host the endpoint is on.
  string endpoint_host = 2;
  string label = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp last_success_time = 5;
  int32 failure_count = 6;
}

message RegisterPushSubscriptionRequest {
  // The subscription's endpoint: https on fcm.googleapis.com,
  // updates.push.services.mozilla.com, notify.windows.com or
  // web.push.apple.com (or a subdomain).
  string endpoint = 1 [(buf.validate.field).string = {
    min_len: 9
    max_len: 2048
    prefix: "https://"
  }];
  // keys.p256dh and keys.auth of the subscription, base64url.
  string p256dh = 2 [(buf.validate.field).string = {
    min_len: 80
    max_len: 100
  }];
  string auth = 3 [(buf.validate.field).string = {
    min_len: 16
    max_len: 32
  }];
  // A name for the browser or device.
  string label = 4 [(buf.validate.field).string.max_len = 64];
}

message RegisterPushSubscriptionResponse {
  PushSubscription subscription = 1;
}

message RemovePushSubscriptionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RemovePushSubscriptionResponse {}

message ListMyPushSubscriptionsRequest {}

message ListMyPushSubscriptionsResponse {
  repeated PushSubscription subscriptions = 1;
}
