syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/identity_providers.proto";

// IntelService is shared threat-intel indicators (G0 M38 D1103..D1105; FD13,
// FQ38-2; HR-817..822).
//
// The deployment imports a feed signed offline by the PantherClaw intel
// root: hashes of known-bad MCP servers and tool descriptions, and hashed
// shingles of injection text. Only hashes enter or leave. An org that
// consumes the feed (Business and above; OFF by default) has a call to a
// matched server or tool, or a payload carrying matched injection text,
// held for a person (HOLD) or only alerted on (ALERT_ONLY). A match never
// refuses. An org with share on (every edition; off by default) may
// contribute indicators made from its confirmed findings; the operator's
// export of them carries no org identity.
service IntelService {
  // GetIntelSettings returns the org's consume mode and share switch, and
  // the deployment's current feed.
  // permission: intel.read
  rpc GetIntelSettings(GetIntelSettingsRequest) returns (GetIntelSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetIntelSettings sets the consume mode and the share switch.
  // Consuming needs the Business edition or above. Audited
  // (intel.settings_changed).
  // permission: intel.manage
  rpc SetIntelSettings(SetIntelSettingsRequest) returns (SetIntelSettingsResponse);
  // ListIntelMatches lists the org's indicator matches, newest first.
  // permission: intel.read
  rpc ListIntelMatches(ListIntelMatchesRequest) returns (ListIntelMatchesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ContributeIndicator makes an indicator from a confirmed finding and
  // queues it (a person, with share on). Only its hash or shingles are kept,
  // computed here. Audited (intel.contributed).
  // permission: intel.contribute
  rpc ContributeIndicator(ContributeIndicatorRequest) returns (ContributeIndicatorResponse);
  // ListIntelContributions lists the org's contributions, newest first.
  // permission: intel.read
  rpc ListIntelContributions(ListIntelContributionsRequest) returns (ListIntelContributionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ExportIntelSTIX returns the current indicators as a STIX 2.1 bundle of
  // indicator objects.
  // permission: intel.read
  rpc ExportIntelSTIX(ExportIntelSTIXRequest) returns (ExportIntelSTIXResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// IntelConsumeMode is what an org does with a match.
enum IntelConsumeMode {
  INTEL_CONSUME_MODE_UNSPECIFIED = 0;
  // Nothing is matched.
  INTEL_CONSUME_MODE_OFF = 1;
  // A matched call waits for a person, and an alert is raised.
  INTEL_CONSUME_MODE_HOLD = 2;
  // A match only raises an alert.
  INTEL_CONSUME_MODE_ALERT_ONLY = 3;
}

// IntelIndicatorKind is what an indicator is a hash of.
enum IntelIndicatorKind {
  INTEL_INDICATOR_KIND_UNSPECIFIED = 0;
  // sha256 of lower(name)@version from serverInfo, of package_ref@version,
  // or of an image digest.
  INTEL_INDICATOR_KIND_MCP_SERVER = 1;
  // sha256 of the normalized tool description.
  INTEL_INDICATOR_KIND_TOOL_DESCRIPTION = 2;
  // sha256 of normalized 8-word shingles of injection text.
  INTEL_INDICATOR_KIND_INJECTION_TEXT = 3;
}

// IntelFeed is the feed the deployment accepted last.
message IntelFeed {
  uint64 version = 1;
  string kid = 2;
  google.protobuf.Timestamp issue_time = 3;
  google.protobuf.Timestamp expire_time = 4;
  int32 indicators = 5;
}

// IntelSettings are an org's choices.
message IntelSettings {
  IntelConsumeMode consume = 1;
  bool share = 2;
  string updated_by = 3;
  google.protobuf.Timestamp update_time = 4;
}

// GetIntelSettingsRequest asks for the settings.
message GetIntelSettingsRequest {}

// GetIntelSettingsResponse holds the settings and the current feed; feed is
// unset while none was accepted.
message GetIntelSettingsResponse {
  IntelSettings settings = 1;
  IntelFeed feed = 2;
  // Whether the edition allows consuming.
  bool consume_available = 3;
}

// SetIntelSettingsRequest sets both choices.
message SetIntelSettingsRequest {
  IntelConsumeMode consume = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool share = 2;
}

// SetIntelSettingsResponse holds the settings as they now stand. A
// loosening of the consume mode (HOLD to ALERT_ONLY, or either to OFF) is
// filed for a second person (D1104a): change names it and settings keep
// the old mode until it is confirmed. A tightening applies at once.
message SetIntelSettingsResponse {
  IntelSettings settings = 1;
  ProtectedChangeFiled change = 2;
}

// IntelMatch is one indicator an org's object matched.
message IntelMatch {
  string id = 1;
  string indicator_id = 2;
  IntelIndicatorKind kind = 3;
  // connection, inventory_item, run or transaction.
  string object_type = 4;
  string object_ref = 5;
  string connection_id = 6;
  string tool = 7;
  // The consume mode at the time.
  IntelConsumeMode mode = 8;
  google.protobuf.Timestamp match_time = 9;
}

// ListIntelMatchesRequest pages the matches.
message ListIntelMatchesRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The last id of the previous page.
  string page_token = 2 [(buf.validate.field).string.max_len = 64];
}

// ListIntelMatchesResponse is one page.
message ListIntelMatchesResponse {
  repeated IntelMatch matches = 1;
  string next_page_token = 2;
}

// IntelContributionSource names the confirmed finding an indicator is made
// from.
enum IntelContributionSource {
  INTEL_CONTRIBUTION_SOURCE_UNSPECIFIED = 0;
  // A connection whose pinned package version is QUARANTINED: its upstream
  // server's reported name and version (mcp_server).
  INTEL_CONTRIBUTION_SOURCE_QUARANTINED_SERVER = 1;
  // A package version that is QUARANTINED: package@version (mcp_server).
  INTEL_CONTRIBUTION_SOURCE_QUARANTINED_PACKAGE = 2;
  // A tool of a connection whose pinned package version is QUARANTINED: its
  // listed description (tool_description).
  INTEL_CONTRIBUTION_SOURCE_QUARANTINED_TOOL = 3;
  // An inventory item whose description the injection scan flagged: its
  // description's shingles (injection_text).
  INTEL_CONTRIBUTION_SOURCE_FLAGGED_DESCRIPTION = 4;
}

// ContributeIndicatorRequest names the finding.
message ContributeIndicatorRequest {
  IntelContributionSource source = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The connection id (QUARANTINED_SERVER), the package version id
  // (QUARANTINED_PACKAGE) or the inventory item id (QUARANTINED_TOOL,
  // FLAGGED_DESCRIPTION).
  string source_id = 2 [(buf.validate.field).string.uuid = true];
  // LOW, MEDIUM or HIGH.
  string severity = 3 [(buf.validate.field).string = {
    in: [
      "LOW",
      "MEDIUM",
      "HIGH"
    ]
  }];
  // MITRE ATT&CK or ATLAS technique ids.
  repeated string techniques = 4 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {pattern: "^(T[0-9]{4}(\\.[0-9]{3})?|AML\\.T[0-9]{4}(\\.[0-9]{3})?)$"}
    }
  }];
}

// IntelContribution is one contributed indicator, hashes only.
message IntelContribution {
  string id = 1;
  IntelIndicatorKind kind = 2;
  string sha256 = 3;
  repeated string shingles = 4;
  string severity = 5;
  repeated string techniques = 6;
  // YYYY-MM-DD.
  string created_day = 7;
  // QUEUED or EXPORTED.
  string state = 8;
}

// ContributeIndicatorResponse holds the queued contribution.
message ContributeIndicatorResponse {
  IntelContribution contribution = 1;
}

// ListIntelContributionsRequest asks for the contributions.
message ListIntelContributionsRequest {}

// ListIntelContributionsResponse lists them, newest first (at most 500).
message ListIntelContributionsResponse {
  repeated IntelContribution contributions = 1;
}

// ExportIntelSTIXRequest asks for the bundle.
message ExportIntelSTIXRequest {}

// ExportIntelSTIXResponse is a STIX 2.1 bundle (application/stix+json).
message ExportIntelSTIXResponse {
  bytes bundle = 1;
}
