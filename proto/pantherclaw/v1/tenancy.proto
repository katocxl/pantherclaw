syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// TenancyService manages the organization hierarchy (F573): the org,
// business units (Business edition), teams and their members, and
// environments. The org always comes from the caller's credential; ids of
// other orgs are reported as not found. Each call also checks the permission
// at the scope of the resource (a binding applies to its scope and below).
service TenancyService {
  // GetOrg returns the caller's organization.
  // permission: org.read
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateOrg renames the organization.
  // permission: org.update
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);
  // CreateOrg creates an organization for the signed-in account (hosted
  // self-serve, D8): only from an account browser session with a verified
  // email while self-serve sign-up is on (else SIGNUP_DISABLED), within the
  // per-account limits (ACCOUNT_ORG_LIMIT) and rate limits. The account
  // becomes the org's first user with Org Admin, the accepted terms and DPA
  // versions are recorded, and the session is rotated into the new org.
  // permission: orgs.create
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  // ListMyOrgs lists the organizations the signed-in account is an active
  // member of, through the audited cross-org lister (HR-349).
  // permission: orgs.list_mine
  rpc ListMyOrgs(ListMyOrgsRequest) returns (ListMyOrgsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateBusinessUnit creates a business unit (Business edition).
  // permission: business_unit.manage
  rpc CreateBusinessUnit(CreateBusinessUnitRequest) returns (CreateBusinessUnitResponse);
  // GetBusinessUnit returns one business unit.
  // permission: business_unit.read
  rpc GetBusinessUnit(GetBusinessUnitRequest) returns (GetBusinessUnitResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListBusinessUnits lists the business units the caller may read.
  // permission: business_unit.read
  rpc ListBusinessUnits(ListBusinessUnitsRequest) returns (ListBusinessUnitsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateBusinessUnit changes a business unit's name or description.
  // permission: business_unit.manage
  rpc UpdateBusinessUnit(UpdateBusinessUnitRequest) returns (UpdateBusinessUnitResponse);
  // ArchiveBusinessUnit archives an empty business unit.
  // permission: business_unit.manage
  rpc ArchiveBusinessUnit(ArchiveBusinessUnitRequest) returns (ArchiveBusinessUnitResponse);

  // CreateTeam creates a team under the org or a business unit.
  // permission: team.manage
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  // GetTeam returns one team.
  // permission: team.read
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListTeams lists the teams the caller may read.
  // permission: team.read
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateTeam changes a team's name or description.
  // permission: team.manage
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
  // ArchiveTeam archives a team without active environments.
  // permission: team.manage
  rpc ArchiveTeam(ArchiveTeamRequest) returns (ArchiveTeamResponse);
  // AddTeamMember adds a user to a team.
  // permission: team.members.manage
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse);
  // RemoveTeamMember removes a user from a team.
  // permission: team.members.manage
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse);
  // ListTeamMembers lists a team's members.
  // permission: team.read
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateEnvironment creates an environment under the org or a team.
  // permission: environment.manage
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  // GetEnvironment returns one environment.
  // permission: environment.read
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListEnvironments lists the environments the caller may read.
  // permission: environment.read
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateEnvironment changes an environment's name or description.
  // permission: environment.manage
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (UpdateEnvironmentResponse);
  // ArchiveEnvironment archives an environment.
  // permission: environment.manage
  rpc ArchiveEnvironment(ArchiveEnvironmentRequest) returns (ArchiveEnvironmentResponse);
}

// EntityState is the lifecycle state of hierarchy entities.
enum EntityState {
  ENTITY_STATE_UNSPECIFIED = 0;
  ENTITY_STATE_ACTIVE = 1;
  // Archived entities are kept for history; nothing new can be attached.
  ENTITY_STATE_ARCHIVED = 2;
}

// EnvironmentKind classifies an environment (F578).
enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_DEVELOPMENT = 1;
  ENVIRONMENT_KIND_STAGING = 2;
  ENVIRONMENT_KIND_PRODUCTION = 3;
}

// Org is an organization (tenant).
message Org {
  // Org id.
  string id = 1;
  // Display name.
  string name = 2;
  // Creation time.
  google.protobuf.Timestamp create_time = 3;
}

// BusinessUnit groups teams (Business edition).
message BusinessUnit {
  // Business unit id.
  string id = 1;
  // Unique, immutable identifier within the org.
  string slug = 2;
  // Display name.
  string name = 3;
  // Free-text description.
  string description = 4;
  // Lifecycle state.
  EntityState state = 5;
  // Creation time.
  google.protobuf.Timestamp create_time = 6;
  // Last change.
  google.protobuf.Timestamp update_time = 7;
}

// Team is a team directly under the org or under a business unit.
message Team {
  // Team id.
  string id = 1;
  // Parent business unit; empty when the team is directly under the org.
  string business_unit_id = 2;
  // Unique, immutable identifier within the org.
  string slug = 3;
  // Display name.
  string name = 4;
  // Free-text description.
  string description = 5;
  // Lifecycle state.
  EntityState state = 6;
  // Creation time.
  google.protobuf.Timestamp create_time = 7;
  // Last change.
  google.protobuf.Timestamp update_time = 8;
}

// Environment is a development, staging or production environment of the
// org or of one team.
message Environment {
  // Environment id.
  string id = 1;
  // Owning team; empty for an org-level environment.
  string team_id = 2;
  // Identifier, unique under its parent and immutable.
  string slug = 3;
  // Display name.
  string name = 4;
  // Free-text description.
  string description = 5;
  // Kind.
  EnvironmentKind kind = 6;
  // Lifecycle state.
  EntityState state = 7;
  // Creation time.
  google.protobuf.Timestamp create_time = 8;
  // Last change.
  google.protobuf.Timestamp update_time = 9;
}

// TeamMember is a user's membership of a team.
message TeamMember {
  // Member's user id.
  string user_id = 1;
  // Member's email.
  string email = 2;
  // Member's display name.
  string display_name = 3;
  // When the user was added.
  google.protobuf.Timestamp create_time = 4;
}

// GetOrgRequest asks for the caller's org.
message GetOrgRequest {}

// GetOrgResponse returns the org.
message GetOrgResponse {
  // The org.
  Org org = 1;
}

// UpdateOrgRequest renames the org.
message UpdateOrgRequest {
  // New display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// UpdateOrgResponse returns the updated org.
message UpdateOrgResponse {
  // The org.
  Org org = 1;
}

// CreateOrgRequest creates an organization.
message CreateOrgRequest {
  // Display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Short label: lowercase letters, digits and hyphens. It is shown, never
  // looked up, and need not be unique across organizations (no existence
  // oracle, T-164).
  string slug = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"];
  // Version of the terms of service the person accepted.
  string terms_version = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"];
  // Version of the data processing agreement the person accepted.
  string dpa_version = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"];
}

// CreateOrgResponse returns the new organization.
message CreateOrgResponse {
  // The org.
  Org org = 1;
}

// ListMyOrgsRequest asks for the account's organizations.
message ListMyOrgsRequest {}

// OrgSummary is one organization the account belongs to.
message OrgSummary {
  // Org id.
  string org_id = 1;
  // Display name.
  string name = 2;
  // Short label.
  string slug = 3;
}

// ListMyOrgsResponse lists the account's organizations by name.
message ListMyOrgsResponse {
  // The organizations.
  repeated OrgSummary orgs = 1;
}

// CreateBusinessUnitRequest creates a business unit.
message CreateBusinessUnitRequest {
  // Identifier: lowercase letters, digits and hyphens.
  string slug = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"];
  // Display name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Optional description.
  string description = 3 [(buf.validate.field).string.max_len = 1000];
}

// CreateBusinessUnitResponse returns the new business unit.
message CreateBusinessUnitResponse {
  // The business unit.
  BusinessUnit business_unit = 1;
}

// GetBusinessUnitRequest names a business unit.
message GetBusinessUnitRequest {
  // Business unit id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetBusinessUnitResponse returns it.
message GetBusinessUnitResponse {
  // The business unit.
  BusinessUnit business_unit = 1;
}

// ListBusinessUnitsRequest pages through business units.
message ListBusinessUnitsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Include archived business units.
  bool include_archived = 3;
}

// ListBusinessUnitsResponse is one page.
message ListBusinessUnitsResponse {
  // Business units, oldest first.
  repeated BusinessUnit business_units = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// UpdateBusinessUnitRequest changes the fields that are set.
message UpdateBusinessUnitRequest {
  // Business unit id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New display name.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // New description.
  optional string description = 3 [(buf.validate.field).string.max_len = 1000];
}

// UpdateBusinessUnitResponse returns the result.
message UpdateBusinessUnitResponse {
  // The business unit.
  BusinessUnit business_unit = 1;
}

// ArchiveBusinessUnitRequest archives a business unit.
message ArchiveBusinessUnitRequest {
  // Business unit id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ArchiveBusinessUnitResponse returns the archived business unit.
message ArchiveBusinessUnitResponse {
  // The business unit.
  BusinessUnit business_unit = 1;
}

// CreateTeamRequest creates a team.
message CreateTeamRequest {
  // Parent business unit; empty for a team directly under the org.
  string business_unit_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Identifier, unique in the org.
  string slug = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"];
  // Display name.
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Optional description.
  string description = 4 [(buf.validate.field).string.max_len = 1000];
}

// CreateTeamResponse returns the new team.
message CreateTeamResponse {
  // The team.
  Team team = 1;
}

// GetTeamRequest names a team.
message GetTeamRequest {
  // Team id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetTeamResponse returns it.
message GetTeamResponse {
  // The team.
  Team team = 1;
}

// ListTeamsRequest pages through teams.
message ListTeamsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only teams of this business unit.
  string business_unit_id = 3 [
    (buf.validate.field).string = {
      uuid: true
      // Server ids are UUIDv7; other versions are refused.
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Include archived teams.
  bool include_archived = 4;
}

// ListTeamsResponse is one page.
message ListTeamsResponse {
  // Teams, oldest first.
  repeated Team teams = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// UpdateTeamRequest changes the fields that are set.
message UpdateTeamRequest {
  // Team id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New display name.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // New description.
  optional string description = 3 [(buf.validate.field).string.max_len = 1000];
}

// UpdateTeamResponse returns the result.
message UpdateTeamResponse {
  // The team.
  Team team = 1;
}

// ArchiveTeamRequest archives a team.
message ArchiveTeamRequest {
  // Team id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ArchiveTeamResponse returns the archived team.
message ArchiveTeamResponse {
  // The team.
  Team team = 1;
}

// AddTeamMemberRequest adds a user to a team.
message AddTeamMemberRequest {
  // Team id.
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  // User id.
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

// AddTeamMemberResponse returns the membership.
message AddTeamMemberResponse {
  // The membership.
  TeamMember member = 1;
}

// RemoveTeamMemberRequest removes a user from a team.
message RemoveTeamMemberRequest {
  // Team id.
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  // User id.
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

// RemoveTeamMemberResponse confirms the removal.
message RemoveTeamMemberResponse {}

// ListTeamMembersRequest pages through a team's members.
message ListTeamMembersRequest {
  // Team id.
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  // Maximum results (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 3 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListTeamMembersResponse is one page.
message ListTeamMembersResponse {
  // Members, in the order they were added.
  repeated TeamMember members = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// CreateEnvironmentRequest creates an environment.
message CreateEnvironmentRequest {
  // Owning team; empty for an org-level environment.
  string team_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Identifier, unique under its parent.
  string slug = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"];
  // Display name.
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Optional description.
  string description = 4 [(buf.validate.field).string.max_len = 1000];
  // Kind; UNSPECIFIED is rejected.
  EnvironmentKind kind = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// CreateEnvironmentResponse returns the new environment.
message CreateEnvironmentResponse {
  // The environment.
  Environment environment = 1;
}

// GetEnvironmentRequest names an environment.
message GetEnvironmentRequest {
  // Environment id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetEnvironmentResponse returns it.
message GetEnvironmentResponse {
  // The environment.
  Environment environment = 1;
}

// ListEnvironmentsRequest pages through environments.
message ListEnvironmentsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only environments of this team.
  string team_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Include archived environments.
  bool include_archived = 4;
}

// ListEnvironmentsResponse is one page.
message ListEnvironmentsResponse {
  // Environments, oldest first.
  repeated Environment environments = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// UpdateEnvironmentRequest changes the fields that are set.
message UpdateEnvironmentRequest {
  // Environment id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New display name.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // New description.
  optional string description = 3 [(buf.validate.field).string.max_len = 1000];
}

// UpdateEnvironmentResponse returns the result.
message UpdateEnvironmentResponse {
  // The environment.
  Environment environment = 1;
}

// ArchiveEnvironmentRequest archives an environment.
message ArchiveEnvironmentRequest {
  // Environment id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ArchiveEnvironmentResponse returns the archived environment.
message ArchiveEnvironmentResponse {
  // The environment.
  Environment environment = 1;
}
