syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// CoverageService answers the question coverage exists for: can this agent
// produce this effect through another usable route without authorization
// (G0 M9 track A; F433–F460, F021, PN-008.2; HR-210, HR-211, HR-212)?
//
// A coverage record is scoped to one agent, connection and operation. Its
// state is UNKNOWN, OBSERVE_ONLY, PARTIAL or ENFORCED, computed only from
// evidence: observed traffic, the route inventory and sandbox closure
// evidence. A setting alone never yields a state (F460). Cooperative
// channels (SDK, hook, AuthZEN) are capped at PARTIAL unless the target verifies
// action tokens (HR-024), and routes through opaque MCP servers unless
// their egress is mediated (HR-086). ENFORCED expires (24 hours by
// default) and every invalidating change drops it at once; a record read
// after that is recomputed from current evidence, reads at most PARTIAL and
// keeps the last valid record (HR-211, F442).
//
// Closure evidence is never written through this service: the sandbox
// records it after verifying the signed probe results (HR-215).
// Exclusions are weakening changes that only a person holding
// coverage.manage makes, with a written reason and an expiry (HR-212).
// Reads follow the caller's coverage.read scope over the agent.
service CoverageService {
  // GetCoverage returns one scope's record as it reads now.
  // permission: coverage.read
  rpc GetCoverage(GetCoverageRequest) returns (GetCoverageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListCoverage lists the current record of every scope, by scope.
  // permission: coverage.read
  rpc ListCoverage(ListCoverageRequest) returns (ListCoverageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListRoutes lists the route inventory. A route kind without an
  // entry is not observed, never absent (F450).
  // permission: coverage.read
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetClosure returns one closure evidence record (F457).
  // permission: coverage.read
  rpc GetClosure(GetClosureRequest) returns (GetClosureResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListClosures lists closure evidence, newest first.
  // permission: coverage.read
  rpc ListClosures(ListClosuresRequest) returns (ListClosuresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetFreshnessContract publishes when evidence stops supporting a claim
  // and what invalidates it (F440).
  // permission: coverage.read
  rpc GetFreshnessContract(GetFreshnessContractRequest) returns (GetFreshnessContractResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetSnapshot returns one recorded coverage snapshot: the scope's
  // computed record and the ledger entry it is bound to (HR-217).
  // permission: coverage.read
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListSnapshots lists a scope's recorded snapshots, newest first: its
  // coverage history.
  // permission: coverage.read
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Reassess recomputes the scopes of one connection now, from evidence,
  // and records a snapshot for each that changed.
  // permission: coverage.reassess
  rpc Reassess(ReassessRequest) returns (ReassessResponse);
  // CreateExclusion records, until it expires, that a person accepts a scope
  // or a route kind as outside the boundary (HR-212). It never raises a
  // state: an excluded route still counts as open (design decision 1). Only
  // a person makes one, with a written reason; it is audited, notified to
  // org admins and listed with every claim on the scope.
  // permission: coverage.manage
  rpc CreateExclusion(CreateExclusionRequest) returns (CreateExclusionResponse);
  // RevokeExclusion ends an active exclusion at once.
  // permission: coverage.manage
  rpc RevokeExclusion(RevokeExclusionRequest) returns (RevokeExclusionResponse);
  // ListExclusions lists exclusions, newest first.
  // permission: coverage.read
  rpc ListExclusions(ListExclusionsRequest) returns (ListExclusionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetAccessDetail says where an agent gets usable authority at a
  // connection's target and what limits it (§39.2–39.3): the custodian and
  // modes, the scope and audience, the expiry, the issuance source, the
  // affected agents, the verification basis, the routes still open, and
  // what each mode must disclose. It never shows a secret.
  // permission: coverage.read
  rpc GetAccessDetail(GetAccessDetailRequest) returns (GetAccessDetailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListFindings lists exposure findings, starting with credential
  // overreach (F048): reach a credential holds beyond what the operations
  // need, shown as exposure, never as extra permission.
  // permission: coverage.read
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AcknowledgeFinding acknowledges an open finding with a written reason,
  // which dismisses it; it is audited, and the finding stays dismissed
  // when seen again with the same excess.
  // permission: coverage.manage
  rpc AcknowledgeFinding(AcknowledgeFindingRequest) returns (AcknowledgeFindingResponse);
  // GetCoverageGraph returns an agent's coverage as a graph (F277; Team
  // edition and above): the agent, its scopes, each scope's routes and
  // where they go, with each route marked TESTED, POSSIBLE, EXCLUDED or
  // UNVERIFIED. It is built only from the records the caller may read,
  // filtered before any node is built (HR-402); unknown is UNVERIFIED,
  // never controlled.
  // permission: coverage.read
  rpc GetCoverageGraph(GetCoverageGraphRequest) returns (GetCoverageGraphResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// CoverageState is the protection claim of one scope (F435–F438).
enum CoverageState {
  COVERAGE_STATE_UNSPECIFIED = 0;
  // Evidence cannot establish which routes are usable or controlled.
  COVERAGE_STATE_UNKNOWN = 1;
  // Activity is visible; prevention is not established.
  COVERAGE_STATE_OBSERVE_ONLY = 2;
  // A route is controlled, but an equivalent route is possible,
  // unverified or excluded.
  COVERAGE_STATE_PARTIAL = 3;
  // Every material route is mediated or proven blocked, until it expires.
  COVERAGE_STATE_ENFORCED = 4;
}

// CoverageRouteKind is a way to produce a connection's effects (§41.4).
enum CoverageRouteKind {
  COVERAGE_ROUTE_KIND_UNSPECIFIED = 0;
  // A PantherClaw channel: HTTP or MCP through the gateway, the SDK face or
  // the hook.
  COVERAGE_ROUTE_KIND_CHANNEL = 1;
  // The target's API or SDK, outside the gateway (F444).
  COVERAGE_ROUTE_KIND_DIRECT_API = 2;
  // Shell, command-line tools, filesystem, wrappers, the host (F445).
  COVERAGE_ROUTE_KIND_HOST = 3;
  // Git over SSH and mounted keys (F445).
  COVERAGE_ROUTE_KIND_GIT_SSH = 4;
  // A retrievable or found credential (F445).
  COVERAGE_ROUTE_KIND_CREDENTIAL = 5;
  // An authenticated browser session (F446).
  COVERAGE_ROUTE_KIND_BROWSER = 6;
  // Child agents and delegated services (F447).
  COVERAGE_ROUTE_KIND_DELEGATED = 7;
  // CI/CD, webhooks, schedules, queues (F448).
  COVERAGE_ROUTE_KIND_INTERMEDIARY = 8;
  // Target-side identities and permissions beyond the connection (F449).
  COVERAGE_ROUTE_KIND_TARGET_SIDE = 9;
}

// CoverageRouteStatus is what the evidence says about one route.
enum CoverageRouteStatus {
  COVERAGE_ROUTE_STATUS_UNSPECIFIED = 0;
  // Mediated by PantherClaw in enforce mode.
  COVERAGE_ROUTE_STATUS_MEDIATED = 1;
  // Mediated in monitor mode: observed, not prevented.
  COVERAGE_ROUTE_STATUS_MONITORED = 2;
  // A cooperative channel the agent could skip (HR-024).
  COVERAGE_ROUTE_STATUS_COOPERATIVE = 3;
  // An opaque MCP server whose egress is not mediated (HR-086).
  COVERAGE_ROUTE_STATUS_OPAQUE = 4;
  // Proven blocked by current closure evidence.
  COVERAGE_ROUTE_STATUS_CLOSED = 5;
  // Seen or found, and not closed.
  COVERAGE_ROUTE_STATUS_POSSIBLE = 6;
  // No reliable source shows it; not proof that it is absent (F450).
  COVERAGE_ROUTE_STATUS_NOT_OBSERVED = 7;
  // A hypothesis, not evidence (F455).
  COVERAGE_ROUTE_STATUS_PROPOSED = 8;
  // Excluded by a person until the exclusion expires (HR-212).
  COVERAGE_ROUTE_STATUS_EXCLUDED = 9;
}

// CoverageScope names one agent, connection and operation.
message CoverageScope {
  // Agent id.
  string agent_id = 1 [(buf.validate.field).string.uuid = true];
  // Connection id.
  string connection_id = 2 [(buf.validate.field).string.uuid = true];
  // Operation, e.g. "github.pulls.merge".
  string operation = 3 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+){1,7}$"
  }];
}

// CoverageRoute is one route of a scope.
message CoverageRoute {
  // Inventory entry id; empty for a kind no source observed.
  string id = 1;
  // Kind.
  CoverageRouteKind kind = 2;
  // For a channel: "http", "mcp", "sdk", "hook", "authzen" or "a2a".
  string channel = 3;
  // Where it goes (a host, a file, an identity); untrusted text.
  string locator = 4;
  // "observed", "declared" or "proposed"; empty when not observed.
  string observation = 5;
  // Where the inventory learned of it: "gateway", "connection",
  // "discovery", "scan", "probe" or "person".
  string source = 6;
  // For a channel: the route mode last observed, "monitor" or "enforce".
  string mode = 7;
  // What the evidence says.
  CoverageRouteStatus status = 8;
  // The closure that closed it, when closed.
  string closure_id = 9;
  // First and last sighting.
  google.protobuf.Timestamp first_seen_time = 10;
  // Last sighting.
  google.protobuf.Timestamp last_seen_time = 11;
}

// CoverageInvalidation is a change that drops ENFORCED at once (HR-211).
message CoverageInvalidation {
  // Event id.
  string id = 1;
  // "connection", "package_version", "route_mode", "gateway",
  // "credential", "sandbox_image", "sandbox_config", "closure_failed",
  // "exclusion" or "evidence_expired".
  string kind = 2;
  // The connection it affects.
  string connection_id = 3;
  // The agent it affects; empty for every agent of the connection.
  string agent_id = 4;
  // The object that changed.
  string subject_id = 5;
  // A short description.
  string detail = 6;
  // When it happened.
  google.protobuf.Timestamp occur_time = 7;
  // When the reassess job handled it; unset while pending.
  google.protobuf.Timestamp reassess_time = 8;
}

// CoverageLastValid is the last ENFORCED record of a scope and why it no
// longer supports the claim (F442).
message CoverageLastValid {
  // Snapshot id.
  string snapshot_id = 1;
  // When it was computed.
  google.protobuf.Timestamp compute_time = 2;
  // When it expired or would have.
  google.protobuf.Timestamp expire_time = 3;
  // The closure it rested on.
  string closure_id = 4;
  // "expired", or the kind of the change that invalidated it.
  string lapse_reason = 5;
}

// CoverageRecord is one scope's coverage as it reads now.
message CoverageRecord {
  // Scope.
  CoverageScope scope = 1;
  // The state now: the computed state, downgraded to PARTIAL when ENFORCED
  // expired or a change since invalidated it.
  CoverageState state = 2;
  // The state the snapshot computed.
  CoverageState computed_state = 3;
  // Reason codes, most important first.
  repeated string reasons = 4;
  // The snapshot read; empty when none was computed yet (state UNKNOWN).
  string snapshot_id = 5;
  // "sha256:" and the hex digest of the snapshot's ledger body, which a
  // receipt's coverage claim names (HR-217).
  string snapshot_digest = 6;
  // When it was computed.
  google.protobuf.Timestamp compute_time = 7;
  // For ENFORCED: when it lapses.
  google.protobuf.Timestamp expire_time = 8;
  // The routes, every kind included.
  repeated CoverageRoute routes = 9;
  // The closure an ENFORCED state rests on.
  string closure_id = 10;
  // The last valid record, when this one is a downgrade.
  CoverageLastValid last_valid = 11;
  // The changes after the snapshot that invalidate it.
  repeated CoverageInvalidation invalidations = 12;
  // The active exclusions that apply.
  repeated CoverageExclusion exclusions = 13;
}

// GetCoverageRequest names a scope.
message GetCoverageRequest {
  // Scope.
  CoverageScope scope = 1 [(buf.validate.field).required = true];
}

// GetCoverageResponse returns the record.
message GetCoverageResponse {
  // Record.
  CoverageRecord record = 1;
}

// ListCoverageRequest filters the records.
message ListCoverageRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only this agent.
  optional string agent_id = 3 [(buf.validate.field).string = {
    uuid: true
    // Server ids are UUIDv7; other versions are refused.
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  }];
  // Only this connection.
  optional string connection_id = 4 [(buf.validate.field).string = {
    uuid: true
    // Server ids are UUIDv7; other versions are refused.
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  }];
}

// ListCoverageResponse is one page; records leave out routes,
// invalidations and exclusions (GetCoverage has them).
message ListCoverageResponse {
  // Records, by agent, connection and operation.
  repeated CoverageRecord records = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// ListRoutesRequest filters the inventory.
message ListRoutesRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only this agent's routes and those of every agent.
  optional string agent_id = 3 [(buf.validate.field).string.uuid = true];
  // Only this connection.
  optional string connection_id = 4 [(buf.validate.field).string.uuid = true];
}

// ListRoutesResponse is one page of inventory entries; status is
// unset (it depends on a scope's evidence: GetCoverage).
message ListRoutesResponse {
  // Routes, oldest first.
  repeated CoverageRoute routes = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// CoverageProbeResult is one probe, control or canary result of a closure.
message CoverageProbeResult {
  // Probe name, e.g. "direct_https".
  string name = 1;
  // "probe", "positive_control", "negative_control" or "canary".
  string role = 2;
  // "blocked" or "reachable".
  string expect = 3;
  // "blocked", "reachable" or "error".
  string observed = 4;
  // Whether observed equals expect.
  bool passed = 5;
  // Detail from the probe, at most 512 characters. UNTRUSTED: it comes
  // from the launcher's host; show it as text in the untrusted block.
  string detail = 6;
}

// CoverageConfigCheck is one of pclaw's checks of the agent container.
message CoverageConfigCheck {
  // Check id, e.g. "agent_no_docker_socket".
  string id = 1;
  // Whether the check passed.
  bool ok = 2;
  // Detail, at most 512 characters. UNTRUSTED, like a probe's.
  string detail = 3;
}

// CoverageClosure is the closure evidence of one sandbox session for one
// agent and connection (F457, PN-008.2).
message CoverageClosure {
  // Closure id.
  string id = 1;
  // Agent.
  string agent_id = 2;
  // Connection.
  string connection_id = 3;
  // The sandbox session that produced it.
  string sandbox_session_id = 4;
  // Whether the evidence is sound: every result and configuration check
  // passed, with the named controls and the canary (PASSED). What it
  // proves is closed_kinds.
  bool passed = 5;
  // Every result.
  repeated CoverageProbeResult probes = 6;
  // The route kinds it proves blocked.
  repeated CoverageRouteKind closed_kinds = 7;
  // RFC 7638 thumbprint of the per-session key that signed the results.
  string signing_key_jkt = 8;
  // "sha256:" and the hex digest of the signed results.
  string results_digest = 9;
  // Docker engine version, API version and runtime ("runc" or "runsc").
  string engine_version = 10;
  // API version.
  string api_version = 11;
  // Runtime.
  string runtime = 12;
  // Image digests of the session.
  repeated string image_digests = 13;
  // The gateway, connection revision, package version and credential
  // version its session opened under.
  string gateway_id = 14;
  // Connection revision.
  int32 connection_revision = 15;
  // Package version id.
  string package_version_id = 16;
  // When the probes ran, when it expires and when it was recorded.
  google.protobuf.Timestamp observe_time = 17;
  // Expiry.
  google.protobuf.Timestamp expire_time = 18;
  // Recording time.
  google.protobuf.Timestamp record_time = 19;
  // pclaw's checks of the agent container.
  repeated CoverageConfigCheck config_checks = 20;
  // The active sealed credential's version; absent when the connection
  // had none.
  optional int32 credential_version = 21;
}

// GetClosureRequest names a closure.
message GetClosureRequest {
  // Closure id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetClosureResponse returns it.
message GetClosureResponse {
  // Closure.
  CoverageClosure closure = 1;
}

// ListClosuresRequest filters closures.
message ListClosuresRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only this agent.
  optional string agent_id = 3 [(buf.validate.field).string.uuid = true];
  // Only this connection.
  optional string connection_id = 4 [(buf.validate.field).string.uuid = true];
}

// ListClosuresResponse is one page; probes are left out.
message ListClosuresResponse {
  // Closures, newest first.
  repeated CoverageClosure closures = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// GetFreshnessContractRequest takes no parameters.
message GetFreshnessContractRequest {}

// GetFreshnessContractResponse is the published freshness contract.
message GetFreshnessContractResponse {
  // How long closure evidence supports ENFORCED.
  google.protobuf.Duration enforced_ttl = 1;
  // How often pending changes are reassessed at most
  // (coverage.reassess_every).
  google.protobuf.Duration reassess_every = 2;
  // The changes that invalidate closure evidence taken before them, and so
  // drop ENFORCED at once. A new route, an exclusion and an expiry only
  // make the scope be recomputed.
  repeated string invalidation_kinds = 3;
  // The highest state an expired or invalidated ENFORCED record reads as:
  // it is recomputed from current evidence, capped at this state, and may
  // read lower.
  CoverageState stale_state = 4;
}

// ReassessRequest names a connection.
message ReassessRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Only this agent.
  optional string agent_id = 2 [(buf.validate.field).string.uuid = true];
}

// ReassessResponse counts what changed.
message ReassessResponse {
  // Scopes recomputed.
  int32 scopes = 1;
  // Snapshots recorded (scopes whose record changed).
  int32 snapshots = 2;
}

// CoverageExclusion excludes a scope or a route kind from a claim.
message CoverageExclusion {
  // Exclusion id.
  string id = 1;
  // Agent; empty for every agent of the connection.
  string agent_id = 2;
  // Connection.
  string connection_id = 3;
  // Operation; empty for every operation.
  string operation = 4;
  // Route kind; unspecified for the whole scope.
  CoverageRouteKind route_kind = 5;
  // Why, in the creator's words (untrusted text).
  string reason = 6;
  // "ACTIVE", "REVOKED" or "EXPIRED".
  string state = 7;
  // The person who created it.
  string created_by = 8;
  // When it was created.
  google.protobuf.Timestamp create_time = 9;
  // When it expires.
  google.protobuf.Timestamp expire_time = 10;
  // The person who revoked it.
  string revoked_by = 11;
  // When it was revoked.
  google.protobuf.Timestamp revoke_time = 12;
}


// CreateExclusionRequest describes an exclusion.
message CreateExclusionRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Agent id; unset for every agent of the connection.
  optional string agent_id = 2 [(buf.validate.field).string.uuid = true];
  // Operation; unset for every operation.
  optional string operation = 3 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+){1,7}$"
  }];
  // Route kind; unspecified excludes the whole scope. A channel is never
  // excluded.
  CoverageRouteKind route_kind = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [1]
  }];
  // A written reason (10 to 1,000 characters).
  string reason = 5 [(buf.validate.field).string = {
    min_len: 10
    max_len: 1000
  }];
  // Days until it expires (1 to 90).
  int32 expires_in_days = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 90
  }];
}

// CreateExclusionResponse returns it.
message CreateExclusionResponse {
  // Exclusion.
  CoverageExclusion exclusion = 1;
}

// RevokeExclusionRequest names an exclusion.
message RevokeExclusionRequest {
  // Exclusion id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeExclusionResponse returns it.
message RevokeExclusionResponse {
  // Exclusion.
  CoverageExclusion exclusion = 1;
}

// ListExclusionsRequest filters exclusions.
message ListExclusionsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only this connection.
  optional string connection_id = 3 [(buf.validate.field).string.uuid = true];
}

// ListExclusionsResponse is one page.
message ListExclusionsResponse {
  // Exclusions, newest first.
  repeated CoverageExclusion exclusions = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// AccessControlMode is how an actor's target access is controlled (§39.2).
// Several may apply at once.
enum AccessControlMode {
  ACCESS_CONTROL_MODE_UNSPECIFIED = 0;
  // The target validates the action boundary (action tokens).
  ACCESS_CONTROL_MODE_TARGET_ENFORCED = 1;
  // Access limited by destination, scope and duration, e.g. a per-action
  // token.
  ACCESS_CONTROL_MODE_NARROW_TEMPORARY = 2;
  // PantherClaw performs approved work with access the agent cannot read.
  ACCESS_CONTROL_MODE_PANTHERCLAW_HELD = 3;
  // An approved external control (the containment sandbox) confines the
  // actor's reach.
  ACCESS_CONTROL_MODE_CONSTRAINED_RUNTIME = 4;
  // The agent can exercise broader target authority directly.
  ACCESS_CONTROL_MODE_AGENT_HELD = 5;
}

// GetAccessDetailRequest names a connection, optionally one agent.
message GetAccessDetailRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Agent id; unset for the connection alone.
  optional string agent_id = 2 [(buf.validate.field).string.uuid = true];
}

// AccessDetail is the access detail of a connection (and agent).
message AccessDetail {
  // Connection.
  string connection_id = 1;
  // Agent, when one was named.
  string agent_id = 2;
  // The modes that apply, strongest control first.
  repeated AccessControlMode modes = 3;
  // Who holds usable target authority: "gateway", "agent" or "target".
  string custodian = 4;
  // The gateway that holds the sealed credential, when PantherClaw holds it.
  string gateway_id = 5;
  // The active sealed credential's version and the hosts it may reach;
  // never its value.
  int32 credential_version = 6;
  // Allowed hosts.
  repeated string credential_hosts = 7;
  // The closure that confines the agent, and when it expires.
  string closure_id = 8;
  // Expiry.
  google.protobuf.Timestamp closure_expire_time = 9;
  // Routes of the agent's scopes on this connection that are not closed.
  repeated CoverageRoute residual_routes = 10;
  // What each mode must disclose, in plain language.
  repeated string disclosures = 11;
  // What the access reaches: the sealed credential's hosts, or the single
  // action a token names.
  repeated string scope = 12;
  // Who accepts it: the target hosts.
  repeated string audience = 13;
  // How long it lasts, in plain language.
  string expiry = 14;
  // Who issued it, and when.
  string issued_by = 15;
  // Issuance time.
  google.protobuf.Timestamp issue_time = 16;
  // The agents with coverage on the connection that the caller may read.
  repeated string agent_ids = 17;
  // What verifies the modes.
  repeated string verification_basis = 18;
  // For each read of the scopes shown, when its latest passing
  // target-verifier test ran. A test vouches only for the read it tested;
  // writes stay PARTIAL in M9 (founder decision N15).
  repeated VerifiedOperation verified_operations = 19;
  // The GitHub App installation's account login when the credential
  // issues installation tokens, else empty; shown only to a holder of
  // connection.read (F423).
  string target_account = 20;
  // The active grants of the affected agents that allow an operation of
  // the connection, newest first; only agents the caller holds grant.read
  // over (F423).
  repeated string grant_ids = 21;
  // The 20 newest transactions on the connection by the affected agents;
  // only agents the caller holds evidence.read over (F423).
  repeated string recent_transaction_ids = 22;
}

// VerifiedOperation is when the latest passing target-verifier test of one
// operation ran.
message VerifiedOperation {
  // Operation.
  string operation = 1;
  // When the test ran.
  google.protobuf.Timestamp verify_time = 2;
}

// GetAccessDetailResponse returns the disclosure.
message GetAccessDetailResponse {
  // Detail.
  AccessDetail detail = 1;
}

// CoverageFinding is an exposure finding (F048; M10 adds kinds).
message CoverageFinding {
  // Finding id.
  string id = 1;
  // "credential_overreach".
  string kind = 2;
  // Connection, when the finding is about one.
  string connection_id = 3;
  // Agent, when the finding is about one.
  string agent_id = 4;
  // What holds the reach, e.g. "GitHub App pantherclaw-ci"; untrusted
  // text.
  string subject = 5;
  // Permissions ("name:level") the operations declare they need.
  repeated string declared = 6;
  // Permissions the credential actually holds.
  repeated string held = 7;
  // Permissions the operations the gateway carried need.
  repeated string used = 8;
  // Permissions held beyond the declared need.
  repeated string excess = 9;
  // "low", "medium", "high" or "critical".
  string severity = 10;
  // "OPEN", "RESOLVED" or "DISMISSED".
  string state = 11;
  // First and last seen, resolved or dismissed.
  google.protobuf.Timestamp first_seen_time = 12;
  // Last seen.
  google.protobuf.Timestamp last_seen_time = 13;
  // When resolved or dismissed.
  google.protobuf.Timestamp resolve_time = 14;
  // The person who dismissed it and why (untrusted text).
  string dismissed_by = 15;
  // Reason.
  string dismiss_reason = 16;
}

// ListFindingsRequest filters findings.
message ListFindingsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only in this state.
  optional string state = 3 [(buf.validate.field).string = {
    in: ["OPEN", "RESOLVED", "DISMISSED"]
  }];
  // Only this connection.
  optional string connection_id = 4 [(buf.validate.field).string.uuid = true];
}

// ListFindingsResponse is one page.
message ListFindingsResponse {
  // Findings, newest first.
  repeated CoverageFinding findings = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// AcknowledgeFindingRequest names a finding and why it is dismissed.
message AcknowledgeFindingRequest {
  // Finding id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // A written reason (10 to 1,000 characters).
  string reason = 2 [(buf.validate.field).string = {
    min_len: 10
    max_len: 1000
  }];
}

// AcknowledgeFindingResponse returns the finding.
message AcknowledgeFindingResponse {
  // Finding.
  CoverageFinding finding = 1;
}

// CoverageSnapshot is one recorded computation of a scope's coverage.
message CoverageSnapshot {
  // Snapshot id.
  string id = 1;
  // The scope.
  CoverageScope scope = 2;
  // Its state and why.
  CoverageState state = 3;
  // Reason codes.
  repeated string reasons = 4;
  // Every route and its status when it was computed.
  repeated CoverageRoute routes = 5;
  // The closure an ENFORCED state rests on.
  string closure_id = 6;
  // The last ENFORCED snapshot a downgrade follows (F442).
  string last_valid_id = 7;
  // The change that caused the computation, when one did.
  string invalidation_id = 8;
  // The exclusions that applied.
  repeated string exclusion_ids = 9;
  // When it was computed, and when ENFORCED expires.
  google.protobuf.Timestamp compute_time = 10;
  // Expiry of an ENFORCED state.
  google.protobuf.Timestamp expire_time = 11;
  // Its coverage.snapshot ledger entry and that entry's SHA-256.
  string ledger_entry_id = 12;
  // "sha256:" and the hex digest.
  string entry_digest = 13;
}

// GetSnapshotRequest names a snapshot.
message GetSnapshotRequest {
  // Snapshot id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetSnapshotResponse returns the snapshot.
message GetSnapshotResponse {
  // Snapshot.
  CoverageSnapshot snapshot = 1;
}

// ListSnapshotsRequest names a scope.
message ListSnapshotsRequest {
  // The scope.
  CoverageScope scope = 1 [(buf.validate.field).required = true];
  // Maximum results (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous page.
  string page_token = 3 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListSnapshotsResponse is one page of a scope's snapshots, newest first.
message ListSnapshotsResponse {
  // Snapshots.
  repeated CoverageSnapshot snapshots = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// GetCoverageGraphRequest names an agent, optionally one connection and
// operation.
message GetCoverageGraphRequest {
  // Agent id.
  string agent_id = 1 [(buf.validate.field).string.uuid = true];
  // Only this connection.
  optional string connection_id = 2 [(buf.validate.field).string.uuid = true];
  // Only this operation.
  optional string operation = 3 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+){1,7}$"
  }];
}

// CoverageGraphNode is one node of a coverage graph.
message CoverageGraphNode {
  // "agent:<id>", "scope:<connection_id>/<operation>", "route:<route id>"
  // or "target:<host>".
  string id = 1;
  // "AGENT", "SCOPE", "ROUTE" or "TARGET".
  string kind = 2;
  // What to show: the agent id, the operation, the route's channel or
  // kind, or the host. A route's locator is untrusted text.
  string label = 3;
  // For a route: its kind, e.g. "direct_api".
  string route_kind = 4;
  // For a route: its status, e.g. "possible".
  string route_status = 5;
  // For a route: "TESTED" (mediated or closed), "POSSIBLE", "EXCLUDED" or
  // "UNVERIFIED" (every other status, unknown included).
  string control = 6;
  // For a closed route: the closure that closed it.
  string closure_id = 7;
}

// CoverageGraphEdge joins two nodes: agent to scope, scope to route, route
// to target.
message CoverageGraphEdge {
  // From node id.
  string from = 1;
  // To node id.
  string to = 2;
}

// GetCoverageGraphResponse is the graph.
message GetCoverageGraphResponse {
  // Nodes.
  repeated CoverageGraphNode nodes = 1;
  // Edges.
  repeated CoverageGraphEdge edges = 2;
  // What the scopes shown say about the agent, as the agent lifecycle
  // derives it: "PROTECTED", "PARTIALLY_PROTECTED" or "OBSERVED".
  string boundary_state = 3;
  // Set when the caller may not read every scope of the agent.
  bool scope_limited = 4;
}
