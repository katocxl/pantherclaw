syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/automations.proto";

// AgentService keeps the agent inventory (Badge; F003, F016, F017, F020,
// F022–F024, F035, F574, F624; G0 M3). An agent is an accountable record:
// owner and backup owner, team, environment, purpose and execution context.
// Agents are addressed by id; a name binds nothing (F034, HR-147). Creating,
// claiming or owning an agent grants it no authority.
service AgentService {
  // CreateAgent creates a claimed agent, subject to the edition's agent
  // limit.
  // permission: agent.manage
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  // GetAgent returns an agent's summary (F017, F031, F624).
  // permission: agent.read
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListAgents lists agents, discovered ones included.
  // permission: agent.read
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateAgent changes an agent's name or purpose. The execution context
  // never changes; a different context needs a new agent.
  // permission: agent.manage
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  // TransferOwnership changes the owner or backup owner. It is recorded and
  // moves no runs, instances or grants (F574).
  // permission: agent.manage
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  // ClaimAgent turns a discovered agent into a claimed one, or merges its
  // discovery into an existing agent (F035). Claiming grants nothing.
  // permission: agent.manage
  rpc ClaimAgent(ClaimAgentRequest) returns (ClaimAgentResponse);
  // SuspendAgent suspends an agent: its instances get no workload tokens and
  // its runs are denied. Outstanding permits fail BeginDispatch. Resuming
  // needs an approved restoration (RequestAgentRestoration).
  // permission: agent.manage
  rpc SuspendAgent(SuspendAgentRequest) returns (SuspendAgentResponse);
  // RetireAgent retires an agent for good: it revokes its instances and
  // enrollment tokens and ends its runs (F023). Retiring a discovered agent
  // dismisses its discovery.
  // permission: agent.manage
  rpc RetireAgent(RetireAgentRequest) returns (RetireAgentResponse);
  // ListAgentChanges returns an agent's append-only change history (F024).
  // permission: agent.read
  rpc ListAgentChanges(ListAgentChangesRequest) returns (ListAgentChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetAgentCard returns an agent's purpose, owner, stated risk fields and
  // approved tools from pinned packages (G0 M24 D231).
  // permission: agent.read
  rpc GetAgentCard(GetAgentCardRequest) returns (GetAgentCardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SubmitScanFindings records the findings of a local `pclaw scan` as
  // DISCOVERED agents with ADMISSION entries (PN-001.1, F015); a finding
  // submitted before is only counted. Findings are UNTRUSTED observations
  // and grant nothing; credential values never leave the scanning machine,
  // only the kind of a key that is present (G0 M24 D238). It is also served on the gateway listener, where a gateway holding an
  // organization scan's org_scan lease submits that scan's findings and
  // needs gateway.scan.submit instead (G0 M8, HR-209).
  // permission: agent.manage
  rpc SubmitScanFindings(SubmitScanFindingsRequest) returns (SubmitScanFindingsResponse);
  // RequestAgentRestoration asks for a suspended agent to return to the
  // state it was suspended from (F563). It creates a RESTORATION approval
  // request and waitlist entry, decided on the approval page with a
  // security key by an agent.restore holder other than the requester (G0 M5
  // part 2 decision 11, HR-176). Only a person may ask, with a reason.
  // permission: agent.manage
  rpc RequestAgentRestoration(RequestAgentRestorationRequest) returns (RequestAgentRestorationResponse);
}

// AgentState is the lifecycle state (F020).
enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  // Seen by a gateway or a scan; no owner yet.
  AGENT_STATE_DISCOVERED = 1;
  // Has an owner; no admitted instance yet.
  AGENT_STATE_CLAIMED = 2;
  // At least one instance has been admitted.
  AGENT_STATE_VERIFIED = 3;
  // A verified instance has made a request.
  AGENT_STATE_OBSERVED = 4;
  // Some named paths have current coverage evidence (M9).
  AGENT_STATE_PARTIALLY_PROTECTED = 5;
  // All named paths have current coverage evidence (M9).
  AGENT_STATE_PROTECTED = 6;
  // Suspended; resuming needs a RESTORATION entry (M5).
  AGENT_STATE_SUSPENDED = 7;
  // Retired for good.
  AGENT_STATE_RETIRED = 8;
}

// ExecutionContext is where an agent's instances run. Desktop instances are
// capped at L1 (HR-092).
enum ExecutionContext {
  EXECUTION_CONTEXT_UNSPECIFIED = 0;
  // A developer machine.
  EXECUTION_CONTEXT_DESKTOP = 1;
  // A CI job.
  EXECUTION_CONTEXT_CI = 2;
  // A Kubernetes pod.
  EXECUTION_CONTEXT_KUBERNETES = 3;
  // A long-running service.
  EXECUTION_CONTEXT_SERVICE = 4;
}

// ActivityStatus distinguishes empty states explicitly (F624).
enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  // No instance has been admitted.
  ACTIVITY_STATUS_NO_INSTANCES = 1;
  // Identity verified, no request observed yet.
  ACTIVITY_STATUS_VERIFIED_NO_ACTIONS = 2;
  // Requests have been observed.
  ACTIVITY_STATUS_ACTIVE = 3;
}

// AgentRiskTier is the risk tier people state for an agent (G0 M24 D230).
enum AgentRiskTier {
  AGENT_RISK_TIER_UNSPECIFIED = 0;
  // Nobody has stated a tier.
  AGENT_RISK_TIER_UNSET = 1;
  // Low.
  AGENT_RISK_TIER_LOW = 2;
  // Medium.
  AGENT_RISK_TIER_MEDIUM = 3;
  // High.
  AGENT_RISK_TIER_HIGH = 4;
  // Critical.
  AGENT_RISK_TIER_CRITICAL = 5;
}

// AgentAiActRole is the EU AI Act role people state for an agent (D230).
enum AgentAiActRole {
  AGENT_AI_ACT_ROLE_UNSPECIFIED = 0;
  // Nobody has stated a role.
  AGENT_AI_ACT_ROLE_UNSET = 1;
  // Provider.
  AGENT_AI_ACT_ROLE_PROVIDER = 2;
  // Deployer.
  AGENT_AI_ACT_ROLE_DEPLOYER = 3;
  // The Act does not apply.
  AGENT_AI_ACT_ROLE_NOT_APPLICABLE = 4;
}

// AgentAiActRisk is the EU AI Act risk class people state for an agent (D230).
enum AgentAiActRisk {
  AGENT_AI_ACT_RISK_UNSPECIFIED = 0;
  // Nobody has stated a class.
  AGENT_AI_ACT_RISK_UNSET = 1;
  // Minimal.
  AGENT_AI_ACT_RISK_MINIMAL = 2;
  // Limited.
  AGENT_AI_ACT_RISK_LIMITED = 3;
  // High.
  AGENT_AI_ACT_RISK_HIGH = 4;
}

// Agent is one accountable agent record.
message Agent {
  // Agent id.
  string id = 1;
  // Display name; not unique and never used to bind identity.
  string name = 2;
  // Permitted purpose, written by people.
  string purpose = 3;
  // Owning team; empty while discovered.
  string team_id = 4;
  // Environment; empty while discovered.
  string environment_id = 5;
  // Accountable owner (a user); empty while discovered.
  string owner_user_id = 6;
  // Backup owner (a user); optional.
  string backup_owner_user_id = 7;
  // Execution context; unspecified while discovered.
  ExecutionContext execution_context = 8;
  // Lifecycle state.
  AgentState state = 9;
  // For a suspended agent, the state it was suspended from.
  AgentState suspended_from = 10;
  // Who created the record.
  string created_by = 11;
  // Creation time.
  google.protobuf.Timestamp create_time = 12;
  // Last change.
  google.protobuf.Timestamp update_time = 13;
  // Claim time.
  google.protobuf.Timestamp claim_time = 14;
  // Retirement time.
  google.protobuf.Timestamp retire_time = 15;
  // A range agent (G0 M12, HR-220): marked at creation, never changed; all
  // its runs are simulated and it may use only simulated connections.
  bool range_agent = 16;
  // Risk tier a person stated (G0 M24 D230). It grants nothing.
  AgentRiskTier risk_tier = 17;
  // Data classes a person stated, from public, internal, pii and secret.
  repeated string data_classes = 18;
  // EU AI Act role a person stated.
  AgentAiActRole ai_act_role = 19;
  // EU AI Act risk class a person stated.
  AgentAiActRisk ai_act_risk = 20;
}

// Discovery is what a gateway or scan observed about a discovered agent.
message Discovery {
  // Discovery id.
  string id = 1;
  // "gateway" or "scan".
  string source = 2;
  // RFC 7638 thumbprint of the observed key (gateway discoveries).
  string key_thumbprint = 3;
  // "OPEN", "CLAIMED" or "DISMISSED".
  string state = 4;
  // Times seen.
  int64 seen_count = 5;
  // First sighting.
  google.protobuf.Timestamp first_seen_time = 6;
  // Last sighting.
  google.protobuf.Timestamp last_seen_time = 7;
  // UNTRUSTED attributes as observed (gateway, route, client address, user
  // agent). Never use them to identify the agent.
  map<string, string> untrusted_observed = 8;
}

// AgentSummary answers who owns the agent, what it is for, where it runs and
// how its identity is verified (F017, F031). Authority (M4) and protected
// paths (M9) are added by later milestones.
message AgentSummary {
  // The agent.
  Agent agent = 1;
  // Activity status (F624).
  ActivityStatus activity = 2;
  // The next action this state requires (F020), for example "admit an
  // instance".
  string next_action = 3;
  // Instances waiting for admission.
  int32 pending_instances = 4;
  // Admitted instances.
  int32 admitted_instances = 5;
  // Highest attestation level among admitted instances (0 when none).
  int32 highest_attestation_level = 6;
  // Last successful verification of any instance.
  google.protobuf.Timestamp last_verify_time = 7;
  // Active runs.
  int32 active_runs = 8;
  // Open waitlist entries.
  int32 open_waitlist_entries = 9;
  // Instances flagged for review after drift (F033).
  int32 instances_needing_review = 10;
  // The discovery, for discovered (or merged) agents.
  Discovery discovery = 11;
}

// AgentChange is one entry of an agent's history (F024).
message AgentChange {
  // Change id.
  string id = 1;
  // Agent id.
  string agent_id = 2;
  // Kind, for example "agent.claimed" or "instance.admitted".
  string kind = 3;
  // Who made the change ("user:<id>", "sa:<id>", "instance:<id>" or "system").
  string actor = 4;
  // Reason given.
  string reason = 5;
  // Details of the change.
  map<string, string> details = 6;
  // Time of the change.
  google.protobuf.Timestamp create_time = 7;
}

// CreateAgentRequest creates a claimed agent.
message CreateAgentRequest {
  // Display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Permitted purpose.
  string purpose = 2 [(buf.validate.field).string.max_len = 2000];
  // Owning team.
  string team_id = 3 [(buf.validate.field).string.uuid = true];
  // Environment.
  string environment_id = 4 [(buf.validate.field).string.uuid = true];
  // Accountable owner (a user).
  string owner_user_id = 5 [(buf.validate.field).string.uuid = true];
  // Optional backup owner (another user).
  optional string backup_owner_user_id = 6 [(buf.validate.field).string.uuid = true];
  // Execution context; fixed for the agent's life.
  ExecutionContext execution_context = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Creates a range agent (G0 M12, HR-220): all its runs are simulated and it
  // may use only simulated connections. At most 5 per organization; they do
  // not count toward the edition's agent limit. Fixed for the agent's life.
  bool range_agent = 8;
}

// CreateAgentResponse returns the agent.
message CreateAgentResponse {
  // The agent.
  Agent agent = 1;
}

// GetAgentRequest names an agent.
message GetAgentRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetAgentResponse returns its summary.
message GetAgentResponse {
  // The summary.
  AgentSummary summary = 1;
}

// ListAgentsRequest pages through agents.
message ListAgentsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only agents in these states (all when empty).
  repeated AgentState states = 3 [(buf.validate.field).repeated = {
    max_items: 8
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Only agents of this team.
  optional string team_id = 4 [(buf.validate.field).string = {
    uuid: true
    // Server ids are UUIDv7; other versions are refused.
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  }];
  // Also list automations as execution identities (G0 M11 part 2 D15,
  // F025); needs automation.read, else omitted with a note.
  bool include_automations = 5;
}

// ListAgentsResponse is one page.
message ListAgentsResponse {
  // Agents, oldest first.
  repeated Agent agents = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
  // True when the org has no agents at all, as opposed to none matching the
  // filters (F624).
  bool org_has_no_agents = 3;
  // Automations, when include_automations was set and the caller holds
  // automation.read (on the first page only).
  repeated AutomationIdentity automations = 4;
  // Why automations were omitted, when they were asked for.
  string automations_note = 5;
}

// UpdateAgentRequest changes the fields that are set.
message UpdateAgentRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New display name.
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // New purpose.
  optional string purpose = 3 [(buf.validate.field).string.max_len = 2000];
  // New risk tier (D230).
  optional AgentRiskTier risk_tier = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New data classes (D230); an empty list clears them.
  AgentDataClasses data_classes = 5;
  // New EU AI Act role (D230).
  optional AgentAiActRole ai_act_role = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New EU AI Act risk class (D230).
  optional AgentAiActRisk ai_act_risk = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// AgentDataClasses replaces an agent's data classes, so an empty list differs
// from leaving them unchanged.
message AgentDataClasses {
  // Classes, from public, internal, pii and secret.
  repeated string classes = 1 [(buf.validate.field).repeated = {
    max_items: 4
    unique: true
  }];
}

// GetAgentCardRequest names the agent.
message GetAgentCardRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetAgentCardResponse returns the card.
message GetAgentCardResponse {
  // The card.
  AgentCard card = 1;
}

// AgentCard is the one-page account of an agent (G0 M24 D231).
message AgentCard {
  // Agent id.
  string id = 1;
  // Display name.
  string name = 2;
  // Permitted purpose, written by people.
  string purpose = 3;
  // Accountable owner; empty while discovered.
  string owner_user_id = 4;
  // Backup owner; optional.
  string backup_owner_user_id = 5;
  // Risk tier a person stated.
  AgentRiskTier risk_tier = 6;
  // Data classes a person stated.
  repeated string data_classes = 7;
  // EU AI Act role a person stated.
  AgentAiActRole ai_act_role = 8;
  // EU AI Act risk class a person stated.
  AgentAiActRisk ai_act_risk = 9;
  // Operations the agent reaches through usable pinned package versions.
  repeated AgentApprovedTool approved_tools = 10;
  // More approved tools exist than the card lists.
  bool approved_tools_truncated = 11;
}

// AgentApprovedTool is one operation on an agent's card.
message AgentApprovedTool {
  // Connection id.
  string connection_id = 1;
  // Connection name.
  string connection_name = 2;
  // Package name.
  string package = 3;
  // Pinned package version.
  string package_version = 4;
  // Operation name.
  string operation = 5;
}

// UpdateAgentResponse returns the agent.
message UpdateAgentResponse {
  // The agent.
  Agent agent = 1;
}

// TransferOwnershipRequest sets the owner and backup owner.
message TransferOwnershipRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // New owner (a user).
  string owner_user_id = 2 [(buf.validate.field).string.uuid = true];
  // New backup owner; empty to remove it.
  string backup_owner_user_id = 3 [(buf.validate.field).string = {
    max_len: 36
    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})?$"
  }];
  // Reason, recorded in the history.
  string reason = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}

// TransferOwnershipResponse returns the agent.
message TransferOwnershipResponse {
  // The agent.
  Agent agent = 1;
}

// ClaimAgentRequest claims a discovered agent.
message ClaimAgentRequest {
  // The discovered agent's id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // How to claim it.
  oneof target {
    option (buf.validate.oneof).required = true;
    // Keep it as its own agent with these details.
    ClaimDetails as_new_agent = 2;
    // Merge its discovery into this existing agent (F035); the discovered
    // record is retired.
    string merge_into_agent_id = 3 [(buf.validate.field).string.uuid = true];
  }
  // Reason, recorded in the history.
  string reason = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}

// ClaimDetails are the accountable details a claimed agent needs.
message ClaimDetails {
  // Display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Permitted purpose.
  string purpose = 2 [(buf.validate.field).string.max_len = 2000];
  // Owning team.
  string team_id = 3 [(buf.validate.field).string.uuid = true];
  // Environment.
  string environment_id = 4 [(buf.validate.field).string.uuid = true];
  // Accountable owner (a user).
  string owner_user_id = 5 [(buf.validate.field).string.uuid = true];
  // Optional backup owner.
  optional string backup_owner_user_id = 6 [(buf.validate.field).string.uuid = true];
  // Execution context; fixed for the agent's life.
  ExecutionContext execution_context = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// ClaimAgentResponse returns the claimed (or merged-into) agent.
message ClaimAgentResponse {
  // The agent that now owns the discovery.
  Agent agent = 1;
}

// SuspendAgentRequest suspends an agent.
message SuspendAgentRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Reason, recorded in the history.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}

// SuspendAgentResponse returns the agent.
message SuspendAgentResponse {
  // The agent.
  Agent agent = 1;
}

// RetireAgentRequest retires an agent.
message RetireAgentRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Reason, recorded in the history.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}

// RetireAgentResponse returns the agent.
message RetireAgentResponse {
  // The agent.
  Agent agent = 1;
}

// ListAgentChangesRequest pages through an agent's history.
message ListAgentChangesRequest {
  // Agent id.
  string agent_id = 1 [(buf.validate.field).string.uuid = true];
  // Maximum results (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 3 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListAgentChangesResponse is one page.
message ListAgentChangesResponse {
  // Changes, oldest first.
  repeated AgentChange changes = 1;
  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// ScanFinding is one finding of a local scan.
message ScanFinding {
  // "mcp_server", "agent_project", "hook", "skill" or "env_secret" from a
  // local scan (env_secret carries the credential's kind and nothing of its
  // value, G0 M24 D233, D238); from a gateway's organization scan (G0 M8,
  // HR-209), "github_app", "github_workflow" or "github_mcp_config".
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "mcp_server",
      "agent_project",
      "hook",
      "skill",
      "env_secret",
      "github_app",
      "github_workflow",
      "github_mcp_config"
    ]
  }];
  // Stable key of the finding on the scanning machine (hex SHA-256), so a
  // later scan of the same thing is only counted.
  string key = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  // UNTRUSTED attributes (client, config, name, command, path, frameworks).
  map<string, string> attributes = 3 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {
      string: {pattern: "^[a-z_]{1,32}$"}
    }
    values: {
      string: {max_len: 256}
    }
  }];
}

// SubmitScanFindingsRequest submits findings.
message SubmitScanFindingsRequest {
  // The findings.
  repeated ScanFinding findings = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
  }];
  // UNTRUSTED name of the scanned machine.
  string host = 2 [(buf.validate.field).string.max_len = 128];
  // The organization scan the findings are from (G0 M8, HR-209). Only a
  // gateway sets it, on the gateway listener, while it holds that scan's
  // org_scan lease; the org comes from its certificate (HR-020).
  string scan_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The secret of the scan's org_scan lease the gateway holds, with
  // scan_id: the server compares its hash, so only the holder of the lease
  // submits, not any holder of the gateway's certificate.
  bytes lease = 4 [(buf.validate.field).bytes.max_len = 64];
  // UNTRUSTED scope of a CI-mode scan (G0 M17 D115): the repository or
  // host it scanned. Its findings are discoveries of source ci_scan, kept
  // apart per scope.
  string scope = 5 [(buf.validate.field).string.max_len = 256];
  // The scan read the whole scope, and this request carries every finding
  // of it (at most 200, D130): a ci_scan discovery of the scope it lacks
  // counts a miss (HR-459). Needs scope.
  bool complete = 6;
}

// SubmitScanFindingsResponse counts what was recorded.
message SubmitScanFindingsResponse {
  // New discovered agents.
  int32 created = 1;
  // Findings already known (only counted).
  int32 counted = 2;
  // Findings dropped because the org already has 200 open discoveries.
  int32 dropped = 3;
  // Discoveries of the scope a complete scan did not see, each counted a
  // miss. A discovery missed by 3 complete scans in a row is announced as
  // vanished; nothing changes the agent (HR-458).
  int32 missed = 4;
}

// RequestAgentRestorationRequest asks to restore a suspended agent.
message RequestAgentRestorationRequest {
  // Agent id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Why it should be restored, shown to the deciders and recorded in the
  // history.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
}

// RequestAgentRestorationResponse names the approval request.
message RequestAgentRestorationResponse {
  // The RESTORATION approval request, decided at /approvals/{id}.
  string approval_request_id = 1;
  // Its waitlist entry.
  string waitlist_entry_id = 2;
  // Without approval by then, the agent stays suspended.
  google.protobuf.Timestamp deadline_time = 3;
}
