syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// PolicySimulationService predicts what a stored policy version would have
// decided over the org's recorded decisions (G0 M11.1 D15; F187–F192,
// F287; HR-232, HR-237; Team edition).
//
// A simulation is a bounded batch replay that runs in the worker: the
// recorded decisions of a window of at most 30 days (inside retention),
// newest first and at most max_evaluations of them, each replayed once
// with the policy it was decided under and once with the version. Each is
// counted in one category: newly denied, newly held, newly constrained,
// newly allowed (expanded exposure), reason changed, unchanged, or
// unevaluable (the recorded decision does not reproduce, or the replay
// lacks inputs it would need). A simulation predicts decisions, not agent
// replanning or business outcomes. It writes nothing but its own report
// and reaches no target (HR-232). Its outputs carry ids, decisions and
// reason codes, never a recorded input value; the inputs of a sample are
// read through EvidenceService.ReplayDecision with its own permission
// (HR-237). One simulation per org is queued or running at a time.
service PolicySimulationService {
  // SimulatePolicyVersion queues a simulation of a stored policy version
  // (a draft, the published one or an earlier one); Team edition.
  // permission: policy.simulate
  rpc SimulatePolicyVersion(SimulatePolicyVersionRequest) returns (SimulatePolicyVersionResponse);
  // GetSimulation returns a simulation and its report so far.
  // permission: policy.simulate
  rpc GetSimulation(GetSimulationRequest) returns (GetSimulationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListSimulations lists the org's simulations, newest first.
  // permission: policy.simulate
  rpc ListSimulations(ListSimulationsRequest) returns (ListSimulationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CancelSimulation stops a queued or running simulation; what it counted
  // so far stays.
  // permission: policy.simulate
  rpc CancelSimulation(CancelSimulationRequest) returns (CancelSimulationResponse);
  // ListSimulationSamples lists a simulation's sample decisions: at most 25
  // per category and operation.
  // permission: policy.simulate
  rpc ListSimulationSamples(ListSimulationSamplesRequest) returns (ListSimulationSamplesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// PolicySimulationState is where a simulation is in its life.
enum PolicySimulationState {
  POLICY_SIMULATION_STATE_UNSPECIFIED = 0;
  POLICY_SIMULATION_STATE_QUEUED = 1;
  POLICY_SIMULATION_STATE_RUNNING = 2;
  POLICY_SIMULATION_STATE_DONE = 3;
  POLICY_SIMULATION_STATE_FAILED = 4;
  POLICY_SIMULATION_STATE_CANCELED = 5;
}

// PolicySimulationCategory is what the version changes about one recorded
// decision.
enum PolicySimulationCategory {
  POLICY_SIMULATION_CATEGORY_UNSPECIFIED = 0;
  POLICY_SIMULATION_CATEGORY_UNCHANGED = 1;
  // NEWLY_DENIED: the version would deny (or cannot authorize).
  POLICY_SIMULATION_CATEGORY_NEWLY_DENIED = 2;
  // NEWLY_HELD: the version would hold for an approval or a step-up.
  POLICY_SIMULATION_CATEGORY_NEWLY_HELD = 3;
  // NEWLY_CONSTRAINED: the version would allow with obligations.
  POLICY_SIMULATION_CATEGORY_NEWLY_CONSTRAINED = 4;
  // NEWLY_ALLOWED: the version would decide less strictly than the
  // recorded decision: expanded exposure.
  POLICY_SIMULATION_CATEGORY_NEWLY_ALLOWED = 5;
  // REASON_CHANGED: as strict, for another decision or reason.
  POLICY_SIMULATION_CATEGORY_REASON_CHANGED = 6;
  // UNEVALUABLE: the recorded decision does not reproduce, or the replay
  // lacks inputs it would need.
  POLICY_SIMULATION_CATEGORY_UNEVALUABLE = 7;
}

message SimulatePolicyVersionRequest {
  string version_id = 1 [(buf.validate.field).string.uuid = true];
  // days is the window, ending now (0: 7 days). It may not reach back
  // past what retention keeps.
  int32 days = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 30
  }];
  // max_evaluations bounds the recorded decisions replayed (0: 10 000).
  int32 max_evaluations = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50000
  }];
  // cohort_id makes it a bulk simulation (Enterprise; G0 M18 D154): only
  // the decisions of the fleet cohort's agents the caller may read now
  // are replayed, under the same caps.
  optional string cohort_id = 4 [(buf.validate.field).string.uuid = true];
}

// PolicySimulationCounts counts recorded decisions by category.
message PolicySimulationCounts {
  int32 unchanged = 1;
  int32 newly_denied = 2;
  int32 newly_held = 3;
  int32 newly_constrained = 4;
  // newly_allowed: expanded exposure.
  int32 newly_allowed = 5;
  int32 reason_changed = 6;
  int32 unevaluable = 7;
}

// PolicySimulationGroup is the counts of one operation or one agent.
message PolicySimulationGroup {
  // key is the operation, or the agent's id.
  string key = 1;
  PolicySimulationCounts counts = 2;
}

// PolicySimulationDay is the decisions newly held on one day (UTC), by
// the day they were recorded.
message PolicySimulationDay {
  // day is YYYY-MM-DD.
  string day = 1;
  int32 newly_held = 2;
}

// PolicySimulationRole is the decisions newly held for one approver role;
// "step_up" for a step-up, "other" when no rule of the version names one.
message PolicySimulationRole {
  string role = 1;
  int32 newly_held = 2;
}

message PolicySimulation {
  string id = 1;
  string version_id = 2;
  // content_digest is the version's content digest (SHA-256, lowercase
  // hex) when the simulation was asked for.
  string content_digest = 3;
  google.protobuf.Timestamp window_start = 4;
  google.protobuf.Timestamp window_end = 5;
  int32 max_evaluations = 6;
  PolicySimulationState state = 7;
  // evaluated is how many recorded decisions it has counted.
  int32 evaluated = 8;
  PolicySimulationCounts counts = 9;
  repeated PolicySimulationGroup by_operation = 10;
  repeated PolicySimulationGroup by_agent = 11;
  // The approval burden forecast: decisions newly held, per day and by
  // required role.
  repeated PolicySimulationDay newly_held_per_day = 12;
  repeated PolicySimulationRole newly_held_by_role = 13;
  // notices flag what needs attention (expanded exposure, unevaluable
  // decisions, a cap reached).
  repeated string notices = 14;
  // limits says what a simulation can and cannot predict.
  string limits = 15;
  string requested_by = 16;
  google.protobuf.Timestamp create_time = 17;
  google.protobuf.Timestamp start_time = 18;
  google.protobuf.Timestamp finish_time = 19;
  // error is why a FAILED simulation stopped.
  string error = 20;
  // cohort_id is a bulk simulation's fleet cohort; empty: the whole org.
  string cohort_id = 21;
  // cohort_agents is how many agents its snapshot holds.
  int32 cohort_agents = 22;
  // by_cohort counts decisions per fleet cohort (key: the cohort id),
  // only for cohorts the caller may read.
  repeated PolicySimulationGroup by_cohort = 23;
}

message SimulatePolicyVersionResponse {
  PolicySimulation simulation = 1;
}

message GetSimulationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetSimulationResponse {
  PolicySimulation simulation = 1;
}

message ListSimulationsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

message ListSimulationsResponse {
  repeated PolicySimulation simulations = 1;
  string next_page_token = 2;
}

message CancelSimulationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelSimulationResponse {
  PolicySimulation simulation = 1;
}

message ListSimulationSamplesRequest {
  string simulation_id = 1 [(buf.validate.field).string.uuid = true];
  // category: only this category (unspecified: every category).
  PolicySimulationCategory category = 2 [(buf.validate.field).enum.defined_only = true];
  // operation: only this operation.
  string operation = 3 [(buf.validate.field).string.max_len = 200];
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 5 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// PolicySimulationSample is one recorded decision and what the version
// would have decided: ids, decisions and reason codes only (HR-237).
message PolicySimulationSample {
  PolicySimulationCategory category = 1;
  string transaction_id = 2;
  int32 evaluation = 3;
  string agent_id = 4;
  string operation = 5;
  string original_decision = 6;
  string original_reason = 7;
  // proposed_decision and proposed_reason are empty when unevaluable.
  string proposed_decision = 8;
  string proposed_reason = 9;
  // limitations are the codes that made it unevaluable.
  repeated string limitations = 10;
}

message ListSimulationSamplesResponse {
  repeated PolicySimulationSample samples = 1;
  string next_page_token = 2;
}
