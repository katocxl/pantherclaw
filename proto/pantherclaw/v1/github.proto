syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// GitHubInstallation is the GitHub App installation behind a connection
// (G0 M8 decision 3, ADR-0021). It is configuration, never a secret: the
// App's key stays sealed to the gateway. An action's repository must belong
// to the account; any other is CANNOT_AUTHORIZE WRONG_ACCOUNT. The
// permissions and repository selection are what was last read from GitHub,
// with when (M9 F048 compares them with what operations use).
message GitHubInstallation {
  // The App's client id (the App JWT's issuer).
  string app_client_id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._-]{1,64}$"];
  // The installation id.
  int64 installation_id = 2 [(buf.validate.field).int64.gt = 0];
  // The account it is installed on: a lowercase GitHub login.
  string account_login = 3 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9-]{0,38}$"];
  // The account's GitHub id, once read.
  int64 account_id = 4;
  // The installation's permissions as last read, by name ("contents":
  // "write").
  map<string, string> permissions = 5;
  // "all" or "selected", as last read; empty before the first read.
  string repository_selection = 6;
  // When the permissions and selection were read.
  google.protobuf.Timestamp read_time = 7;
}

// GitHubService links the org's people to their GitHub accounts (G0 M8,
// HR-207): independence then excludes, by GitHub user id, everyone who
// authored, committed or pushed to a pull request from reviewing it. It
// also scans the GitHub organization behind a GitHub App connection for
// agents, workflows and MCP configuration (PN-001.2, HR-209).
service GitHubService {
  // ProveIdentity links the caller's own GitHub account, or with unlink
  // removes that link, once the server has read from GitHub which account
  // a user access token from GitHub sign-in belongs to: the proof that the
  // caller controls it (G0 M8 P2f, founder decision 2026-10-13). The
  // token is never stored. A GitHub user id links to one person; every
  // change is audited and notified.
  // permission: github.identity.prove
  rpc ProveIdentity(ProveIdentityRequest) returns (ProveIdentityResponse);
  // GetSignIn says where to sign in to GitHub to prove an account: the
  // GitHub App's client id and GitHub's web origin for its device flow
  // (P2f). Unavailable when GitHub sign-in is off.
  // permission: github.identity.prove
  rpc GetSignIn(GetSignInRequest) returns (GetSignInResponse);
  // UnlinkIdentity removes another person's link; nobody removes their own
  // here (ProveIdentity). Audited and notified.
  // permission: github.identity.manage
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  // ListIdentities lists the links, of one person or of everyone.
  // permission: user.read
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  // ExemptAccount registers a GitHub account that is not a person (a bot or
  // a machine user): linked to nobody, it does not stop the independent
  // approvals of pull requests it worked on, as an unlinked person does
  // (GITHUB_PEOPLE_NOT_LINKED; founder decision 2026-10-13). Audited and
  // notified.
  // permission: github.identity.manage
  rpc ExemptAccount(ExemptAccountRequest) returns (ExemptAccountResponse);
  // RemoveExemption removes an account's exemption. Audited and notified.
  // permission: github.identity.manage
  rpc RemoveExemption(RemoveExemptionRequest) returns (RemoveExemptionResponse);
  // ListExemptions lists the org's exemptions (at most 500).
  // permission: user.read
  rpc ListExemptions(ListExemptionsRequest) returns (ListExemptionsResponse);
  // StartOrgScan starts a scan of the GitHub organization behind a GitHub
  // App connection (PN-001.2, HR-209; Team edition): an org_scan lease for
  // the connection's gateway, which reads metadata and named files only and
  // submits what it finds. One scan of a connection runs at a time.
  // permission: github.scan.run
  rpc StartOrgScan(StartOrgScanRequest) returns (StartOrgScanResponse);
  // GetOrgScan returns a scan: its state, its counts, and the sources it
  // read and could not read.
  // permission: github.scan.run
  rpc GetOrgScan(GetOrgScanRequest) returns (GetOrgScanResponse);
  // ListOrgScanFindings lists what a scan found: untrusted observations,
  // recorded as DISCOVERED agents, that grant nothing.
  // permission: github.scan.run
  rpc ListOrgScanFindings(ListOrgScanFindingsRequest) returns (ListOrgScanFindingsResponse);
}

// GitHubIdentity is one person's link to a GitHub account.
message GitHubIdentity {
  // Link id.
  string id = 1;
  // The person.
  string user_id = 2;
  // The GitHub login, as it was when linked (logins can change; the id
  // cannot).
  string github_login = 3;
  // The GitHub user id: what independence compares.
  int64 github_user_id = 4;
  // Who linked it.
  string linked_by = 5;
  // When.
  google.protobuf.Timestamp link_time = 6;
  // When the person proved the account by signing in to GitHub; unset for
  // a link made before P2f, which approves nothing.
  google.protobuf.Timestamp verify_time = 7;
}

// ProveIdentityRequest carries the token of a GitHub sign-in.
message ProveIdentityRequest {
  // A GitHub user access token from the GitHub App's user authorization
  // (the device flow pclaw github link runs).
  string github_user_token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  // Remove the link to that account instead of making it.
  bool unlink = 2;
}

// ProveIdentityResponse returns the link made or removed.
message ProveIdentityResponse {
  // The link.
  GitHubIdentity identity = 1;
}

// GetSignInRequest is empty.
message GetSignInRequest {}

// GetSignInResponse is the GitHub App's device flow.
message GetSignInResponse {
  // The GitHub App's client id.
  string client_id = 1;
  // GitHub's web origin, where device codes are asked for and entered.
  string web_url = 2;
}

// UnlinkIdentityRequest names a link.
message UnlinkIdentityRequest {
  // Link id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// UnlinkIdentityResponse is empty.
message UnlinkIdentityResponse {}

// ListIdentitiesRequest pages through the links.
message ListIdentitiesRequest {
  // Only this person's, when set.
  string user_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Page size (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Page token from the previous page.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

// ListIdentitiesResponse returns a page of links.
message ListIdentitiesResponse {
  // The links, oldest first.
  repeated GitHubIdentity identities = 1;
  // Token of the next page; empty on the last.
  string next_page_token = 2;
}

// GitHubExemption is a GitHub account an admin registered as not a person.
message GitHubExemption {
  // The GitHub user id.
  int64 github_user_id = 1;
  // Its login when exempted (a bot's ends in [bot]).
  string github_login = 2;
  // Why it is not a person.
  string reason = 3;
  // Who exempted it.
  string created_by = 4;
  // When.
  google.protobuf.Timestamp create_time = 5;
}

// ExemptAccountRequest names the account and why it is not a person.
message ExemptAccountRequest {
  // The GitHub user id.
  int64 github_user_id = 1 [(buf.validate.field).int64.gt = 0];
  // Its login.
  string github_login = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 44
  }];
  // Why it is not a person.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

// ExemptAccountResponse returns the exemption.
message ExemptAccountResponse {
  // The exemption.
  GitHubExemption exemption = 1;
}

// RemoveExemptionRequest names the account.
message RemoveExemptionRequest {
  // The GitHub user id.
  int64 github_user_id = 1 [(buf.validate.field).int64.gt = 0];
}

// RemoveExemptionResponse is empty.
message RemoveExemptionResponse {}

// ListExemptionsRequest is empty.
message ListExemptionsRequest {}

// ListExemptionsResponse lists the exemptions by login.
message ListExemptionsResponse {
  // The exemptions.
  repeated GitHubExemption exemptions = 1;
}

// OrgScan is one scan of a GitHub organization (HR-209).
message OrgScan {
  // Scan id.
  string id = 1;
  // The connection whose App and gateway scan.
  string connection_id = 2;
  // PENDING (waiting for its gateway), RUNNING, DONE or FAILED (its lease
  // ran out before a report).
  string state = 3;
  // What was found, by kind (repositories, workflows, mcp_configs, ...).
  map<string, int64> counts = 4;
  // The sources read.
  repeated string scanned = 5;
  // The sources not read, with why: never reported as "none found".
  map<string, string> not_scanned = 6;
  // Who started it.
  string started_by = 7;
  // When.
  google.protobuf.Timestamp create_time = 8;
  // When it finished.
  google.protobuf.Timestamp finish_time = 9;
}

// StartOrgScanRequest names the connection.
message StartOrgScanRequest {
  // A connection holding a GitHub App credential.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
}

// StartOrgScanResponse returns the scan.
message StartOrgScanResponse {
  // The scan, PENDING.
  OrgScan scan = 1;
}

// GetOrgScanRequest names a scan.
message GetOrgScanRequest {
  // Scan id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetOrgScanResponse returns it.
message GetOrgScanResponse {
  // The scan.
  OrgScan scan = 1;
}

// ListOrgScanFindingsRequest pages through a scan's findings.
message ListOrgScanFindingsRequest {
  // Scan id.
  string scan_id = 1 [(buf.validate.field).string.uuid = true];
  // Page size (default 50, at most 200).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Page token from the previous page.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

// OrgScanFinding is one thing a scan found: an UNTRUSTED observation that
// grants nothing, recorded as a DISCOVERED agent.
message OrgScanFinding {
  // The discovered agent.
  string agent_id = 1;
  // github_app, github_workflow or github_mcp_config.
  string kind = 2;
  // UNTRUSTED attributes: names only, never values or arguments.
  map<string, string> attributes = 3;
  // How often scans saw it.
  int64 seen_count = 4;
  // When first and last seen.
  google.protobuf.Timestamp first_seen_time = 5;
  // When last seen.
  google.protobuf.Timestamp last_seen_time = 6;
}

// ListOrgScanFindingsResponse returns a page of findings.
message ListOrgScanFindingsResponse {
  // The findings this scan saw.
  repeated OrgScanFinding findings = 1;
  // Token of the next page; empty on the last.
  string next_page_token = 2;
}
