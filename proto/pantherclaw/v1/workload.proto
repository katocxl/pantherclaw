syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/authority.proto";
import "pantherclaw/v1/grants.proto";
import "pantherclaw/v1/identity.proto";
import "pantherclaw/v1/runs.proto";

// WorkloadService is called by agent workloads (PAP-1 §3–§5, G0 M3). It is
// authenticated by PAP/1, never by user or service-account credentials:
// every call carries a PAP-Proof header signed with the workload's key over
// the method, URL, raw-body hash and a server nonce (PAP-Error use_nonce
// returns one in PAP-Nonce). Enroll and IssueToken use key-only proofs;
// StartChildRun also carries "Authorization: PAP <workload token>". A
// key-only proof shows possession of a key, never an identity (PAP-1 §4).
service WorkloadService {
  // Enroll registers the workload's key as an instance of an agent, with an
  // owner's enrollment token or an attestation token that matches an
  // auto-admitting issuer entry (PAP-1 §3.2). The org comes from the
  // enrollment token or the attestation audience.
  // permission: workload.enroll
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // IssueToken issues a workload token to an admitted instance whose key
  // signed the proof; an attestation token renews L2 (HR-143).
  // permission: workload.token
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
  // StartChildRun starts a child run of the caller's active run. The child
  // inherits the represented principal and cannot outlive its parent.
  // permission: workload.run
  rpc StartChildRun(StartChildRunRequest) returns (StartChildRunResponse);
  // DelegateGrant gives a child run of the caller's run part of the
  // caller's run's grant (HR-045, HR-047, HR-161). The delegated grant must
  // fit inside its parent and every guardrail, expire no later than its
  // parent and stay within the depth, fan-out and lifetime caps. The child
  // shares its ancestors' budgets and may set smaller limits of its own.
  // permission: workload.delegate
  rpc DelegateGrant(DelegateGrantRequest) returns (DelegateGrantResponse);
  // Wait long-polls a held transaction of the caller's run (the wait handle
  // is the transaction id, G0 M5 part 2 design decision 15). It answers as
  // soon as the state differs from known_state, or after at most 30
  // seconds, with states, codes and times only: never approver identities,
  // notes or the display (HR-174). Waiting never extends a deadline or
  // dispatches anything; on READY the agent resubmits the identical action.
  // At most 4 waits per instance and 1,000 per server run at once
  // (ResourceExhausted with a retry time beyond them).
  // permission: workload.run
  rpc Wait(WaitRequest) returns (WaitResponse);
  // SubmitEvidence adds an UNTRUSTED note to the open approval request of a
  // held transaction of the caller's run (HR-172). It never changes the
  // binding; an EVIDENCE_REQUESTED request returns to PENDING.
  // permission: workload.run
  rpc SubmitEvidence(SubmitEvidenceRequest) returns (SubmitEvidenceResponse);
  // RequestAccess files an access request for the caller's run's grant,
  // citing one of the run's denials whose decisive reason is about scope
  // (decision 10). At most 3 per run; the note is UNTRUSTED. It grants
  // nothing (HR-176).
  // permission: workload.run
  rpc RequestAccess(WorkloadServiceRequestAccessRequest) returns (WorkloadServiceRequestAccessResponse);
}

// AttestationKind names the preset an attestation token is for.
enum AttestationKind {
  ATTESTATION_KIND_UNSPECIFIED = 0;
  // A GitHub Actions OIDC token.
  ATTESTATION_KIND_GITHUB_ACTIONS = 1;
  // A Kubernetes projected service-account token.
  ATTESTATION_KIND_KUBERNETES = 2;
  // A GitLab CI ID token (id_tokens with aud pantherclaw:<org>).
  ATTESTATION_KIND_GITLAB_CI = 3;
  // A SPIFFE JWT-SVID (aud pantherclaw:<org>).
  ATTESTATION_KIND_SPIFFE_JWT = 4;
  // A Google-signed ID token from the GCP metadata server (audience
  // pantherclaw:<org>, format=full).
  ATTESTATION_KIND_GCP_WORKLOAD = 5;
  // A SigV4-signed sts:GetCallerIdentity request that PantherClaw sends to
  // STS (signed X-Pantherclaw-Audience: pantherclaw:<org>).
  ATTESTATION_KIND_AWS_IAM = 6;
}

// Attestation is a platform token offered as L2 evidence. It is verified,
// consumed (single use) and never stored or logged.
message Attestation {
  // Which preset verifies it.
  AttestationKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The token (JWS compact form).
  string token = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 16384
  }];
}

// EnrollRequest enrolls the key that signed the request proof.
message EnrollRequest {
  // pce_ enrollment token from the agent's owner; empty when an attestation
  // matches an auto-admitting issuer entry.
  string enrollment_token = 1 [(buf.validate.field).string.max_len = 128];
  // The workload's public JWK; must be the key in the proof header.
  string public_jwk = 2 [(buf.validate.field).string = {
    min_len: 2
    max_len: 4096
  }];
  // Optional platform attestation.
  Attestation attestation = 3;
  // Release digest the workload reports about itself; always "declared".
  string declared_release_digest = 4 [(buf.validate.field).string.pattern = "^(sha256:[0-9a-f]{64})?$"];

  option (buf.validate.message).cel = {
    id: "enroll_evidence"
    message: "an enrollment token or an attestation is required"
    expression: "this.enrollment_token != '' || has(this.attestation)"
  };
}

// EnrollResponse describes the new instance.
message EnrollResponse {
  // Instance id.
  string instance_id = 1;
  // PAP/1 identifier: pc:org/<org>/agent/<agent>/inst/<instance>.
  string identifier = 2;
  // PENDING_ADMISSION (waiting for the owner) or ADMITTED (auto-admitted).
  InstanceState state = 3;
  // Fingerprint (RFC 7638 thumbprint) to show the owner.
  string fingerprint = 4;
  // Attestation level, once admitted.
  int32 attestation_level = 5;
}

// IssueTokenRequest asks for a workload token.
message IssueTokenRequest {
  // The instance's PAP/1 identifier.
  string identifier = 1 [(buf.validate.field).string = {
    max_len: 200
    pattern: "^pc:org/[0-9a-f-]{36}/agent/[0-9a-f-]{36}/inst/[0-9a-f-]{36}$"
  }];
  // Optional fresh attestation to keep or reach L2; it must match the
  // binding the instance enrolled with (HR-147).
  Attestation attestation = 2;
  // Release digest the workload reports about itself; always "declared".
  string declared_release_digest = 3 [(buf.validate.field).string.pattern = "^(sha256:[0-9a-f]{64})?$"];
}

// IssueTokenResponse returns a workload token.
message IssueTokenResponse {
  // Workload token (pap-wt+jwt), valid at most 10 minutes and never past the
  // attestation behind its level.
  string workload_token = 1;
  // Expiry time.
  google.protobuf.Timestamp expire_time = 2;
  // Attestation level in the token.
  int32 attestation_level = 3;
}

// StartChildRunRequest starts a child run.
message StartChildRunRequest {
  // The caller's active run; it must be bound to the caller's instance.
  string parent_run_id = 1 [(buf.validate.field).string.uuid = true];
  // Agent of the child run.
  string agent_id = 2 [(buf.validate.field).string.uuid = true];
  // Optional instance to bind.
  optional string instance_id = 3 [(buf.validate.field).string.uuid = true];
  // UNTRUSTED task label.
  string task_ref = 4 [(buf.validate.field).string.max_len = 256];
  // Lifetime in minutes (default and maximum: the parent's remaining time).
  int32 ttl_minutes = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1440
  }];
}

// StartChildRunResponse returns the child run.
message StartChildRunResponse {
  // The run.
  Run run = 1;
}

// DelegateGrantRequest delegates part of the caller's run's grant.
message DelegateGrantRequest {
  // The caller's active run; it must be bound to the caller's instance and
  // have a grant that allows delegation.
  string run_id = 1 [(buf.validate.field).string.uuid = true];
  // The child run (from StartChildRun); it must not have a grant yet.
  string child_run_id = 2 [(buf.validate.field).string.uuid = true];
  // UNTRUSTED task label.
  string task_ref = 3 [(buf.validate.field).string.max_len = 256];
  // Valid until (default and maximum: the parent's expiry, and at most 24
  // hours).
  google.protobuf.Timestamp expire_time = 4;
  // Bounds (grant bounds v1, JSON); at most the parent's.
  bytes bounds = 5 [(buf.validate.field).bytes = {
    min_len: 2
    max_len: 65536
  }];
  // Requirements (JSON array); the parent's always apply as well.
  bytes requirements = 6 [(buf.validate.field).bytes.max_len = 65536];
  // The child's own limits (JSON); its ancestors' still apply.
  bytes limits = 7 [(buf.validate.field).bytes.max_len = 65536];
  // Delegation settings; depth below the parent's.
  GrantDelegation delegation = 8;
  // Lowest attestation level (0-2); at least the parent's.
  int32 min_attestation_level = 9 [(buf.validate.field).int32 = {
    gte: 0
    lte: 2
  }];
}

// DelegateGrantResponse returns the delegated grant.
message DelegateGrantResponse {
  // The grant, bound to the child run.
  Grant grant = 1;
}

// WaitRequest waits on a held transaction.
message WaitRequest {
  // The caller's run; it must be bound to the caller's instance.
  string run_id = 1 [(buf.validate.field).string.uuid = true];
  // The wait handle (the transaction id).
  string handle = 2 [(buf.validate.field).string.uuid = true];
  // Answer at once when the state differs from this one (unspecified:
  // answer at once).
  WaitState known_state = 3 [(buf.validate.field).enum.defined_only = true];
  // How long to wait at most, in seconds (default and maximum 30).
  int32 timeout_seconds = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 30
  }];
}

// WaitResponse returns the state.
message WaitResponse {
  // The wait handle with the current state.
  WaitInfo wait = 1;
  // Whether the wait ended because the timeout passed, not because the
  // state changed.
  bool timed_out = 2;
}

// SubmitEvidenceRequest adds evidence from the workload.
message SubmitEvidenceRequest {
  // The caller's run; it must be bound to the caller's instance.
  string run_id = 1 [(buf.validate.field).string.uuid = true];
  // The wait handle (the transaction id).
  string handle = 2 [(buf.validate.field).string.uuid = true];
  // The note (UNTRUSTED, at most 4 KiB).
  string note = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
}

// SubmitEvidenceResponse returns the state.
message SubmitEvidenceResponse {
  // The evidence id.
  string evidence_id = 1;
  // The wait handle with the current state.
  WaitInfo wait = 2;
}

// WorkloadServiceRequestAccessRequest files an access request from the
// workload.
message WorkloadServiceRequestAccessRequest {
  // The caller's run; it must be bound to the caller's instance.
  string run_id = 1 [(buf.validate.field).string.uuid = true];
  // A transaction of the run that was denied for scope.
  string transaction_id = 2 [(buf.validate.field).string.uuid = true];
  // What is needed and why: UNTRUSTED (at most 4 KiB).
  string note = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
}

// WorkloadServiceRequestAccessResponse returns the waitlist entry's id.
message WorkloadServiceRequestAccessResponse {
  // The ACCESS_REQUEST entry (an open one for the same grant is returned
  // instead of a new one).
  string entry_id = 1;
  // Its deadline.
  google.protobuf.Timestamp deadline_time = 2;
}
