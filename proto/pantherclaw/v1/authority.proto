syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// AuthorityService is the Transaction Authority's gateway-facing API
// (PAP-1 §7). Only authenticated gateways may call it; the org always comes
// from the gateway's credential, never from the request.
service AuthorityService {
  // Authorize decides on one canonical action. On ALLOW it returns a
  // single-use dispatch permit.
  // permission: gateway.authorize
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  // BeginDispatch is the commit point immediately before the gateway sends
  // any byte to the target. Any error means: do not dispatch.
  // permission: gateway.dispatch
  rpc BeginDispatch(BeginDispatchRequest) returns (BeginDispatchResponse);
  // RecordExecution records the outcome of one dispatched permit.
  // permission: gateway.dispatch
  rpc RecordExecution(RecordExecutionRequest) returns (RecordExecutionResponse);
  // GetNonce returns the org's current PAP/1 nonce, which the gateway
  // serves to workloads in PAP-Nonce headers (HR-091).
  // permission: gateway.authorize
  rpc GetNonce(GetNonceRequest) returns (GetNonceResponse);
  // ReportUnknownWorkload reports a request whose key-only proof verified
  // but whose key is not an admitted instance (PAP-1 §4). The Authority
  // re-verifies the proof and records a capped, deduplicated discovery
  // (HR-148). The request itself is refused.
  // permission: gateway.observe
  rpc ReportUnknownWorkload(ReportUnknownWorkloadRequest) returns (ReportUnknownWorkloadResponse);
  // VerifyWorkload checks a workload's PAP/1 credentials for a request
  // that decides nothing, such as an MCP `tools/list` or `server/discover`
  // (HR-021: the gateway never verifies a workload itself). The proof is
  // consumed like any other; nothing is decided or recorded.
  // permission: gateway.authorize
  rpc VerifyWorkload(VerifyWorkloadRequest) returns (VerifyWorkloadResponse);
}

// Decision is an authorization decision (PAP-1 §7.1).
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_ALLOW_WITH_OBLIGATIONS = 2;
  DECISION_REQUIRE_APPROVAL = 3;
  DECISION_REQUIRE_STEP_UP = 4;
  DECISION_DENY = 5;
  DECISION_CANNOT_AUTHORIZE = 6;
}

// Reason explains one checklist outcome.
message Reason {
  // Stable machine code, for example GRANT_AMOUNT_EXCEEDED. Holds add
  // APPROVAL_DECLINED, APPROVAL_EXPIRED, NARROWER_PROPOSED,
  // HOLD_LIMIT_REACHED, STEP_UP_SUBJECT_NOT_A_PERSON and
  // REQUIREMENT_INVALID (G0 M5 part 2).
  string code = 1;
  // Pipeline step that produced it.
  string check = 2;
  // Human-readable detail (never contains agent-supplied text).
  string detail = 3;
  // Whether this reason decided the outcome.
  bool decisive = 4;
}

// AuthorizeRequest carries the action as canonical ActionIR JSON bytes, so
// both sides hash exactly the same bytes.
message AuthorizeRequest {
  // RFC 8785 canonical ActionIR v1.
  bytes action_ir = 1 [(buf.validate.field).bytes = {
    min_len: 2
    max_len: 1048576
  }];
  // The workload's PAP/1 credentials as the gateway received them; the
  // Authority re-verifies them itself (PAP-1 §7.1, HR-021).
  WorkloadCredentials workload = 2;
}

// AuthorizeResponse is the decision.
message AuthorizeResponse {
  // The decision.
  Decision decision = 1;
  // Server-minted transaction id (empty when the action could not be bound).
  string transaction_id = 2;
  // Hex SHA-256 of the canonical action.
  string action_hash = 3;
  // Decisive reason first.
  repeated Reason reasons = 4;
  // Dispatch permit JWS; only for a fresh ALLOW.
  string permit = 5;
  // Permit id (the permit's jti).
  string permit_id = 6;
  // Containment epoch the permit was issued under.
  int64 epoch = 7;
  // Signed decision receipt JWS.
  string receipt = 8;
  // The org's current PAP/1 nonce, for the PAP-Nonce response header.
  string nonce = 9;
  // The full checklist: one item per check of the ten steps, decisive item
  // first (F078, F092). Never contains agent-supplied text.
  repeated ChecklistItem checklist = 10;
  // Obligations the gateway must apply (ALLOW_WITH_OBLIGATIONS).
  repeated Obligation obligations = 11;
  // Hex SHA-256 of the effective action, when an obligation clamps a
  // parameter (F104, F107); empty otherwise. The gateway dispatches the
  // effective action (M6).
  string effective_action_hash = 12;
  // Decision-basis digest ("sha256:" and 64 hex digits): the policy
  // version, grant chain and guardrail revisions, definition digest and
  // facts digest the decision used. Approvals bind it (HR-030).
  string decision_basis_digest = 13;
  // Evaluation number of this decision for the (run, action), from 1. An
  // open decision (REQUIRE_*, CANNOT_AUTHORIZE) is evaluated again on
  // retry (HR-006).
  int32 evaluation = 14;
  // Whether this answer is a stored decision returned for a repeat
  // (HR-005), not a new evaluation.
  bool repeat = 15;
  // The wait handle of a held action (REQUIRE_APPROVAL, REQUIRE_STEP_UP),
  // and the state of its approval request (PAP-1 §8, G0 M5 part 2).
  WaitInfo wait = 16;
  // How the action's route treats this decision (G0 M6, PN-013). In
  // monitor mode the decision is hypothetical: nothing is reserved, and a
  // permit is returned whatever the decision unless identity or containment
  // failed (HR-184). The permit, not the decision, then says whether to
  // dispatch.
  DispatchMode mode = 17;
  // Access mode of the action's connection (F416), for the gateway's
  // execution record.
  string access_mode = 18;
}

// WaitState is the state of a held action's approval request as a waiter
// sees it (HR-174): states, codes and times only.
enum WaitState {
  WAIT_STATE_UNSPECIFIED = 0;
  // Waiting for deciders.
  WAIT_STATE_PENDING = 1;
  // A decider asked for evidence (WorkloadService.SubmitEvidence).
  WAIT_STATE_EVIDENCE_REQUESTED = 2;
  // Approved: resubmit the identical action before consume_by_time.
  WAIT_STATE_READY = 3;
  // Declined: the action ends as DENY (APPROVAL_DECLINED).
  WAIT_STATE_DECLINED = 4;
  // A decider proposed narrower parameters: the action ends as DENY
  // (NARROWER_PROPOSED); proposed_params may be submitted as a new action.
  WAIT_STATE_NARROWER_PROPOSED = 5;
  // The deadline, the evidence deadline or the consume-by time passed: the
  // action ends as DENY (APPROVAL_EXPIRED).
  WAIT_STATE_EXPIRED = 6;
  // The binding changed; resubmitting decides again.
  WAIT_STATE_SUPERSEDED = 7;
  // Something material changed (a revoked grant, a suspended agent, the
  // kill switch); resubmitting decides again.
  WAIT_STATE_INVALIDATED = 8;
  // The approval was used by a resubmission that received its permit.
  WAIT_STATE_CONSUMED = 9;
}

// WaitInfo is a wait handle (PAP-1 §7.1, §8). The handle is the
// transaction id (design decision 15): not a secret, because waiting needs
// PAP/1 authentication as the transaction's run and instance. Waiting never
// extends a deadline or dispatches anything (HR-174).
message WaitInfo {
  // The handle: the transaction id.
  string handle = 1;
  // Seconds to wait before waiting again or resubmitting.
  int32 retry_after_seconds = 2;
  // The hold's deadline.
  google.protobuf.Timestamp deadline_time = 3;
  // The state.
  WaitState state = 4;
  // READY: resubmit before this time.
  google.protobuf.Timestamp consume_by_time = 5;
  // The approval request, for the link people open (/approvals/{id}).
  string approval_request_id = 6;
  // A stable code: why the request ended (APPROVAL_DECLINED,
  // APPROVAL_EXPIRED, NARROWER_PROPOSED, BINDING_CHANGED, GRANT_REVOKED, …),
  // or the evidence question (EVIDENCE_REQUESTED). Never a decider's note.
  string code = 7;
  // EVIDENCE_REQUESTED: when the evidence is due.
  google.protobuf.Timestamp evidence_deadline_time = 8;
  // NARROWER_PROPOSED: the proposed canonical parameters (JSON).
  bytes proposed_params = 9;
}

// DispatchMode is how a route treats decisions (PN-013).
enum DispatchMode {
  DISPATCH_MODE_UNSPECIFIED = 0;
  // Every decision is enforced.
  DISPATCH_MODE_ENFORCE = 1;
  // Decisions are recorded as hypothetical and never block; containment
  // still does (HR-184).
  DISPATCH_MODE_MONITOR = 2;
}

// ChecklistStatus is the outcome of one checklist item.
enum ChecklistStatus {
  CHECKLIST_STATUS_UNSPECIFIED = 0;
  CHECKLIST_STATUS_PASSED = 1;
  CHECKLIST_STATUS_FAILED = 2;
  // Evidence (a fact, a definition) is missing or stale.
  CHECKLIST_STATUS_MISSING = 3;
  // An approval or step-up is required.
  CHECKLIST_STATUS_REQUIRED = 4;
  // An obligation constrains the action.
  CHECKLIST_STATUS_CONSTRAINED = 5;
  // Informational (ANNOTATE rules).
  CHECKLIST_STATUS_ANNOTATED = 6;
  // Depends on a check that failed.
  CHECKLIST_STATUS_NOT_EVALUATED = 7;
  CHECKLIST_STATUS_NOT_APPLICABLE = 8;
}

// ChecklistItem is one check of the decision pipeline.
message ChecklistItem {
  // Step, 1-10 (ARCHITECTURE §6.1).
  int32 step = 1;
  // Check name, for example "authority".
  string check = 2;
  // Outcome.
  ChecklistStatus status = 3;
  // Stable reason code.
  string code = 4;
  // Detail (never agent-supplied text).
  string detail = 5;
  // The grant or guardrail level it concerns, for example "grant
  // <id>@<revision>"; empty when none.
  string level = 6;
  // Whether this item decided the outcome.
  bool decisive = 7;
}

// Obligation is a constraint the gateway applies before dispatch.
message Obligation {
  // The policy rule that set it.
  string rule = 1;
  // Kind, for example "amount_max" or "allowed_values".
  string kind = 2;
  // Parameter it applies to.
  string param = 3;
  // Maximum (decimal string), for a maximum.
  string max = 4;
  // Allowed values, for a set.
  repeated string values = 5;
  // Whether the parameter was clamped to fit (the effective action differs
  // from the requested one).
  bool clamp = 6;
  // When it applies, for example "before_execution" (F071).
  string timing = 7;
}

// BeginDispatchRequest moves a permit to DISPATCHING.
message BeginDispatchRequest {
  // Permit id from the permit's jti.
  string permit_id = 1 [(buf.validate.field).string.uuid = true];
  // Epoch carried by the permit.
  int64 epoch = 2 [(buf.validate.field).int64.gt = 0];
  // The outbound request the gateway built and is about to send (PAP-1
  // §7.3): method, URL and the SHA-256 of the exact body. Empty for
  // cooperative channels, where the gateway sends nothing.
  string outbound_method = 3 [(buf.validate.field).string.pattern = "^([A-Z]{3,7})?$"];
  // Outbound URL.
  string outbound_url = 4 [(buf.validate.field).string.max_len = 4096];
  // SHA-256 of the outbound body.
  bytes outbound_body_sha256 = 5 [(buf.validate.field).bytes = {
    max_len: 32
  }];
}

// BeginDispatchResponse confirms the commit point.
message BeginDispatchResponse {
  // For a target-enforced connection: the single-use PAP-Action token
  // (PAP-1 §10, HR-188), bound to outbound_body_sha256. Empty otherwise.
  string action_token = 1;
}

// Outcome of a dispatch (PAP-1 §7.4).
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_ACCEPTED = 1;
  OUTCOME_FAILED = 2;
  OUTCOME_UNKNOWN = 3;
  // A cooperative channel (hook, SDK authorize): the agent performs the
  // allowed action itself and the gateway sends nothing; reservations are
  // committed as if it happened (PAP-1 §7.4, HR-186).
  OUTCOME_DELEGATED = 4;
}

// RecordExecutionRequest reports what happened at the target.
message RecordExecutionRequest {
  // Permit id.
  string permit_id = 1 [(buf.validate.field).string.uuid = true];
  // Outcome; UNSPECIFIED is rejected.
  Outcome outcome = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // HTTP status from the target, 0 when none was received.
  int32 target_status = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 599
  }];
  // SHA-256 of the target response body, empty when none was received.
  bytes response_digest = 4 [(buf.validate.field).bytes = {
    max_len: 32
  }];
  // Time spent dispatching, in milliseconds.
  int32 dispatch_ms = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 600000
  }];
  // The identifier of what the target created, read from a 2xx response at
  // the place the definition's verifier names (G0 M7, PAP-1 §7.4); empty
  // when there is none. The Authority keeps it only when it matches the
  // verifier read's target pattern. It is the only part of a response body
  // the gateway sends.
  string target_ref = 6 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^[!-~]*$"
  }];
}

// RecordExecutionResponse returns the execution receipt.
message RecordExecutionResponse {
  // Signed execution receipt JWS.
  string receipt = 1;
}

// WorkloadCredentials are a workload's PAP/1 request credentials as the
// gateway received them (PAP-1 §4). The gateway hashes the raw body before
// parsing it; the Authority verifies everything again.
message WorkloadCredentials {
  // Workload token from "Authorization: PAP <token>"; empty for a key-only
  // proof.
  string workload_token = 1 [(buf.validate.field).string.max_len = 8192];
  // PAP-Proof header value.
  string proof = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 8192
  }];
  // SHA-256 of the raw request body, computed before any parsing.
  bytes body_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  // HTTP method of the workload's request.
  string htm = 4 [(buf.validate.field).string.pattern = "^[A-Z]{3,7}$"];
  // Target URI of the workload's request (scheme, host, path), from the
  // gateway's configured public URL, never from the Host header.
  string htu = 5 [(buf.validate.field).string = {
    max_len: 2048
    uri: true
  }];
  // UNTRUSTED client address as the gateway saw it (HR-092 network alert).
  string client_address = 6 [(buf.validate.field).string.max_len = 64];
}

// GetNonceRequest asks for the current nonce.
message GetNonceRequest {}

// GetNonceResponse returns it.
message GetNonceResponse {
  // Current nonce.
  string nonce = 1;
  // When it stops being accepted.
  google.protobuf.Timestamp expire_time = 2;
}

// ReportUnknownWorkloadRequest reports an unidentified request.
message ReportUnknownWorkloadRequest {
  // The request's key-only PAP/1 credentials (no workload token).
  WorkloadCredentials workload = 1 [(buf.validate.field).required = true];
  // UNTRUSTED user agent, truncated by the gateway.
  string user_agent = 2 [(buf.validate.field).string.max_len = 256];
  // Route the request was addressed to.
  string route = 3 [(buf.validate.field).string.max_len = 128];
}

// ReportUnknownWorkloadResponse says what was recorded.
message ReportUnknownWorkloadResponse {
  // Discovery id; empty when the sighting was only counted (rate or cap
  // reached).
  string discovery_id = 1;
  // Current nonce, for the PAP-Nonce response header.
  string nonce = 2;
}

// VerifyWorkloadRequest carries a request's PAP/1 credentials.
message VerifyWorkloadRequest {
  // The request's credentials, as for Authorize.
  WorkloadCredentials workload = 1 [(buf.validate.field).required = true];
  // Optional run (PAP-Run-Id) the request is made in: the instance must be
  // allowed to use it, as for an action (HR-022), and the response says
  // when it expires. An MCP session lives on a run.
  string run_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// VerifyWorkloadResponse says whether the workload is an admitted instance
// of a usable agent.
message VerifyWorkloadResponse {
  // Whether the credentials verified and the agent is usable.
  bool verified = 1;
  // When not verified: the PAP-Error code (PAP-1 §12, `run_mismatch` for a
  // run the instance may not use), or `agent_unusable` for a suspended or
  // retired agent.
  string error_code = 2;
  // The verified instance and its environment.
  string instance_id = 3;
  string environment_id = 4;
  // Current nonce, for the PAP-Nonce response header.
  string nonce = 5;
  // RFC 7638 thumbprint of the key that signed the request.
  string jkt = 6;
  // When the requested run expires; unset when no run was named.
  google.protobuf.Timestamp run_expires_at = 7;
}
