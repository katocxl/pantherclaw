syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/connectors.proto";
import "pantherclaw/v1/github.proto";

// ConnectionService manages connections: one target (an HTTP API, a remote
// MCP server, or the agent's own machine for hooks) served by one gateway
// through one tool package (G0 M6). Each package route of a connection runs
// in monitor or enforce mode (PN-013). Credentials are sealed on the
// caller's machine to the gateway's broker key; the server stores only the
// sealed bytes and never returns them (HR-060, HR-061, HR-182). Changes that
// weaken enforcement need a person and are audited; changes that strengthen
// it apply at once (HR-183).
service ConnectionService {
  // CreateConnection registers a connection. Its routes start in its
  // default mode, monitor unless enforce is asked for.
  // permission: connection.manage
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  // GetConnection returns a connection with its route modes and its active
  // credential's metadata.
  // permission: connection.read
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListConnections lists the org's connections.
  // permission: connection.read
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateConnection changes the fields that are set, at the revision the
  // caller read. Changing the target, hosts, gateway, package or access
  // mode, or lowering the default mode to monitor, is a weakening change.
  // permission: connection.manage
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);
  // SetRouteMode sets one route's mode; enforce to monitor is a weakening
  // change.
  // permission: connection.manage
  rpc SetRouteMode(SetRouteModeRequest) returns (SetRouteModeResponse);
  // QuarantineConnection stops every action through a connection at once.
  // permission: connection.manage
  rpc QuarantineConnection(QuarantineConnectionRequest) returns (QuarantineConnectionResponse);
  // RestoreConnection lifts a quarantine (a weakening change).
  // permission: connection.manage
  rpc RestoreConnection(RestoreConnectionRequest) returns (RestoreConnectionResponse);
  // RetireConnection ends a connection for good and revokes its credential.
  // permission: connection.manage
  rpc RetireConnection(RetireConnectionRequest) returns (RetireConnectionResponse);
  // GetSealingKey returns what `pclaw seal` needs: the active broker key of
  // the connection's gateway and the values a seal must bind.
  // permission: credential.seal
  rpc GetSealingKey(GetSealingKeyRequest) returns (GetSealingKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PutCredential stores a sealed credential as the connection's next
  // version; the previous version is superseded.
  // permission: credential.seal
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  // ListCredentials lists a connection's credentials (metadata only).
  // permission: connection.read
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeCredential revokes the active credential at once.
  // permission: connection.manage
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  // GetConnectionCapabilities returns what a connection declares it
  // supports: discovery, observation, enforcement and response, its
  // operations, permissions with reasons, limits, failure behavior and its
  // last successful test (F346). It is a declared capability, never
  // coverage: what a target declares is not evidence until a test shows it
  // (HR-210).
  // permission: connection.read
  rpc GetConnectionCapabilities(GetConnectionCapabilitiesRequest) returns (GetConnectionCapabilitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // TestConnection tests a connection and records the result; the latest
  // passed test is its last successful test (F350, F354). A credential test
  // checks what the connection depends on (its state, its gateway and the
  // gateway's certificate, its pinned package and routes, its credential,
  // its circuits) without calling the target, and finishes at once. A read
  // test leases the package's one harmless test read (an HTTP GET with no
  // required params) to the connection's gateway and is PENDING until the
  // gateway reports: never a write.
  // permission: connection.test
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  // GetConnectionHealth returns what a person needs to judge a connection
  // (F358): its circuits, the permissions its credential is used for, its
  // latest and last successful tests, its delivery failures over the last
  // 24 hours and, for a caller who may read agents, the agents that used it
  // over the last 30 days.
  // permission: connection.read
  rpc GetConnectionHealth(GetConnectionHealthRequest) returns (GetConnectionHealthResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListConnectionInventory lists what the connection's gateway found its
  // upstream MCP server listing (F352, G0 M15 D23): tools, resources and
  // resource templates, each NEW until a reviewed package version covers
  // it. A NEW item is inert: never served, listed to agents or dispatched
  // (HR-414). Descriptions are the upstream server's UNTRUSTED text
  // (HR-415).
  // permission: connection.read
  rpc ListConnectionInventory(ListConnectionInventoryRequest) returns (ListConnectionInventoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // DismissInventoryItem dismisses a NEW inventory item with a reason; its
  // review entry closes REJECTED (HR-417). The item stays inert.
  // permission: connection.manage
  rpc DismissInventoryItem(DismissInventoryItemRequest) returns (DismissInventoryItemResponse);
  // DraftPackageFromInventory generates an unsigned draft package from NEW
  // inventory items (Team edition and above). The draft fails manifest
  // validation until a person fills in what todo lists, and it enters only
  // through the normal signature check and tool review (HR-416). The
  // server never signs it.
  // permission: package.import
  rpc DraftPackageFromInventory(DraftPackageFromInventoryRequest) returns (DraftPackageFromInventoryResponse);
}

// ConnectionKind is what a connection reaches.
enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  // An HTTP API; the gateway dispatches re-serialized requests.
  CONNECTION_KIND_HTTP = 1;
  // A remote MCP server over Streamable HTTP (opaque: PARTIAL, HR-086).
  CONNECTION_KIND_MCP = 2;
  // The agent's own machine (hooks); the gateway never dispatches.
  CONNECTION_KIND_LOCAL = 3;
  // A third-party stdio MCP server a customer-hosted gateway runs in a
  // container (G0 M9; HR-084): no base URL, no credential of its own.
  CONNECTION_KIND_MCP_CONTAINER = 9;
  // A Postgres database the gateway queries with structured, read-only
  // queries built from the reviewed manifest (G0 M14 D15); pantherclaw_held
  // only.
  CONNECTION_KIND_POSTGRES = 10;
  // A peer agent reached over the A2A protocol, its agent card pinned
  // (G0 M14 D30); pantherclaw_held only.
  CONNECTION_KIND_A2A = 11;
}

// ConnectionState is whether actions may use a connection.
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_ACTIVE = 1;
  // Stopped by a person, the circuit breaker or the kill switch's scope;
  // see quarantine_reason.
  CONNECTION_STATE_QUARANTINED = 2;
  CONNECTION_STATE_RETIRED = 3;
}

// RouteMode is how a route treats decisions (PN-013).
enum RouteMode {
  ROUTE_MODE_UNSPECIFIED = 0;
  // Observe and record a hypothetical decision; never block on policy and
  // never claim prevention.
  ROUTE_MODE_MONITOR = 1;
  // Enforce every decision.
  ROUTE_MODE_ENFORCE = 2;
}

// AccessMode is how the target's credential is held (F416).
enum AccessMode {
  ACCESS_MODE_UNSPECIFIED = 0;
  // The gateway holds a sealed credential and injects it.
  ACCESS_MODE_PANTHERCLAW_HELD = 1;
  // The agent holds its own credential (PARTIAL).
  ACCESS_MODE_AGENT_HELD = 2;
  // The target verifies PAP action tokens (PN-002.6).
  ACCESS_MODE_TARGET_ENFORCED = 3;
  // No credential (local connections, open APIs).
  ACCESS_MODE_NONE = 4;
}

// DestinationClass classifies a connection's target (HR-079).
enum DestinationClass {
  DESTINATION_CLASS_UNSPECIFIED = 0;
  DESTINATION_CLASS_PUBLIC = 1;
  DESTINATION_CLASS_INTERNAL = 2;
}

// SealedCredentialState is whether a credential version is used.
enum SealedCredentialState {
  SEALED_CREDENTIAL_STATE_UNSPECIFIED = 0;
  SEALED_CREDENTIAL_STATE_ACTIVE = 1;
  SEALED_CREDENTIAL_STATE_SUPERSEDED = 2;
  SEALED_CREDENTIAL_STATE_REVOKED = 3;
}

// Connection is one connection.
message Connection {
  // Connection id.
  string id = 1;
  // Name, unique among live connections; agents use it in gateway paths.
  string name = 2;
  // Kind.
  ConnectionKind kind = 3;
  // Gateway that serves it.
  string gateway_id = 4;
  // Tool package; the org's pinned version applies.
  string package = 5;
  // Base URL (scheme, host and port), empty for local connections.
  string base_url = 6;
  // Hosts a credential may be sent to.
  repeated string allowed_hosts = 7;
  // Destination class.
  DestinationClass destination_class = 8;
  // Access mode.
  AccessMode access_mode = 9;
  // Header a credential goes in, and its optional scheme.
  string credential_header = 10;
  // Credential scheme, for example "Bearer".
  string credential_scheme = 11;
  // Mode of routes without an explicit mode.
  RouteMode default_mode = 12;
  // Explicit route modes.
  repeated ConnectionRoute routes = 13;
  // Response cap in bytes.
  int32 max_response_bytes = 14;
  // Dispatch timeout in milliseconds.
  int32 timeout_ms = 15;
  // State.
  ConnectionState state = 16;
  // Why it is quarantined (a reason code).
  string quarantine_reason = 17;
  // Revision; UpdateConnection must name the current one.
  int32 revision = 18;
  // Who created it and when.
  string created_by = 19;
  // When it was created.
  google.protobuf.Timestamp create_time = 20;
  // Who changed it last and when.
  string updated_by = 21;
  // When it was changed last.
  google.protobuf.Timestamp update_time = 22;
  // agent_hosts are the host names agents use for this connection's API
  // (G0 M9): a containment sandbox's edge maps each to it (HR-183).
  repeated string agent_hosts = 28;
  // connector is an mcp_container connection's current spec.
  ConnectorSpec connector = 29;
  // The GitHub App installation behind a connection holding a GitHub App
  // credential (G0 M8, ADR-0021); unset otherwise.
  GitHubInstallation github = 24;
  // Whether the connection is simulated (G0 M12, HR-221): it points only at a
  // simulator, and only range agents' runs may use it.
  bool simulated = 30;
  // postgres is a postgres connection's configuration and manifest.
  PostgresConfig postgres = 31;
  // a2a is an a2a connection's configuration and pinned card.
  A2AConfig a2a = 32;
}

// PostgresConfig is a postgres connection (G0 M14 D15): where the database
// is and the reviewed manifest of what the gateway may read. Its password
// is the connection's sealed static credential. Identifiers are lower-case
// and never quoted. A widening change of the manifest (a new table or
// column, a class lowered, a limit raised) needs a step-up.
message PostgresConfig {
  // Database host name or address.
  string host = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
    pattern: "^[A-Za-z0-9]([A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?$"
  }];
  // Port (default 5432).
  int32 port = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 65535
  }];
  // Database name.
  string database = 3 [(buf.validate.field).string.pattern = "^[a-z_][a-z0-9_]{0,62}$"];
  // Role the gateway logs in as.
  string user = 4 [(buf.validate.field).string.pattern = "^[a-z_][a-z0-9_]{0,62}$"];
  // "verify-full" (required), or "require" only with internal and a pinned
  // CA.
  string sslmode = 5 [(buf.validate.field).string = {
    in: [
      "verify-full",
      "require"
    ]
  }];
  // Optional pinned CA certificate (PEM).
  string ca_pem = 6 [(buf.validate.field).string.max_len = 16384];
  // Allows a private address; set only with a step-up.
  bool internal = 7;
  // Tables the gateway may read.
  repeated PostgresTable tables = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  // Row cap per query (default 200, at most 1000).
  int32 max_rows = 9 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // Statement timeout in milliseconds (default 5000, at most 30000).
  int32 statement_timeout_ms = 10 [(buf.validate.field).int32 = {
    gte: 0
    lte: 30000
  }];
  // Answer cap in bytes (default 1 MiB, at most 4 MiB).
  int32 max_result_bytes = 11 [(buf.validate.field).int32 = {
    gte: 0
    lte: 4194304
  }];
  // Smallest group an aggregate returns (default 5, at least 2).
  int32 min_group_size = 12 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000000
  }];
}

// PostgresTable is one table of a postgres manifest.
message PostgresTable {
  // Schema.
  string schema = 1 [(buf.validate.field).string.pattern = "^[a-z_][a-z0-9_]{0,62}$"];
  // Table name.
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z_][a-z0-9_]{0,62}$"];
  // The record scope key this table answers to (D20); empty for none.
  string scope_key = 3 [(buf.validate.field).string.pattern = "^([a-z_][a-z0-9_]{0,62})?$"];
  // The column a record scope filters on; set together with scope_key.
  string scope_column = 4 [(buf.validate.field).string.pattern = "^([a-z_][a-z0-9_]{0,62})?$"];
  // Row cap for this table; zero takes the connection's.
  int32 max_rows = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // Columns the gateway may read.
  repeated PostgresColumn columns = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
}

// PostgresColumn is one column of a manifest table.
message PostgresColumn {
  // Column name.
  string name = 1 [(buf.validate.field).string.pattern = "^[a-z_][a-z0-9_]{0,62}$"];
  // Type: text, int, bigint, numeric, bool, date, timestamptz or uuid.
  string type = 2 [(buf.validate.field).string = {
    in: [
      "text",
      "int",
      "bigint",
      "numeric",
      "bool",
      "date",
      "timestamptz",
      "uuid"
    ]
  }];
  // Data class: public, internal, pii or secret.
  string class = 3 [(buf.validate.field).string = {
    in: [
      "public",
      "internal",
      "pii",
      "secret"
    ]
  }];
}

// A2AConfig is an a2a connection (G0 M14 D30): the peer agent's pinned
// agent card and the interface the gateway calls. Creating it and
// refreshing the pin need a step-up; a card whose digest changes is drift
// and quarantines the connection until it is pinned again (HR-322).
message A2AConfig {
  // Where the agent card is read (https; loopback only in development).
  string card_url = 1 [(buf.validate.field).string = {
    min_len: 9
    max_len: 2048
  }];
  // The card as fetched when it was pinned (JSON).
  bytes pinned_card = 2 [(buf.validate.field).bytes.max_len = 262144];
  // SHA-256 of the card's JCS form; set by the server.
  bytes card_digest = 3 [(buf.validate.field).bytes = {
    max_len: 32
  }];
  // The interface the gateway calls: one the card declares.
  A2AInterface interface = 4;
  // Optional pinned JWKS: when the card carries signatures, one must
  // verify with a key from it.
  bytes card_keys = 5 [(buf.validate.field).bytes.max_len = 65536];
  // Skill ids agents may use, a subset of the card's.
  repeated string skills = 6 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
  // An enrolled agent of this org that the peer endpoint belongs to; its
  // runs for requests through this connection are delegated (D33).
  string peer_agent_id = 7 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The bounds and limits the peer may use for requests from this route;
  // required with peer_agent_id.
  A2APeerScope peer_scope = 8;
  // Answer cap in bytes (default 1 MiB, at most 8 MiB).
  int32 max_answer_bytes = 9 [(buf.validate.field).int32 = {
    gte: 0
    lte: 8388608
  }];
  // Longest a relayed stream may run, in seconds (default 300, at most
  // 3600).
  int32 max_stream_seconds = 10 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3600
  }];
  // The URL agents reach this connection at through its gateway, set by a
  // person. The server signs the card only for exactly this URL, so a gateway
  // cannot name its own host; without it the card stays unsigned (G0 M24
  // D247).
  string public_url = 11 [(buf.validate.field).string.max_len = 2048];
}

// A2AInterface is one interface of an agent card.
message A2AInterface {
  // "JSONRPC" or "HTTP+JSON"; gRPC is refused.
  string protocol = 1 [(buf.validate.field).string = {
    in: [
      "JSONRPC",
      "HTTP+JSON"
    ]
  }];
  // Its URL.
  string url = 2 [(buf.validate.field).string = {
    min_len: 9
    max_len: 2048
  }];
}

// A2APeerScope bounds what a peer agent may do for a requester (D33).
message A2APeerScope {
  // Bounds (grant bounds v1, JSON).
  bytes bounds = 1 [(buf.validate.field).bytes = {
    min_len: 2
    max_len: 65536
  }];
  // Limits (grant limits v1, JSON); empty for none.
  bytes limits = 2 [(buf.validate.field).bytes.max_len = 65536];
}

// ConnectionRoute is one route's explicit mode.
message ConnectionRoute {
  // Route id from the package.
  string route = 1;
  // Mode.
  RouteMode mode = 2;
  // Who set it and when.
  string changed_by = 3;
  // When it was set.
  google.protobuf.Timestamp change_time = 4;
}

// ConnectionCredential is a credential version's metadata; the sealed bytes are never
// returned.
message ConnectionCredential {
  // Credential id.
  string id = 1;
  // Connection id.
  string connection_id = 2;
  // Version.
  int32 version = 3;
  // Broker key it was sealed to, and that key's fingerprint.
  string broker_key_id = 4;
  // Broker key fingerprint.
  string broker_key_fingerprint = 5;
  // Hosts it may be sent to.
  repeated string allowed_hosts = 6;
  // Header and scheme.
  string header = 7;
  // Scheme.
  string scheme = 8;
  // State.
  SealedCredentialState state = 9;
  // Who stored it and when.
  string created_by = 10;
  // When it was stored.
  google.protobuf.Timestamp create_time = 11;
  // Kind: "static" (placed as sealed) or "github_app" (an App key from
  // which the gateway mints an installation token per action, G0 M8).
  string kind = 12;
}

// CreateConnectionRequest registers a connection.
message CreateConnectionRequest {
  // Lower-case name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  // Kind.
  ConnectionKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Gateway id.
  string gateway_id = 3 [(buf.validate.field).string.uuid = true];
  // Tool package name; the org must have pinned a version of it.
  string package = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z0-9][a-z0-9.-]{0,127}$"
  }];
  // Base URL: https://host[:port], or http:// for a private address the
  // gateway's operator allows. Empty for local connections.
  string base_url = 5 [(buf.validate.field).string.max_len = 2048];
  // Hosts a credential may be sent to (default: the base URL's host).
  repeated string allowed_hosts = 6 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 253
      }
    }
  }];
  // Destination class (default public).
  DestinationClass destination_class = 7 [(buf.validate.field).enum.defined_only = true];
  // Access mode.
  AccessMode access_mode = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Header a credential goes in (for pantherclaw_held).
  string credential_header = 9 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^([A-Za-z0-9-]{1,64})?$"
  }];
  // Scheme before the credential, for example "Bearer".
  string credential_scheme = 10 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^([A-Za-z0-9._-]{1,32})?$"
  }];
  // Mode of routes without an explicit mode (default monitor).
  RouteMode default_mode = 11 [(buf.validate.field).enum.defined_only = true];
  // Response cap in bytes (default 1 MiB, at most 8 MiB).
  int32 max_response_bytes = 12 [(buf.validate.field).int32 = {
    gte: 0
    lte: 8388608
  }];
  // Dispatch timeout in milliseconds (default 10,000, at most 60,000).
  int32 timeout_ms = 13 [(buf.validate.field).int32 = {
    gte: 0
    lte: 60000
  }];
  // agent_hosts are the host names agents use for the API; only for http
  // and mcp connections.
  repeated string agent_hosts = 19 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      string: {pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"}
    }
  }];
  // connector is required for, and only for, an mcp_container connection.
  ConnectorSpec connector = 20;
  // Creates a simulated connection (G0 M12, HR-221): http and mcp need an IP
  // literal on loopback or a private network as the base URL; mcp_container
  // is refused. Fixed for the connection's life.
  bool simulated = 21;
  // postgres is required for, and only for, a postgres connection.
  PostgresConfig postgres = 22;
  // a2a is required for, and only for, an a2a connection.
  A2AConfig a2a = 23;
}

// CreateConnectionResponse returns the connection.
message CreateConnectionResponse {
  // The connection.
  Connection connection = 1;
}

// GetConnectionRequest names a connection.
message GetConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetConnectionResponse returns it.
message GetConnectionResponse {
  // The connection.
  Connection connection = 1;
  // Its active credential, if any.
  ConnectionCredential active_credential = 2;
}

// ListConnectionsRequest pages through connections.
message ListConnectionsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only this gateway's connections.
  string gateway_id = 3 [(buf.validate.field).string = {
    max_len: 36
    pattern: "^([0-9a-f-]{36})?$"
  }];
  // Include retired connections.
  bool include_retired = 4;
}

// ListConnectionsResponse is one page.
message ListConnectionsResponse {
  // Connections.
  repeated Connection connections = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// UpdateConnectionRequest changes the fields that are set.
message UpdateConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The revision the caller read; a stale revision is refused.
  int32 revision = 2 [(buf.validate.field).int32.gt = 0];
  // New gateway.
  optional string gateway_id = 3 [(buf.validate.field).string.uuid = true];
  // New base URL.
  optional string base_url = 4 [(buf.validate.field).string.max_len = 2048];
  // New credential hosts (replaces the list when update_allowed_hosts).
  repeated string allowed_hosts = 5 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 253
      }
    }
  }];
  // Whether allowed_hosts is set (an empty list is meaningful).
  bool update_allowed_hosts = 6;
  // New destination class.
  optional DestinationClass destination_class = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New access mode.
  optional AccessMode access_mode = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New default route mode.
  optional RouteMode default_mode = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New response cap.
  optional int32 max_response_bytes = 10 [(buf.validate.field).int32 = {
    gte: 1024
    lte: 8388608
  }];
  // New timeout.
  optional int32 timeout_ms = 11 [(buf.validate.field).int32 = {
    gte: 100
    lte: 60000
  }];
  // agent_hosts replaces the agent hosts when update_agent_hosts; any
  // change weakens enforcement (HR-183).
  repeated string agent_hosts = 17 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      string: {pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"}
    }
  }];
  bool update_agent_hosts = 18;
  // connector replaces an mcp_container connection's spec (weakens; moving
  // one to another gateway needs it).
  ConnectorSpec connector = 19;
  // postgres replaces a postgres connection's configuration (a widening
  // manifest change weakens).
  PostgresConfig postgres = 20;
  // a2a replaces an a2a connection's configuration, or pins its card again
  // (weakens).
  A2AConfig a2a = 21;
}

// UpdateConnectionResponse returns the connection.
message UpdateConnectionResponse {
  // The connection.
  Connection connection = 1;
}

