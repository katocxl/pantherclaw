syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/github.proto";

// ConnectionService manages connections: one target (an HTTP API, a remote
// MCP server, or the agent's own machine for hooks) served by one gateway
// through one tool package (G0 M6). Each package route of a connection runs
// in monitor or enforce mode (PN-013). Credentials are sealed on the
// caller's machine to the gateway's broker key; the server stores only the
// sealed bytes and never returns them (HR-060, HR-061, HR-182). Changes that
// weaken enforcement need a person and are audited; changes that strengthen
// it apply at once (HR-183).
service ConnectionService {
  // CreateConnection registers a connection. Its routes start in its
  // default mode, monitor unless enforce is asked for.
  // permission: connection.manage
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  // GetConnection returns a connection with its route modes and its active
  // credential's metadata.
  // permission: connection.read
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListConnections lists the org's connections.
  // permission: connection.read
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateConnection changes the fields that are set, at the revision the
  // caller read. Changing the target, hosts, gateway, package or access
  // mode, or lowering the default mode to monitor, is a weakening change.
  // permission: connection.manage
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);
  // SetRouteMode sets one route's mode; enforce to monitor is a weakening
  // change.
  // permission: connection.manage
  rpc SetRouteMode(SetRouteModeRequest) returns (SetRouteModeResponse);
  // QuarantineConnection stops every action through a connection at once.
  // permission: connection.manage
  rpc QuarantineConnection(QuarantineConnectionRequest) returns (QuarantineConnectionResponse);
  // RestoreConnection lifts a quarantine (a weakening change).
  // permission: connection.manage
  rpc RestoreConnection(RestoreConnectionRequest) returns (RestoreConnectionResponse);
  // RetireConnection ends a connection for good and revokes its credential.
  // permission: connection.manage
  rpc RetireConnection(RetireConnectionRequest) returns (RetireConnectionResponse);
  // GetSealingKey returns what `pclaw seal` needs: the active broker key of
  // the connection's gateway and the values a seal must bind.
  // permission: credential.seal
  rpc GetSealingKey(GetSealingKeyRequest) returns (GetSealingKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PutCredential stores a sealed credential as the connection's next
  // version; the previous version is superseded.
  // permission: credential.seal
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  // ListCredentials lists a connection's credentials (metadata only).
  // permission: connection.read
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeCredential revokes the active credential at once.
  // permission: connection.manage
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  // GetConnectionCapabilities returns what a connection declares it
  // supports: discovery, observation, enforcement and response, its
  // operations, permissions with reasons, limits, failure behavior and its
  // last successful test (F346). It is a declared capability, never
  // coverage: what a target declares is not evidence until a test shows it
  // (HR-210).
  // permission: connection.read
  rpc GetConnectionCapabilities(GetConnectionCapabilitiesRequest) returns (GetConnectionCapabilitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // TestConnection tests a connection and records the result; the latest
  // passed test is its last successful test (F350, F354). A credential test
  // checks what the connection depends on (its state, its gateway and the
  // gateway's certificate, its pinned package and routes, its credential,
  // its circuits) without calling the target, and finishes at once. A read
  // test leases the package's one harmless test read (an HTTP GET with no
  // required params) to the connection's gateway and is PENDING until the
  // gateway reports: never a write.
  // permission: connection.test
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  // GetConnectionHealth returns what a person needs to judge a connection
  // (F358): its circuits, the permissions its credential is used for, its
  // latest and last successful tests, its delivery failures over the last
  // 24 hours and, for a caller who may read agents, the agents that used it
  // over the last 30 days.
  // permission: connection.read
  rpc GetConnectionHealth(GetConnectionHealthRequest) returns (GetConnectionHealthResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ConnectionKind is what a connection reaches.
enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  // An HTTP API; the gateway dispatches re-serialized requests.
  CONNECTION_KIND_HTTP = 1;
  // A remote MCP server over Streamable HTTP (opaque: PARTIAL, HR-086).
  CONNECTION_KIND_MCP = 2;
  // The agent's own machine (hooks); the gateway never dispatches.
  CONNECTION_KIND_LOCAL = 3;
}

// ConnectionState is whether actions may use a connection.
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_ACTIVE = 1;
  // Stopped by a person, the circuit breaker or the kill switch's scope;
  // see quarantine_reason.
  CONNECTION_STATE_QUARANTINED = 2;
  CONNECTION_STATE_RETIRED = 3;
}

// RouteMode is how a route treats decisions (PN-013).
enum RouteMode {
  ROUTE_MODE_UNSPECIFIED = 0;
  // Observe and record a hypothetical decision; never block on policy and
  // never claim prevention.
  ROUTE_MODE_MONITOR = 1;
  // Enforce every decision.
  ROUTE_MODE_ENFORCE = 2;
}

// AccessMode is how the target's credential is held (F416).
enum AccessMode {
  ACCESS_MODE_UNSPECIFIED = 0;
  // The gateway holds a sealed credential and injects it.
  ACCESS_MODE_PANTHERCLAW_HELD = 1;
  // The agent holds its own credential (PARTIAL).
  ACCESS_MODE_AGENT_HELD = 2;
  // The target verifies PAP action tokens (PN-002.6).
  ACCESS_MODE_TARGET_ENFORCED = 3;
  // No credential (local connections, open APIs).
  ACCESS_MODE_NONE = 4;
}

// DestinationClass classifies a connection's target (HR-079).
enum DestinationClass {
  DESTINATION_CLASS_UNSPECIFIED = 0;
  DESTINATION_CLASS_PUBLIC = 1;
  DESTINATION_CLASS_INTERNAL = 2;
}

// SealedCredentialState is whether a credential version is used.
enum SealedCredentialState {
  SEALED_CREDENTIAL_STATE_UNSPECIFIED = 0;
  SEALED_CREDENTIAL_STATE_ACTIVE = 1;
  SEALED_CREDENTIAL_STATE_SUPERSEDED = 2;
  SEALED_CREDENTIAL_STATE_REVOKED = 3;
}

// Connection is one connection.
message Connection {
  // Connection id.
  string id = 1;
  // Name, unique among live connections; agents use it in gateway paths.
  string name = 2;
  // Kind.
  ConnectionKind kind = 3;
  // Gateway that serves it.
  string gateway_id = 4;
  // Tool package; the org's pinned version applies.
  string package = 5;
  // Base URL (scheme, host and port), empty for local connections.
  string base_url = 6;
  // Hosts a credential may be sent to.
  repeated string allowed_hosts = 7;
  // Destination class.
  DestinationClass destination_class = 8;
  // Access mode.
  AccessMode access_mode = 9;
  // Header a credential goes in, and its optional scheme.
  string credential_header = 10;
  // Credential scheme, for example "Bearer".
  string credential_scheme = 11;
  // Mode of routes without an explicit mode.
  RouteMode default_mode = 12;
  // Explicit route modes.
  repeated ConnectionRoute routes = 13;
  // Response cap in bytes.
  int32 max_response_bytes = 14;
  // Dispatch timeout in milliseconds.
  int32 timeout_ms = 15;
  // State.
  ConnectionState state = 16;
  // Why it is quarantined (a reason code).
  string quarantine_reason = 17;
  // Revision; UpdateConnection must name the current one.
  int32 revision = 18;
  // Who created it and when.
  string created_by = 19;
  // When it was created.
  google.protobuf.Timestamp create_time = 20;
  // Who changed it last and when.
  string updated_by = 21;
  // When it was changed last.
  google.protobuf.Timestamp update_time = 22;
  // agent_hosts are the host names agents use for this connection's API
  // (G0 M9): a containment sandbox's edge maps each to it (HR-183).
  repeated string agent_hosts = 28;
  // The GitHub App installation behind a connection holding a GitHub App
  // credential (G0 M8, ADR-0021); unset otherwise.
  GitHubInstallation github = 24;
}

// ConnectionRoute is one route's explicit mode.
message ConnectionRoute {
  // Route id from the package.
  string route = 1;
  // Mode.
  RouteMode mode = 2;
  // Who set it and when.
  string changed_by = 3;
  // When it was set.
  google.protobuf.Timestamp change_time = 4;
}

// ConnectionCredential is a credential version's metadata; the sealed bytes are never
// returned.
message ConnectionCredential {
  // Credential id.
  string id = 1;
  // Connection id.
  string connection_id = 2;
  // Version.
  int32 version = 3;
  // Broker key it was sealed to, and that key's fingerprint.
  string broker_key_id = 4;
  // Broker key fingerprint.
  string broker_key_fingerprint = 5;
  // Hosts it may be sent to.
  repeated string allowed_hosts = 6;
  // Header and scheme.
  string header = 7;
  // Scheme.
  string scheme = 8;
  // State.
  SealedCredentialState state = 9;
  // Who stored it and when.
  string created_by = 10;
  // When it was stored.
  google.protobuf.Timestamp create_time = 11;
  // Kind: "static" (placed as sealed) or "github_app" (an App key from
  // which the gateway mints an installation token per action, G0 M8).
  string kind = 12;
}

// CreateConnectionRequest registers a connection.
message CreateConnectionRequest {
  // Lower-case name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  // Kind.
  ConnectionKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Gateway id.
  string gateway_id = 3 [(buf.validate.field).string.uuid = true];
  // Tool package name; the org must have pinned a version of it.
  string package = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z0-9][a-z0-9.-]{0,127}$"
  }];
  // Base URL: https://host[:port], or http:// for a private address the
  // gateway's operator allows. Empty for local connections.
  string base_url = 5 [(buf.validate.field).string.max_len = 2048];
  // Hosts a credential may be sent to (default: the base URL's host).
  repeated string allowed_hosts = 6 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 253
      }
    }
  }];
  // Destination class (default public).
  DestinationClass destination_class = 7 [(buf.validate.field).enum.defined_only = true];
  // Access mode.
  AccessMode access_mode = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Header a credential goes in (for pantherclaw_held).
  string credential_header = 9 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^([A-Za-z0-9-]{1,64})?$"
  }];
  // Scheme before the credential, for example "Bearer".
  string credential_scheme = 10 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^([A-Za-z0-9._-]{1,32})?$"
  }];
  // Mode of routes without an explicit mode (default monitor).
  RouteMode default_mode = 11 [(buf.validate.field).enum.defined_only = true];
  // Response cap in bytes (default 1 MiB, at most 8 MiB).
  int32 max_response_bytes = 12 [(buf.validate.field).int32 = {
    gte: 0
    lte: 8388608
  }];
  // Dispatch timeout in milliseconds (default 10,000, at most 60,000).
  int32 timeout_ms = 13 [(buf.validate.field).int32 = {
    gte: 0
    lte: 60000
  }];
  // agent_hosts are the host names agents use for the API; only for http
  // and mcp connections.
  repeated string agent_hosts = 19 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      string: {pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"}
    }
  }];
}

// CreateConnectionResponse returns the connection.
message CreateConnectionResponse {
  // The connection.
  Connection connection = 1;
}

// GetConnectionRequest names a connection.
message GetConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetConnectionResponse returns it.
message GetConnectionResponse {
  // The connection.
  Connection connection = 1;
  // Its active credential, if any.
  ConnectionCredential active_credential = 2;
}

// ListConnectionsRequest pages through connections.
message ListConnectionsRequest {
  // Maximum results (default 50, at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
  // Only this gateway's connections.
  string gateway_id = 3 [(buf.validate.field).string = {
    max_len: 36
    pattern: "^([0-9a-f-]{36})?$"
  }];
  // Include retired connections.
  bool include_retired = 4;
}

// ListConnectionsResponse is one page.
message ListConnectionsResponse {
  // Connections.
  repeated Connection connections = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// UpdateConnectionRequest changes the fields that are set.
message UpdateConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The revision the caller read; a stale revision is refused.
  int32 revision = 2 [(buf.validate.field).int32.gt = 0];
  // New gateway.
  optional string gateway_id = 3 [(buf.validate.field).string.uuid = true];
  // New base URL.
  optional string base_url = 4 [(buf.validate.field).string.max_len = 2048];
  // New credential hosts (replaces the list when update_allowed_hosts).
  repeated string allowed_hosts = 5 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 253
      }
    }
  }];
  // Whether allowed_hosts is set (an empty list is meaningful).
  bool update_allowed_hosts = 6;
  // New destination class.
  optional DestinationClass destination_class = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New access mode.
  optional AccessMode access_mode = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New default route mode.
  optional RouteMode default_mode = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // New response cap.
  optional int32 max_response_bytes = 10 [(buf.validate.field).int32 = {
    gte: 1024
    lte: 8388608
  }];
  // New timeout.
  optional int32 timeout_ms = 11 [(buf.validate.field).int32 = {
    gte: 100
    lte: 60000
  }];
  // agent_hosts replaces the agent hosts when update_agent_hosts; any
  // change weakens enforcement (HR-183).
  repeated string agent_hosts = 17 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      string: {pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"}
    }
  }];
  bool update_agent_hosts = 18;
}

// UpdateConnectionResponse returns the connection.
message UpdateConnectionResponse {
  // The connection.
  Connection connection = 1;
}

// SetRouteModeRequest sets one route's mode.
message SetRouteModeRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Route id from the package.
  string route = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
  }];
  // Mode.
  RouteMode mode = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// SetRouteModeResponse returns the connection.
message SetRouteModeResponse {
  // The connection.
  Connection connection = 1;
}

// QuarantineConnectionRequest stops a connection.
message QuarantineConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Why (stored and shown as untrusted text).
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// QuarantineConnectionResponse returns the connection.
message QuarantineConnectionResponse {
  // The connection.
  Connection connection = 1;
}

// RestoreConnectionRequest lifts a quarantine.
message RestoreConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RestoreConnectionResponse returns the connection.
message RestoreConnectionResponse {
  // The connection.
  Connection connection = 1;
}

// RetireConnectionRequest ends a connection.
message RetireConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RetireConnectionResponse confirms it.
message RetireConnectionResponse {}

// GetSealingKeyRequest names a connection.
message GetSealingKeyRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetSealingKeyResponse is everything a seal binds (HR-060, HR-182).
message GetSealingKeyResponse {
  // Org id.
  string org_id = 1;
  // Connection id.
  string connection_id = 2;
  // The version the new credential gets.
  int32 version = 3;
  // Broker key id.
  string broker_key_id = 4;
  // X-Wing public key.
  bytes public_key = 5;
  // Its fingerprint, to show before sealing.
  string fingerprint = 6;
  // Gateway that registered it.
  string gateway_id = 7;
  // Hosts the credential will be bound to.
  repeated string allowed_hosts = 8;
  // Header and scheme it will be placed with.
  string header = 9;
  // Scheme.
  string scheme = 10;
}

// PutCredentialRequest stores a sealed credential.
message PutCredentialRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Version (the one GetSealingKey returned).
  int32 version = 2 [(buf.validate.field).int32.gt = 0];
  // Broker key id it was sealed to.
  string broker_key_id = 3 [(buf.validate.field).string.uuid = true];
  // The sealed blob.
  bytes sealed = 4 [(buf.validate.field).bytes = {
    min_len: 1140
    max_len: 70000
  }];
  // The hosts, header and scheme the seal bound; they must equal the
  // connection's current values, or the upload is refused.
  repeated string allowed_hosts = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_len: 253
      }
    }
  }];
  // Header.
  string header = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[A-Za-z0-9-]{1,64}$"
  }];
  // Scheme.
  string scheme = 7 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^([A-Za-z0-9._-]{1,32})?$"
  }];
  // Kind the seal bound: "static" (the default when empty) or "github_app"
  // (G0 M8 decision 3), which needs the header Authorization and the
  // scheme Bearer.
  string kind = 8 [(buf.validate.field).string = {
    in: [
      "",
      "static",
      "github_app"
    ]
  }];
  // Required for a github_app credential, refused for a static one: the
  // installation it was sealed for, recorded as the connection's. The
  // gateway refuses a seal that holds another.
  GitHubInstallation github = 9;
}

// PutCredentialResponse returns the stored metadata.
message PutCredentialResponse {
  // The credential.
  ConnectionCredential credential = 1;
}

// ListCredentialsRequest names a connection.
message ListCredentialsRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListCredentialsResponse lists its credentials, newest first.
message ListCredentialsResponse {
  // Credentials.
  repeated ConnectionCredential credentials = 1;
}

// RevokeCredentialRequest revokes the active credential.
message RevokeCredentialRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Version to revoke.
  int32 version = 2 [(buf.validate.field).int32.gt = 0];
}

// RevokeCredentialResponse confirms it.
message RevokeCredentialResponse {}

// Capability declarations of connections (G0 M8 track C, F346–F350). A
// declaration follows from the connection's kind, access mode and reviewed
// package, never from a setting; it says what the connection can do, not
// what it was shown to do (coverage, M9).

// CapabilityLevel is how far a connection supports a capability (F347).
enum CapabilityLevel {
  CAPABILITY_LEVEL_UNSPECIFIED = 0;
  // The connection does it.
  CAPABILITY_LEVEL_SUPPORTED = 1;
  // Only as far as a cooperative agent or an opaque server lets it
  // (HR-024, HR-086).
  CAPABILITY_LEVEL_PARTIAL = 2;
  // It cannot.
  CAPABILITY_LEVEL_UNSUPPORTED = 3;
}

// CapabilitySupport is one capability's level and why.
message CapabilitySupport {
  // Level.
  CapabilityLevel level = 1;
  // Why, for people.
  string detail = 2;
}

// ConnectionOperation is one operation a connection serves (F348).
message ConnectionOperation {
  // Operation, for example payments.refund.create.
  string operation = 1;
  // The definition's summary.
  string summary = 2;
  // Route of the package.
  string route = 3;
  // The definition's access: read or write.
  string access = 4;
  // Target type.
  string target_type = 5;
  // Reversibility: reversible, compensatable or irreversible.
  string reversibility = 6;
  // Whether the definition declares a verifier, so the effect can be
  // observed after dispatch (M7).
  bool verified = 7;
  // The route's mode on the connection.
  RouteMode mode = 8;
}

// ConnectionPermission is something the connection's credential is used
// for, with the operations that need it (F349).
message ConnectionPermission {
  // The permission: a credential scope the definition declares
  // (`name:level`), or without one `<access> <target type>`.
  string name = 1;
  // The operations that need it.
  repeated string reasons = 2;
}

// ConnectionLimit is something the connection does not do (F350).
message ConnectionLimit {
  // A stable code, for example OPERATION_NOT_SERVED.
  string code = 1;
  // Why, for people.
  string detail = 2;
}

// ConnectionCapabilities is a connection's declaration (F346).
message ConnectionCapabilities {
  // Connection id.
  string connection_id = 1;
  // Discovery: unknown workloads and, for MCP, upstream tools.
  CapabilitySupport discovery = 2;
  // Observation: decisions recorded, monitor mode.
  CapabilitySupport observation = 3;
  // Enforcement: whether a decision stops the call.
  CapabilitySupport enforcement = 4;
  // Response: quarantine, the kill switch, credential revocation.
  CapabilitySupport response = 5;
  // The response controls that apply: quarantine, kill_switch,
  // revoke_credential, rotate_credential.
  repeated string response_actions = 6;
  // Operations it serves.
  repeated ConnectionOperation operations = 7;
  // What PantherClaw's credential for it is used for; empty when it holds
  // none.
  repeated ConnectionPermission permissions = 8;
  // What it does not do.
  repeated ConnectionLimit limits = 9;
  // How it behaves when something fails, one statement each.
  repeated string failure_behavior = 10;
  // Its last successful test (F350); unset when it never passed one.
  ConnectionTest last_passed_test = 11;
}

// GetConnectionCapabilitiesRequest names a connection.
message GetConnectionCapabilitiesRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetConnectionCapabilitiesResponse returns its declaration.
message GetConnectionCapabilitiesResponse {
  // The declaration.
  ConnectionCapabilities capabilities = 1;
}

// ConnectionTestResult is the result of a connection test.
enum ConnectionTestResult {
  CONNECTION_TEST_RESULT_UNSPECIFIED = 0;
  // Every check passed.
  CONNECTION_TEST_RESULT_PASSED = 1;
  // A check failed.
  CONNECTION_TEST_RESULT_FAILED = 2;
}

// ConnectionTestCheck is one check of a connection test.
message ConnectionTestCheck {
  // CONNECTION_ACTIVE, GATEWAY_ACTIVE, GATEWAY_CERTIFICATE, PACKAGE_ROUTES,
  // CREDENTIAL or CIRCUIT_CLOSED.
  string check = 1;
  // Whether it passed.
  bool passed = 2;
  // What it found, for people.
  string detail = 3;
}

// ConnectionTest is one test of a connection.
message ConnectionTest {
  // Test id.
  string id = 1;
  // Connection id.
  string connection_id = 2;
  // Result, once the test is done.
  ConnectionTestResult result = 3;
  // The checks, in order.
  repeated ConnectionTestCheck checks = 4;
  // Who asked for it.
  string requested_by = 5;
  // When it finished; unset while it runs.
  google.protobuf.Timestamp finish_time = 6;
  // credential (checks what the connection depends on, without calling
  // the target), read (a harmless read through the gateway) or
  // target_verifier (the target refuses calls without a valid token).
  string kind = 7;
  // PENDING, RUNNING, DONE (with a result) or FAILED (could not run).
  string state = 8;
  // When it was asked for.
  google.protobuf.Timestamp create_time = 9;
  // The operation a read or target_verifier test reached; empty for a
  // credential test (N23: M9 lifts the cooperative cap only for the
  // operation a passing target_verifier test reached).
  string operation = 10;
}

// TestConnectionRequest names a connection and the kind of test.
message TestConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // credential (the default), read or target_verifier.
  string kind = 2 [(buf.validate.field).string.pattern = "^(|credential|read|target_verifier)$"];
}

// TestConnectionResponse returns the recorded test.
message TestConnectionResponse {
  // The test.
  ConnectionTest test = 1;
}

// ConnectionCircuit is one gateway's circuit for a connection (HR-078).
message ConnectionCircuit {
  // Gateway id.
  string gateway_id = 1;
  // Whether it is open (the connection is then quarantined).
  bool open = 2;
  // UNKNOWN outcomes and all outcomes in the window the gateway reported.
  int32 unknown_count = 3;
  // All outcomes in that window.
  int32 total_count = 4;
  // When it opened; unset when closed.
  google.protobuf.Timestamp open_time = 5;
  // When the gateway reported it last.
  google.protobuf.Timestamp report_time = 6;
}

// ConnectionDeliveries are the outcomes recorded for a connection's actions
// since a time.
message ConnectionDeliveries {
  // The start of the window (24 hours before the read).
  google.protobuf.Timestamp since_time = 1;
  // Failed outcomes.
  int32 failed_count = 2;
  // UNKNOWN outcomes.
  int32 unknown_count = 3;
  // The latest failed or UNKNOWN outcome; unset when none.
  google.protobuf.Timestamp last_failure_time = 4;
  // The latest accepted outcome; unset when none.
  google.protobuf.Timestamp last_success_time = 5;
  // Actions an agent ran itself after the decision (delegated): PantherClaw
  // never learns their result, so they count neither as failures nor as
  // successes (HR-024).
  int32 delegated_count = 6;
  // The latest delegated outcome; unset when none.
  google.protobuf.Timestamp last_delegated_time = 7;
}

// ConnectionDependentAgent is an agent whose runs used a connection.
message ConnectionDependentAgent {
  // Agent id.
  string agent_id = 1;
  // Agent name.
  string name = 2;
  // When it last used the connection.
  google.protobuf.Timestamp last_use_time = 3;
}

// ConnectionHealth is a connection's health (F358).
message ConnectionHealth {
  // The connection.
  Connection connection = 1;
  // Its active credential's metadata; unset when none.
  ConnectionCredential active_credential = 2;
  // Each gateway's circuit.
  repeated ConnectionCircuit circuits = 3;
  // What PantherClaw's credential for it is used for.
  repeated ConnectionPermission permissions = 4;
  // Its latest test, of any kind: a credential test checks only the
  // configuration and never reaches the target, so read its kind.
  ConnectionTest last_test = 5;
  // Its last successful test, of any kind (see last_test).
  ConnectionTest last_passed_test = 6;
  // Delivery failures over the last 24 hours.
  ConnectionDeliveries deliveries = 7;
  // Agents that used it over the last 30 days, latest first, at most 50.
  repeated ConnectionDependentAgent dependent_agents = 8;
  // The caller may not read agents org-wide, so neither list is shown.
  bool dependent_agents_hidden = 9;
  // Agents whose active grants allow an operation the connection serves,
  // so they depend on it, by name, at most 50. last_use_time is unset.
  repeated ConnectionDependentAgent granted_agents = 10;
}

// GetConnectionHealthRequest names a connection.
message GetConnectionHealthRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetConnectionHealthResponse returns its health.
message GetConnectionHealthResponse {
  // The health.
  ConnectionHealth health = 1;
}
