message ListCredentialsResponse {
  // Credentials.
  repeated ConnectionCredential credentials = 1;
}

// RevokeCredentialRequest revokes the active credential.
message RevokeCredentialRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Version to revoke.
  int32 version = 2 [(buf.validate.field).int32.gt = 0];
}

// RevokeCredentialResponse confirms it.
message RevokeCredentialResponse {}

// Capability declarations of connections (G0 M8 track C, F346–F350). A
// declaration follows from the connection's kind, access mode and reviewed
// package, never from a setting; it says what the connection can do, not
// what it was shown to do (coverage, M9).

// CapabilityLevel is how far a connection supports a capability (F347).
enum CapabilityLevel {
  CAPABILITY_LEVEL_UNSPECIFIED = 0;
  // The connection does it.
  CAPABILITY_LEVEL_SUPPORTED = 1;
  // Only as far as a cooperative agent or an opaque server lets it
  // (HR-024, HR-086).
  CAPABILITY_LEVEL_PARTIAL = 2;
  // It cannot.
  CAPABILITY_LEVEL_UNSUPPORTED = 3;
}

// CapabilitySupport is one capability's level and why.
message CapabilitySupport {
  // Level.
  CapabilityLevel level = 1;
  // Why, for people.
  string detail = 2;
}

// ConnectionOperation is one operation a connection serves (F348).
message ConnectionOperation {
  // Operation, for example payments.refund.create.
  string operation = 1;
  // The definition's summary.
  string summary = 2;
  // Route of the package.
  string route = 3;
  // The definition's access: read or write.
  string access = 4;
  // Target type.
  string target_type = 5;
  // Reversibility: reversible, compensatable or irreversible.
  string reversibility = 6;
  // Whether the definition declares a verifier, so the effect can be
  // observed after dispatch (M7).
  bool verified = 7;
  // The route's mode on the connection.
  RouteMode mode = 8;
}

// ConnectionPermission is something the connection's credential is used
// for, with the operations that need it (F349).
message ConnectionPermission {
  // The permission: a credential scope the definition declares
  // (`name:level`), or without one `<access> <target type>`.
  string name = 1;
  // The operations that need it.
  repeated string reasons = 2;
}

// ConnectionLimit is something the connection does not do (F350).
message ConnectionLimit {
  // A stable code, for example OPERATION_NOT_SERVED.
  string code = 1;
  // Why, for people.
  string detail = 2;
}

// ConnectionCapabilities is a connection's declaration (F346).
message ConnectionCapabilities {
  // Connection id.
  string connection_id = 1;
  // Discovery: unknown workloads and, for MCP, upstream tools.
  CapabilitySupport discovery = 2;
  // Observation: decisions recorded, monitor mode.
  CapabilitySupport observation = 3;
  // Enforcement: whether a decision stops the call.
  CapabilitySupport enforcement = 4;
  // Response: quarantine, the kill switch, credential revocation.
  CapabilitySupport response = 5;
  // The response controls that apply: quarantine, kill_switch,
  // revoke_credential, rotate_credential.
  repeated string response_actions = 6;
  // Operations it serves.
  repeated ConnectionOperation operations = 7;
  // What PantherClaw's credential for it is used for; empty when it holds
  // none.
  repeated ConnectionPermission permissions = 8;
  // What it does not do.
  repeated ConnectionLimit limits = 9;
  // How it behaves when something fails, one statement each.
  repeated string failure_behavior = 10;
  // Its last successful test (F350); unset when it never passed one.
  ConnectionTest last_passed_test = 11;
}

// GetConnectionCapabilitiesRequest names a connection.
message GetConnectionCapabilitiesRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetConnectionCapabilitiesResponse returns its declaration.
message GetConnectionCapabilitiesResponse {
  // The declaration.
  ConnectionCapabilities capabilities = 1;
}

// ConnectionTestResult is the result of a connection test.
enum ConnectionTestResult {
  CONNECTION_TEST_RESULT_UNSPECIFIED = 0;
  // Every check passed.
  CONNECTION_TEST_RESULT_PASSED = 1;
  // A check failed.
  CONNECTION_TEST_RESULT_FAILED = 2;
}

// ConnectionTestCheck is one check of a connection test.
message ConnectionTestCheck {
  // CONNECTION_ACTIVE, GATEWAY_ACTIVE, GATEWAY_CERTIFICATE, PACKAGE_ROUTES,
  // CREDENTIAL or CIRCUIT_CLOSED.
  string check = 1;
  // Whether it passed.
  bool passed = 2;
  // What it found, for people.
  string detail = 3;
}

// ConnectionTest is one test of a connection.
message ConnectionTest {
  // Test id.
  string id = 1;
  // Connection id.
  string connection_id = 2;
  // Result, once the test is done.
  ConnectionTestResult result = 3;
  // The checks, in order.
  repeated ConnectionTestCheck checks = 4;
  // Who asked for it.
  string requested_by = 5;
  // When it finished; unset while it runs.
  google.protobuf.Timestamp finish_time = 6;
  // credential (checks what the connection depends on, without calling
  // the target), read (a harmless read through the gateway) or
  // target_verifier (the target refuses calls without a valid token).
  string kind = 7;
  // PENDING, RUNNING, DONE (with a result) or FAILED (could not run).
  string state = 8;
  // When it was asked for.
  google.protobuf.Timestamp create_time = 9;
  // The operation a read or target_verifier test reached; empty for a
  // credential test (N23: M9 lifts the cooperative cap only for the
  // operation a passing target_verifier test reached).
  string operation = 10;
}

// TestConnectionRequest names a connection and the kind of test.
message TestConnectionRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // credential (the default), read or target_verifier.
  string kind = 2 [(buf.validate.field).string.pattern = "^(|credential|read|target_verifier)$"];
}

// TestConnectionResponse returns the recorded test.
message TestConnectionResponse {
  // The test.
  ConnectionTest test = 1;
}

// ConnectionCircuit is one gateway's circuit for a connection (HR-078).
message ConnectionCircuit {
  // Gateway id.
  string gateway_id = 1;
  // Whether it is open (the connection is then quarantined).
  bool open = 2;
  // UNKNOWN outcomes and all outcomes in the window the gateway reported.
  int32 unknown_count = 3;
  // All outcomes in that window.
  int32 total_count = 4;
  // When it opened; unset when closed.
  google.protobuf.Timestamp open_time = 5;
  // When the gateway reported it last.
  google.protobuf.Timestamp report_time = 6;
}

// ConnectionDeliveries are the outcomes recorded for a connection's actions
// since a time.
message ConnectionDeliveries {
  // The start of the window (24 hours before the read).
  google.protobuf.Timestamp since_time = 1;
  // Failed outcomes.
  int32 failed_count = 2;
  // UNKNOWN outcomes.
  int32 unknown_count = 3;
  // The latest failed or UNKNOWN outcome; unset when none.
  google.protobuf.Timestamp last_failure_time = 4;
  // The latest accepted outcome; unset when none.
  google.protobuf.Timestamp last_success_time = 5;
  // Actions an agent ran itself after the decision (delegated): PantherClaw
  // never learns their result, so they count neither as failures nor as
  // successes (HR-024).
  int32 delegated_count = 6;
  // The latest delegated outcome; unset when none.
  google.protobuf.Timestamp last_delegated_time = 7;
}

// ConnectionDependentAgent is an agent whose runs used a connection.
message ConnectionDependentAgent {
  // Agent id.
  string agent_id = 1;
  // Agent name.
  string name = 2;
  // When it last used the connection.
  google.protobuf.Timestamp last_use_time = 3;
}

// ConnectionHealth is a connection's health (F358).
message ConnectionHealth {
  // The connection.
  Connection connection = 1;
  // Its active credential's metadata; unset when none.
  ConnectionCredential active_credential = 2;
  // Each gateway's circuit.
  repeated ConnectionCircuit circuits = 3;
  // What PantherClaw's credential for it is used for.
  repeated ConnectionPermission permissions = 4;
  // Its latest test, of any kind: a credential test checks only the
  // configuration and never reaches the target, so read its kind.
  ConnectionTest last_test = 5;
  // Its last successful test, of any kind (see last_test).
  ConnectionTest last_passed_test = 6;
  // Delivery failures over the last 24 hours.
  ConnectionDeliveries deliveries = 7;
  // Agents that used it over the last 30 days, latest first, at most 50.
  repeated ConnectionDependentAgent dependent_agents = 8;
  // The caller may not read agents org-wide, so neither list is shown.
  bool dependent_agents_hidden = 9;
  // Agents whose active grants allow an operation the connection serves,
  // so they depend on it, by name, at most 50. last_use_time is unset.
  repeated ConnectionDependentAgent granted_agents = 10;
}

// GetConnectionHealthRequest names a connection.
message GetConnectionHealthRequest {
  // Connection id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetConnectionHealthResponse returns its health.
message GetConnectionHealthResponse {
  // The health.
  ConnectionHealth health = 1;
}

// InventoryItemKind is what an upstream MCP server listed.
enum InventoryItemKind {
  INVENTORY_ITEM_KIND_UNSPECIFIED = 0;
  INVENTORY_ITEM_KIND_TOOL = 1;
  INVENTORY_ITEM_KIND_RESOURCE = 2;
  INVENTORY_ITEM_KIND_RESOURCE_TEMPLATE = 3;
}

// InventoryItemState is where an inventory item's review stands.
enum InventoryItemState {
  INVENTORY_ITEM_STATE_UNSPECIFIED = 0;
  // Not covered by an active reviewed package version; inert, with an open
  // review entry.
  INVENTORY_ITEM_STATE_NEW = 1;
  // An active package version pinned for the connection covers it.
  INVENTORY_ITEM_STATE_COVERED = 2;
  // A person dismissed it with a reason.
  INVENTORY_ITEM_STATE_DISMISSED = 3;
  // A complete listing no longer had it.
  INVENTORY_ITEM_STATE_VANISHED = 4;
}

// InventoryItem is one (kind, name, digest) an upstream server listed.
message InventoryItem {
  // Item id.
  string id = 1;
  // Connection id.
  string connection_id = 2;
  // Kind.
  InventoryItemKind kind = 3;
  // The tool name, resource URI or URI template.
  string name = 4;
  // UNTRUSTED: the listed name of a resource or template.
  string display_name = 5;
  // UNTRUSTED: the listed MIME type.
  string mime_type = 6;
  // sha256:<hex> of the canonical listing entry.
  string digest = 7;
  // UNTRUSTED: the upstream description, at most 8 KiB. Show it flagged;
  // it is never a served description (HR-415).
  string description = 8;
  // The injection scan of the description: clean, flagged, partial or
  // not_scanned.
  string description_scan = 9;
  // State.
  InventoryItemState state = 10;
  // The item's TOOL_REVIEW waitlist entry, if one was opened.
  string review_entry_id = 11;
  // Who dismissed it.
  string dismissed_by = 12;
  // UNTRUSTED: the dismissal reason.
  string dismiss_reason = 13;
  // First listed.
  google.protobuf.Timestamp first_seen_time = 14;
  // Last listed.
  google.protobuf.Timestamp last_seen_time = 15;
  // Last state change.
  google.protobuf.Timestamp update_time = 16;
  // Whether the gateway cut the display name or MIME type to 128 bytes.
  bool display_truncated = 17;
}

// ListConnectionInventoryRequest selects one page.
message ListConnectionInventoryRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // Only these states (default all).
  repeated InventoryItemState states = 2 [(buf.validate.field).repeated = {
    max_items: 4
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Only these kinds (default all).
  repeated InventoryItemKind kinds = 3 [(buf.validate.field).repeated = {
    max_items: 3
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Maximum results (default 50, at most 200).
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 5 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^[A-Za-z0-9_-]*$"
  }];
}

// ListConnectionInventoryResponse is one page.
message ListConnectionInventoryResponse {
  // Items.
  repeated InventoryItem items = 1;
  // Token for the next page; empty at the end.
  string next_page_token = 2;
}

// DismissInventoryItemRequest dismisses one NEW item.
message DismissInventoryItemRequest {
  // Item id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // UNTRUSTED: why, 1 to 500 characters.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// DismissInventoryItemResponse returns the dismissed item.
message DismissInventoryItemResponse {
  // The item.
  InventoryItem item = 1;
}

// DraftPackageFromInventoryRequest names the NEW items to draft.
message DraftPackageFromInventoryRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // NEW items of that connection, 1 to 100.
  repeated string item_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

// DraftPackageFromInventoryResponse is the unsigned draft.
message DraftPackageFromInventoryResponse {
  // The draft package manifest (YAML), unsigned. Upstream descriptions are
  // in comments marked UNTRUSTED, never in a description field.
  bytes manifest_yaml = 1;
  // What a person must fill in before the draft validates.
  repeated string todo = 2;
}
