syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pantherclaw/v1/connections.proto";

// CredentialRotationService rotates a connection's GitHub App key with
// confirmation at the target (G0 M20 D253, D259; G0 M22 D5, HR-517..520,
// HR-553). It is one-to-one over the rotation use cases, which keep their own
// permissions, protected change and audit. No response carries a key.
// Activating and rolling back need a security-key step-up, which only a
// browser session has: over this API they are refused with
// STEP_UP_REQUIRED, and a person uses the server page
// /integrations/credential-rotations/{id}.
service CredentialRotationService {
  // RequestRotation opens a rotation, after the preview of who shares the
  // active credential (PreviewCredentialChange): its digest must match.
  // permission: connection.manage
  rpc RequestRotation(RequestRotationRequest) returns (RequestRotationResponse);
  // SealRotationCandidate stores the new key, sealed on the caller's machine
  // to the gateway's broker key, as a CANDIDATE no gateway configuration
  // carries.
  // permission: credential.seal
  rpc SealRotationCandidate(SealRotationCandidateRequest) returns (SealRotationCandidateResponse);
  // TestRotation asks the connection's gateway to test the candidate at
  // GitHub.
  // permission: connection.manage
  rpc TestRotation(TestRotationRequest) returns (TestRotationResponse);
  // ActivateRotation activates a tested candidate. It needs a person's
  // security-key step-up, so over this API it is refused with
  // STEP_UP_REQUIRED; the server page activates.
  // permission: credential.seal
  rpc ActivateRotation(ActivateRotationRequest) returns (ActivateRotationResponse);
  // RollBackRotation restores the old key while the rollback window is open.
  // It needs a person's security-key step-up, so over this API it is refused
  // with STEP_UP_REQUIRED; the server page rolls back.
  // permission: credential.seal
  rpc RollBackRotation(RollBackRotationRequest) returns (RollBackRotationResponse);
  // ConfirmRotation asks the connection's gateway to confirm that GitHub
  // refuses the old key, which is revoked only then.
  // permission: connection.manage
  rpc ConfirmRotation(ConfirmRotationRequest) returns (ConfirmRotationResponse);
  // CancelRotation ends a rotation before activation and revokes its
  // candidate.
  // permission: connection.manage
  rpc CancelRotation(CancelRotationRequest) returns (CancelRotationResponse);
  // GetRotation returns a rotation.
  // permission: connection.read
  rpc GetRotation(GetRotationRequest) returns (GetRotationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListRotations lists a connection's rotations, newest first.
  // permission: connection.read
  rpc ListRotations(ListRotationsRequest) returns (ListRotationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// CredentialRotation is one rotation: ids, states and times, never a key.
message CredentialRotation {
  // Rotation id.
  string id = 1;
  // The connection.
  string connection_id = 2;
  // REQUESTED, CANDIDATE_SEALED, TESTING, ACTIVATING, AWAITING_OLD_REMOVAL,
  // CONFIRMING, CONFIRMED, FAILED or ROLLED_BACK.
  string state = 3;
  // The credential version id that was ACTIVE when it was requested.
  string old_credential_id = 4;
  // The sealed new key's credential version id, once sealed.
  string candidate_credential_id = 5;
  // Digest of the preview the requester confirmed.
  string preview_digest = 6;
  // Who requested it.
  string requested_by = 7;
  // When the candidate passed its test.
  google.protobuf.Timestamp test_pass_time = 8;
  // Who activated it.
  string activated_by = 9;
  // When it was activated.
  google.protobuf.Timestamp activate_time = 10;
  // When the rollback window ends.
  google.protobuf.Timestamp rollback_until = 11;
  // When GitHub's refusal of the old key was confirmed.
  google.protobuf.Timestamp confirm_time = 12;
  // Since when it waits for the old key's removal.
  google.protobuf.Timestamp awaiting_since = 13;
  // Why it ended, when it failed or was rolled back.
  string end_reason = 14;
  // Created.
  google.protobuf.Timestamp create_time = 15;
  // Last changed.
  google.protobuf.Timestamp update_time = 16;
  // Finished.
  google.protobuf.Timestamp finish_time = 17;
}

// RequestRotationRequest opens a rotation.
message RequestRotationRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
  // PreviewCredentialChange's digest for the active credential.
  string preview_digest = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
}

// RequestRotationResponse is the rotation.
message RequestRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// SealRotationCandidateRequest stores a sealed key, as PutCredential does.
message SealRotationCandidateRequest {
  // Rotation id.
  string rotation_id = 1 [(buf.validate.field).string.uuid = true];
  // The stored credential, bound like any upload; kind github_app.
  PutCredentialRequest credential = 2 [(buf.validate.field).required = true];
}

// SealRotationCandidateResponse is the stored metadata: no sealed bytes.
message SealRotationCandidateResponse {
  // The candidate.
  ConnectionCredential credential = 1;
}

// TestRotationRequest names a rotation.
message TestRotationRequest {
  // Rotation id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// TestRotationResponse is the rotation.
message TestRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// ActivateRotationRequest names a rotation.
message ActivateRotationRequest {
  // Rotation id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ActivateRotationResponse is the rotation.
message ActivateRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// RollBackRotationRequest names a rotation.
message RollBackRotationRequest {
  // Rotation id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Why.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// RollBackRotationResponse is the rotation.
message RollBackRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// ConfirmRotationRequest names a rotation.
message ConfirmRotationRequest {
  // Rotation id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ConfirmRotationResponse is the rotation.
message ConfirmRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// CancelRotationRequest names a rotation.
message CancelRotationRequest {
  // Rotation id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Why.
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// CancelRotationResponse is the rotation.
message CancelRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// GetRotationRequest names a rotation.
message GetRotationRequest {
  // Rotation id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetRotationResponse is the rotation.
message GetRotationResponse {
  // The rotation.
  CredentialRotation rotation = 1;
}

// ListRotationsRequest names a connection.
message ListRotationsRequest {
  // Connection id.
  string connection_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListRotationsResponse is the connection's rotations, newest first.
message ListRotationsResponse {
  // The rotations.
  repeated CredentialRotation rotations = 1;
}
