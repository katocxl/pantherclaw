syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ExportDestinationService manages export destinations (G0 M20 D252; F517,
// HR-513; Business edition). A destination is an HTTPS PUT target or an
// S3-compatible bucket that receives evidence packs, proof bundles and
// organization exports. It is created PENDING and receives nothing until a
// person activates it on its page (confirm_url) with a security key; its
// target and data classes never change.
service ExportDestinationService {
  // CreateExportDestination adds a PENDING destination (a person only). The
  // credential is sealed and never returned.
  // permission: siem.manage
  rpc CreateExportDestination(CreateExportDestinationRequest) returns (CreateExportDestinationResponse);
  // GetExportDestination returns one destination and its delivery health.
  // permission: siem.read
  rpc GetExportDestination(GetExportDestinationRequest) returns (GetExportDestinationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListExportDestinations lists destinations that are not disabled.
  // permission: siem.read
  rpc ListExportDestinations(ListExportDestinationsRequest) returns (ListExportDestinationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetExportDestinationState pauses, resumes or disables a destination (a
  // person only). Disabling is final.
  // permission: siem.manage
  rpc SetExportDestinationState(SetExportDestinationStateRequest) returns (SetExportDestinationStateResponse);
  // ReplaceExportDestinationCredential replaces the sealed credential (a
  // person only). The target never changes.
  // permission: siem.manage
  rpc ReplaceExportDestinationCredential(ReplaceExportDestinationCredentialRequest) returns (ReplaceExportDestinationCredentialResponse);
}

// ExportDestination is one export destination. Its credential is never
// returned.
message ExportDestination {
  // Destination id.
  string id = 1;
  // Name.
  string name = 2;
  // https_put or s3.
  string kind = 3;
  // The https URL: the PUT base URL, or the S3 endpoint.
  string url = 4;
  // The S3 bucket.
  string bucket = 5;
  // The S3 region.
  string region = 6;
  // The prefix of every object key.
  string key_prefix = 7;
  // S3 path-style addressing (https://endpoint/bucket/key).
  bool path_style = 8;
  // Whether the target may be a private or loopback address.
  bool internal = 9;
  // The artefacts this destination receives: evidence_packs,
  // payload_captures, proof_bundles, org_exports.
  repeated string data_classes = 10;
  // PENDING, ACTIVE, PAUSED or DISABLED.
  string state = 11;
  // Who created it.
  string created_by = 12;
  // When it was created.
  google.protobuf.Timestamp create_time = 13;
  // Who activated it.
  string activated_by = 14;
  // When it was activated.
  google.protobuf.Timestamp activate_time = 15;
  // The page where a person activates it with a security key.
  string confirm_url = 16;
  // NOT_CONFIRMED, HEALTHY, DEGRADED or FAILING.
  string health = 17;
  // The first delivered push.
  google.protobuf.Timestamp confirm_time = 18;
  // The latest delivered push.
  google.protobuf.Timestamp last_delivered_time = 19;
  // Failed pushes in a row.
  int32 consecutive_failures = 20;
  // When the current run of failures began.
  google.protobuf.Timestamp failing_since = 21;
  // The latest failure's code.
  string last_failure_code = 22;
  // Delivered pushes.
  int64 delivered_pushes = 23;
  // Failed pushes.
  int64 failed_pushes = 24;
  // When the credential was last replaced.
  google.protobuf.Timestamp credential_replace_time = 25;
}

// ExportCredential is what a destination authenticates with: a bearer token
// for https_put, an access key for s3.
message ExportCredential {
  // The bearer token of an https_put destination.
  string bearer_token = 1 [
    debug_redact = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // The access key id of an s3 destination.
  string access_key_id = 2 [(buf.validate.field).string.max_len = 128];
  // The secret access key of an s3 destination.
  string secret_access_key = 3 [
    debug_redact = true,
    (buf.validate.field).string.max_len = 256
  ];
}

// CreateExportDestinationRequest describes a destination.
message CreateExportDestinationRequest {
  // Lowercase letters, digits and dashes.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  // https_put or s3.
  string kind = 2 [(buf.validate.field).string = {
    in: [
      "https_put",
      "s3"
    ]
  }];
  // The https URL: the PUT base URL, or the S3 endpoint.
  string url = 3 [(buf.validate.field).string = {
    min_len: 9
    max_len: 2048
  }];
  // The S3 bucket.
  string bucket = 4 [(buf.validate.field).string.max_len = 63];
  // The S3 region.
  string region = 5 [(buf.validate.field).string.max_len = 32];
  // The prefix of every object key.
  string key_prefix = 6 [(buf.validate.field).string.max_len = 256];
  // S3 path-style addressing.
  bool path_style = 7;
  // Whether the target may be a private or loopback address.
  bool internal = 8;
  // The artefacts this destination receives.
  repeated string data_classes = 9 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
  }];
  // The credential, sealed at rest and never returned.
  ExportCredential credential = 10 [(buf.validate.field).required = true];
}

// CreateExportDestinationResponse is the new destination.
message CreateExportDestinationResponse {
  // The destination.
  ExportDestination destination = 1;
}

// GetExportDestinationRequest names a destination.
message GetExportDestinationRequest {
  // Destination id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetExportDestinationResponse is one destination.
message GetExportDestinationResponse {
  // The destination.
  ExportDestination destination = 1;
}

// ListExportDestinationsRequest is one page.
message ListExportDestinationsRequest {
  // Maximum results (default and at most 200).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // Token from a previous response.
  string page_token = 2 [(buf.validate.field).string.max_len = 256];
}

// ListExportDestinationsResponse is one page.
message ListExportDestinationsResponse {
  // Destinations.
  repeated ExportDestination destinations = 1;
  // Next page token.
  string next_page_token = 2;
}

// SetExportDestinationStateRequest changes a destination's state.
message SetExportDestinationStateRequest {
  // Destination id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // ACTIVE (resume), PAUSED or DISABLED.
  string state = 2 [(buf.validate.field).string = {
    in: [
      "ACTIVE",
      "PAUSED",
      "DISABLED"
    ]
  }];
}

// SetExportDestinationStateResponse is the destination.
message SetExportDestinationStateResponse {
  // The destination.
  ExportDestination destination = 1;
}

// ReplaceExportDestinationCredentialRequest replaces a credential.
message ReplaceExportDestinationCredentialRequest {
  // Destination id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The new credential.
  ExportCredential credential = 2 [(buf.validate.field).required = true];
}

// ReplaceExportDestinationCredentialResponse is the destination.
message ReplaceExportDestinationCredentialResponse {
  // The destination.
  ExportDestination destination = 1;
}
