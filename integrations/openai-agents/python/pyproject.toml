[project]
name = "pantherclaw-openai-agents"
version = "0.0.0"
description = "PantherClaw enforcement for OpenAI Agents SDK function tools: every tool call decided before it runs, refused when PantherClaw cannot decide"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pantherclaw"]

[project.optional-dependencies]
agents = ["openai-agents>=0.23.1,<0.24"]

[dependency-groups]
# The real framework, for the tests only: never shipped or installed with
# the package; uv.lock pins the versions tested.
dev = ["openai-agents==0.23.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantherclaw_openai_agents"]

[tool.uv]
# DEPENDENCY_POLICY: nothing uploaded in the last 7 days is locked (the cooldown).
exclude-newer = "7 days"
# Exception EX-007 (docs/security/GATES_AND_REVIEW.md §4, founder decision
# 2026-10-21): certifi 2026.10.19 fixes PYSEC-2026-4320 / GHSA-6q48-6c7w-9gw2
# inside the cooldown. Remove this line once certifi 2026.10.19 is 7 days old.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.uv.sources]
# The core client from this repository, until it is published.
pantherclaw = { path = "../../../sdk/python", editable = true }
