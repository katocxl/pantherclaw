[project]
name = "pantherclaw-claude-agent-sdk"
version = "0.0.0"
description = "PantherClaw enforcement for the Claude Agent SDK: a PreToolUse hook that fails closed and a can_use_tool that waits on holds"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pantherclaw"]

[project.optional-dependencies]
agent-sdk = ["claude-agent-sdk>=0.2.163,<0.3"]

[dependency-groups]
# The real Agent SDK, for the tests only (tests/test_real_sdk.py): never
# shipped or installed with the package; uv.lock pins the version tested.
dev = ["claude-agent-sdk>=0.2.163,<0.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantherclaw_claude_agent_sdk"]

[tool.uv]
# DEPENDENCY_POLICY: nothing uploaded in the last 7 days is locked (the cooldown).
exclude-newer = "7 days"

[tool.uv.sources]
# The core client from this repository, until it is published.
pantherclaw = { path = "../../../sdk/python", editable = true }
