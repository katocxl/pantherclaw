[project]
name = "pantherclaw-crewai"
version = "0.0.0"
description = "PantherClaw enforcement for CrewAI tools: every tool call decided before it runs, refused when PantherClaw cannot decide"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pantherclaw"]

[project.optional-dependencies]
crewai = ["crewai>=1.15.27,<2"]

[dependency-groups]
# The real framework, for the tests only: never shipped or installed with
# the package; uv.lock pins the version tested. CrewAI supports Python 3.13,
# not 3.14: there the tests run the decision core alone.
dev = ["crewai==1.15.27; python_version < '3.14'"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantherclaw_crewai"]

[tool.uv]
# DEPENDENCY_POLICY: nothing uploaded in the last 7 days is locked (the cooldown).
exclude-newer = "7 days"

[tool.uv.sources]
# The core client from this repository, until it is published.
pantherclaw = { path = "../../../sdk/python", editable = true }
