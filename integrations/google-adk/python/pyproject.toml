[project]
name = "pantherclaw-adk"
version = "0.0.0"
description = "PantherClaw decisions for Google ADK tools: every tool call asked before it runs, refused when PantherClaw cannot decide"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pantherclaw"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantherclaw_adk"]

[tool.uv]
# DEPENDENCY_POLICY: nothing uploaded in the last 7 days is locked (the cooldown).
exclude-newer = "7 days"

[tool.uv.sources]
# The core client from this repository, until it is published.
pantherclaw = { path = "../../../sdk/python", editable = true }
