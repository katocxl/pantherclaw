# One OCSF event per event: what the searches read.
[pantherclaw:ocsf]
KV_MODE = json
SHOULD_LINEMERGE = false

# An export batch as PantherClaw posts it, sent to HEC's raw endpoint: break
# before each event of data.events, strip the batch's closing brackets from
# the last one, drop the envelope, and file each event as pantherclaw:ocsf.
# The webhook signature is not verified: see the README.
[pantherclaw:ocsf:batch]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\[,])\{"class_uid":
TRUNCATE = 0
SEDCMD-pantherclaw_batch_end = s/\]\}\}$//
TIME_PREFIX = "time":
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 13
TRANSFORMS-pantherclaw_batch = pantherclaw_ocsf_drop_envelope, pantherclaw_ocsf_sourcetype
