# Every search ships disabled: turn on the ones you want.

[pc-siem-001 PantherClaw high or critical alert]
search = `pantherclaw_ocsf` class_uid=2004 activity_id=1 severity_id IN (4, 5) NOT "metadata.labels{}"="test"
description = A detection rule raised a HIGH or CRITICAL alert. How the alert knows what it says is in unmapped.pantherclaw_uncertainty: read it before you act.
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1

[pc-siem-002 PantherClaw incident opened]
search = `pantherclaw_ocsf` class_uid=2005 activity_id=1 NOT "metadata.labels{}"="test"
description = An incident was opened or reopened.
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1

[pc-siem-003 PantherClaw denied an agent action]
search = `pantherclaw_ocsf` class_uid=6003 metadata.event_code="receipt.decision" status_id=2 NOT "metadata.labels{}"="test"
description = PantherClaw denied an action or could not authorize it. One denial is the product working; a run of them from one agent is worth a look.
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1

