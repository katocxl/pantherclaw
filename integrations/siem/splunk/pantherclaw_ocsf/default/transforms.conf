# Used by the pantherclaw:ocsf:batch sourcetype in props.conf.
[pantherclaw_ocsf_drop_envelope]
REGEX = ^\{"type":"pantherclaw\.ocsf\.batch"
DEST_KEY = queue
FORMAT = nullQueue

[pantherclaw_ocsf_sourcetype]
REGEX = ^\{"class_uid":
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::pantherclaw:ocsf
