# Reads one PantherClaw export batch per log entry and writes one UDM event
# per entry of data.events, as udm-map.json says. The webhook signature is not
# verified here. Not run against a Chronicle tenant: see the README.
filter {
  json {
    source => "message"
    on_error => "not_json"
  }
  if [not_json] {
    drop { tag => "TAG_MALFORMED_MESSAGE" }
  }
  if [type] != "pantherclaw.ocsf.batch" {
    drop { tag => "TAG_UNSUPPORTED" }
  }
  for index, ev in data.events {
    mutate { remove_field => ["event"] }
    mutate { replace => { "ocsf_test" => "false" } }
    for _, label in ev.metadata.labels {
      if [label] == "test" {
        mutate { replace => { "ocsf_test" => "true" } }
      }
    }
    mutate {
      convert => {
        "ev.class_uid" => "string"
        "ev.activity_id" => "string"
        "ev.severity_id" => "string"
        "ev.status_id" => "string"
      }
      on_error => "no_number"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.vendor_name" => "%{ev.metadata.product.vendor_name}"
        "event.idm.read_only_udm.metadata.product_name" => "%{ev.metadata.product.name}"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{ev.metadata.event_code}"
      }
    }
    mutate {
      replace => {
        "field_ocsf_class_uid.key" => "ocsf_class_uid"
        "field_ocsf_class_uid.value.string_value" => "%{ev.class_uid}"
      }
      on_error => "no_ocsf_class_uid"
    }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_class_uid" } }
    mutate {
      replace => {
        "field_ocsf_activity_id.key" => "ocsf_activity_id"
        "field_ocsf_activity_id.value.string_value" => "%{ev.activity_id}"
      }
      on_error => "no_ocsf_activity_id"
    }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_activity_id" } }
    mutate {
      replace => {
        "field_ocsf_severity_id.key" => "ocsf_severity_id"
        "field_ocsf_severity_id.value.string_value" => "%{ev.severity_id}"
      }
      on_error => "no_ocsf_severity_id"
    }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_severity_id" } }
    mutate {
      replace => {
        "field_ocsf_status_id.key" => "ocsf_status_id"
        "field_ocsf_status_id.value.string_value" => "%{ev.status_id}"
      }
      on_error => "no_ocsf_status_id"
    }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_status_id" } }
    mutate {
      replace => {
        "field_ocsf_test.key" => "ocsf_test"
        "field_ocsf_test.value.string_value" => "%{ocsf_test}"
      }
      on_error => "no_ocsf_test"
    }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_test" } }
    mutate { merge => { "@output" => "event" } }
  }
}
