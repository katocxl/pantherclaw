# Reads one PantherClaw OCSF event per log line into UDM, as udm-map.json says.
# Not run against a Chronicle tenant: see the README.
filter {
  mutate { replace => { "ocsf_test" => "false" } }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop { tag => "TAG_MALFORMED_MESSAGE" }
  }
  if [metadata][labels][0] == "test" {
    mutate { replace => { "ocsf_test" => "true" } }
  }
  mutate {
    convert => {
      "class_uid" => "string"
      "activity_id" => "string"
      "severity_id" => "string"
      "status_id" => "string"
    }
    on_error => "no_number"
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "event.idm.read_only_udm.metadata.vendor_name" => "%{metadata.product.vendor_name}"
      "event.idm.read_only_udm.metadata.product_name" => "%{metadata.product.name}"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{metadata.event_code}"
    }
  }
  mutate {
    replace => {
      "field_ocsf_class_uid.key" => "ocsf_class_uid"
      "field_ocsf_class_uid.value.string_value" => "%{class_uid}"
    }
    on_error => "no_ocsf_class_uid"
  }
  mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_class_uid" } }
  mutate {
    replace => {
      "field_ocsf_activity_id.key" => "ocsf_activity_id"
      "field_ocsf_activity_id.value.string_value" => "%{activity_id}"
    }
    on_error => "no_ocsf_activity_id"
  }
  mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_activity_id" } }
  mutate {
    replace => {
      "field_ocsf_severity_id.key" => "ocsf_severity_id"
      "field_ocsf_severity_id.value.string_value" => "%{severity_id}"
    }
    on_error => "no_ocsf_severity_id"
  }
  mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_severity_id" } }
  mutate {
    replace => {
      "field_ocsf_status_id.key" => "ocsf_status_id"
      "field_ocsf_status_id.value.string_value" => "%{status_id}"
    }
    on_error => "no_ocsf_status_id"
  }
  mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_status_id" } }
  mutate {
    replace => {
      "field_ocsf_test.key" => "ocsf_test"
      "field_ocsf_test.value.string_value" => "%{ocsf_test}"
    }
    on_error => "no_ocsf_test"
  }
  mutate { merge => { "event.idm.read_only_udm.additional.fields" => "field_ocsf_test" } }
  mutate { merge => { "@output" => "event" } }
}
