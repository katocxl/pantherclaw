# SPDX-License-Identifier: Apache-2.0
# Splits each PantherClaw export batch into one document per OCSF event and
# indexes it into logs-pantherclaw.ocsf-default. The webhook signature is not
# verified here: see the README.
input {
  http {
    port => 8443
    ssl_enabled => true
    ssl_certificate => "/etc/logstash/certs/pantherclaw.crt"
    ssl_key => "/etc/logstash/certs/pantherclaw.key"
  }
}

filter {
  if [type] != "pantherclaw.ocsf.batch" {
    drop {}
  }
  split {
    field => "[data][events]"
  }
  mutate {
    rename => {
      "[data][events][class_uid]" => "[class_uid]"
      "[data][events][class_name]" => "[class_name]"
      "[data][events][category_uid]" => "[category_uid]"
      "[data][events][category_name]" => "[category_name]"
      "[data][events][activity_id]" => "[activity_id]"
      "[data][events][activity_name]" => "[activity_name]"
      "[data][events][type_uid]" => "[type_uid]"
      "[data][events][time]" => "[time]"
      "[data][events][severity_id]" => "[severity_id]"
      "[data][events][severity]" => "[severity]"
      "[data][events][status_id]" => "[status_id]"
      "[data][events][status]" => "[status]"
      "[data][events][status_detail]" => "[status_detail]"
      "[data][events][message]" => "[message]"
      "[data][events][metadata]" => "[metadata]"
      "[data][events][actor]" => "[actor]"
      "[data][events][api]" => "[api]"
      "[data][events][src_endpoint]" => "[src_endpoint]"
      "[data][events][authorizations]" => "[authorizations]"
      "[data][events][user]" => "[user]"
      "[data][events][entity]" => "[entity]"
      "[data][events][finding_info]" => "[finding_info]"
      "[data][events][finding_info_list]" => "[finding_info_list]"
      "[data][events][resources]" => "[resources]"
      "[data][events][unmapped]" => "[unmapped]"
    }
  }
  mutate {
    remove_field => ["[data]", "[type]", "[http]", "[url]", "[user_agent]", "[host]", "[event]", "[@version]"]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "pantherclaw.ocsf"
    data_stream_namespace => "default"
  }
}
